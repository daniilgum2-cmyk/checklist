<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SMC - Структура рынка</title>
<style>
/* Тёмная тема под график: фон приложения чуть темнее полотна свечей,
   игровой слой — один синий акцент, чтобы не спорить с зелёным/красным. */
:root{
  --bg:#0d1017;
  --surface:#161b26;
  --surface2:#1d2432;
  --line:#252c3b;
  --txt:#e8ecf4;
  --dim:#8b93a7;
  --accent:#5B8CFF;
  --good:#26D07C;
  --bad:#FF5B5B;
  --chart:#131722;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Helvetica Neue",sans-serif;
  overscroll-behavior:none;
}
#app{display:flex;flex-direction:column;min-height:100%;max-width:1180px;margin:0 auto}

/* ───────── шапка ───────── */
.hdr{
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
}
.hdr-title{font-weight:640;font-size:15px;flex:1;letter-spacing:-.2px}
.hdr-stats{display:flex;gap:6px}
/* фиксированная высота: эмодзи 🔥 в чипе стрика выше текста и раздвигало шапку,
   а от её высоты считается высота игрового экрана */
.chip{
  display:inline-flex;align-items:center;height:26px;line-height:1;
  background:var(--surface2);border-radius:999px;padding:0 10px;
  font-size:12.5px;font-weight:600;color:var(--dim);
}
.chip.xp{color:var(--accent)}
/* та же высота, что у чипов: иначе шапка на игровом экране выше, чем на карте,
   и посчитанная от неё высота экрана даёт лишнюю прокрутку */
.icon-btn{
  background:none;border:0;color:var(--txt);font-size:26px;line-height:1;
  width:30px;height:26px;padding:0;cursor:pointer;margin-left:-6px;
}
.hidden{display:none !important}
.loading{padding:60px 20px;text-align:center;color:var(--dim)}

/* ───────── экраны ───────── */
.screen{display:none;padding:14px;flex:1;min-height:0}
.screen.on{display:block}
.screen.play.on{display:flex;flex-direction:column;gap:12px}

/* ───────── карта уровней ───────── */
.mod-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.mod-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mod-kicker{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.mod-title{margin:2px 0 0;font-size:22px;letter-spacing:-.5px}
.mod-count{color:var(--dim);font-size:13px;white-space:nowrap;padding-top:14px}
.mod-bar{height:6px;background:var(--surface2);border-radius:3px;margin:12px 0 10px;overflow:hidden}
.mod-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.mod-note{margin:0;color:var(--dim);font-size:13px}

.level-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.lvl{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;color:var(--txt);font:inherit;cursor:pointer;
}
.lvl:active{transform:scale(.995)}
.lvl.locked{opacity:.5;cursor:default}
.lvl.done{border-color:rgba(38,208,124,.35)}
.lvl.boss{border-color:rgba(91,140,255,.5);background:linear-gradient(180deg,var(--surface),rgba(91,140,255,.08))}
.lvl-id{
  flex:0 0 38px;height:38px;border-radius:11px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--accent);
}
.lvl.done .lvl-id{background:rgba(38,208,124,.14);color:var(--good)}
.lvl-main{flex:1;min-width:0;display:flex;flex-direction:column}
.lvl-title{font-weight:600;letter-spacing:-.2px}
.lvl-sub{color:var(--dim);font-size:12.5px;margin-top:1px}
.lvl-stars{display:flex;gap:2px;font-size:13px;color:var(--surface2)}
.lvl-stars i{font-style:normal;color:#39414f}
.lvl-stars i.on{color:#F5C451}
.soon{margin:14px 2px 0;color:var(--dim);font-size:12.5px;text-align:center;line-height:1.5}

/* ───────── теория ───────── */
.theory{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.theory h2{margin:0 0 10px;font-size:20px;letter-spacing:-.4px}
.theory ul{margin:0;padding-left:18px;color:#cfd6e4}
.theory li{margin-bottom:7px}
.demo{margin-top:14px}
.demo-chart{height:190px;border-radius:12px;overflow:hidden;background:var(--chart);border:1px solid var(--line)}
.demo-cap{color:var(--dim);font-size:12px;margin-top:6px;text-align:center}

/* ───────── практика ───────── */
.play-chart{display:flex;flex-direction:column;gap:8px;min-height:0}
.task-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.tag{background:var(--surface2);color:var(--accent);border-radius:6px;padding:3px 7px;font-weight:700;font-size:11px}
.dots{display:flex;gap:4px;flex:1}
.dots i{width:16px;height:3px;border-radius:2px;background:var(--surface2)}
.dots i.past{background:var(--good)}
.dots i.cur{background:var(--accent)}
.caption{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.chart-wrap{position:relative;flex:1;min-height:0}
.chart-box{
  height:100%;width:100%;border-radius:12px;overflow:hidden;
  background:var(--chart);border:1px solid var(--line);position:relative;
}
.gc-canvas{display:block;touch-action:none;user-select:none}
.chart-tag{
  position:absolute;top:7px;left:9px;z-index:2;font-size:10.5px;font-weight:700;
  color:var(--dim);background:rgba(19,23,34,.8);padding:2px 6px;border-radius:5px;
}

.play-side{display:flex;flex-direction:column;gap:10px}
.prompt{font-size:16px;font-weight:620;letter-spacing:-.2px}
.hint{color:var(--dim);font-size:13px;margin-top:-4px}
.options{display:flex;flex-direction:column;gap:8px}
.opt{
  text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;color:var(--txt);font:inherit;cursor:pointer;
}
.opt.sel{border-color:var(--accent);background:rgba(91,140,255,.12)}
.opt.right{border-color:var(--good);background:rgba(38,208,124,.12);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:rgba(255,91,91,.1);color:var(--bad)}
.counter{color:var(--dim);font-size:13px}
.counter span{color:var(--accent);font-weight:700}

.tip{
  border-radius:12px;padding:10px 13px;font-size:13.5px;line-height:1.45;
  background:rgba(245,196,81,.09);border:1px solid rgba(245,196,81,.4);color:#e6dcc4;
  animation:tipIn .18s ease-out;
}
.tip b{color:#F5C451}
@keyframes tipIn{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.hint-btn{
  flex:0 0 auto;background:transparent;color:#F5C451;
  border:1px solid rgba(245,196,81,.45);padding:14px 16px;
}
.hint-btn:disabled{color:#6c6a5c;border-color:var(--line);cursor:default}

.sheet{display:flex;flex-direction:column;gap:10px}
.feedback{display:none}
.feedback.on{
  display:block;border-radius:12px;padding:12px 14px;font-size:13.5px;
  background:var(--surface);border:1px solid var(--line);
}
.feedback.good{border-color:rgba(38,208,124,.4);background:rgba(38,208,124,.08)}
.feedback.bad{border-color:rgba(255,91,91,.4);background:rgba(255,91,91,.08)}
.feedback.part{border-color:rgba(245,196,81,.45);background:rgba(245,196,81,.09)}
.feedback.part .fb-head{color:#F5C451}
.fb-head{font-weight:700;margin-bottom:4px}
.feedback.good .fb-head{color:var(--good)}
.feedback.bad .fb-head{color:var(--bad)}
.fb-right{color:var(--txt);font-weight:600;margin-bottom:5px}
.fb-text{color:#c6cddb;line-height:1.5}

/* ───────── кнопки и итог ───────── */
.actions{display:flex;gap:8px;padding-bottom:env(safe-area-inset-bottom)}
.actions.col{flex-direction:column}
.btn{
  flex:1;border:0;border-radius:13px;padding:14px 18px;font:inherit;font-weight:650;
  cursor:pointer;letter-spacing:-.2px;min-height:50px;
}
.btn.primary{background:var(--accent);color:#0b1020}
.btn.primary:disabled{background:var(--surface2);color:#5d6577;cursor:default}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
.btn:active:not(:disabled){filter:brightness(.94)}

.result{text-align:center;padding:30px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.res-stars{font-size:34px;letter-spacing:6px;color:#39414f}
.res-stars i{font-style:normal}
.res-stars i.on{color:#F5C451}
.result h2{margin:8px 0 4px;font-size:22px;letter-spacing:-.4px}
.res-score{color:var(--accent);font-weight:700}
.res-note{color:var(--dim);font-size:13.5px;margin:10px auto 22px;max-width:340px}

/* ───────── мобильная раскладка ───────── */
@media (max-width:759px){
  /* Экран ровно в высоту вьюпорта (её меряем в JS), график забирает остаток -
     так он максимально большой и при этом кнопка всегда на экране без прокрутки */
  .screen.play.on{
    flex:0 0 auto;overflow:hidden;padding-bottom:14px;
    height:calc(var(--vh, 100dvh) - var(--hdr, 58px));
  }
  .play-chart{flex:1 1 auto;min-height:0}
  .chart-wrap{flex:1 1 auto;min-height:120px}
  .play-chart.dual .chart-wrap.second{flex:0 0 40%}
  .play-side{flex:0 0 auto}
  /* Разбор остаётся в потоке и отбирает высоту у графика, а не накрывает его:
     под шторкой прятались как раз подсвеченные ответы в нижней части свечей. */
  .sheet.open{animation:sheetUp .18s ease-out}
  @keyframes sheetUp{from{transform:translateY(14px);opacity:.3}to{transform:none;opacity:1}}
}

/* ───────── десктоп: график слева, панель справа ───────── */
@media (min-width:760px){
  .screen{padding:20px}
  /* высоту шапки меряем в JS (--hdr): у разных клиентов Telegram она разная,
     а игровой экран должен ровно вписываться без прокрутки */
  /* flex:0 0 auto обязателен: у flex-элемента с basis:0 высота игнорируется,
     и экран растягивался по содержимому вместо окна */
  .screen.play.on{
    flex:0 0 auto;overflow:hidden;
    flex-direction:row;gap:20px;align-items:stretch;
    height:calc(var(--vh, 100dvh) - var(--hdr, 58px));
  }
  .play-chart{flex:1;min-width:0}
  .chart-wrap{min-height:0}
  .chart-wrap.second{flex:0 0 28%;max-height:260px}
  .play-side{
    flex:0 0 340px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:18px;overflow-y:auto;
  }
  .play-side .sheet{margin-top:auto;display:flex;flex-direction:column;gap:10px}
  .theory,.result{max-width:640px;margin:0 auto}
  .actions{max-width:640px;margin:14px auto 0}
  .demo-chart{height:230px}
  .lvl:hover:not(.locked){border-color:#39445c}
  .opt:hover{border-color:#39445c}
}

</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

  <!-- ─────────── практика ─────────── -->

      <div class="actions col">
        <button id="btnNextMod" class="btn primary hidden">К следующему модулю</button>
        <button id="btnToMap" class="btn primary">К уровням</button>
        <button id="btnAgain" class="btn ghost">Перепройти</button>
      </div>
    </div>
  </section>

  ref: { line: Palette.good, fill: 'rgba(38,208,124,.16)' },
  mine: { line: Palette.accent, fill: 'rgba(91,140,255,.16)', dash: [4, 3] },
  // нейтральный белый, а не синий: синим рисуется рамка самого игрока,
  // и две синие пунктирные рамки на одном графике не отличить
  ask: { line: 'rgba(232,236,244,.75)', fill: 'rgba(232,236,244,.07)', dash: [5, 4] },
  ob: { line: Palette.ob, fill: 'rgba(255,179,71,.15)' },
  fvg: { line: Palette.fvg, fill: 'rgba(155,140,255,.15)' },
  dead: { line: 'rgba(255,255,255,.35)', fill: 'rgba(255,255,255,.06)', dash: [3, 3] },
};

class GameChart {
  constructor(el, opts = {}) {
    this.el = el;
    this.canvas = document.createElement('canvas');
    this.canvas.className = 'gc-canvas';
    el.appendChild(this.canvas);
    this.ctx = this.canvas.getContext('2d');
    this.opts = opts;

    this.data = null;
    this.mode = 'none';        // none | tap | zone
    this.max = 1;              // сколько свечей можно отметить
    this.sel = [];             // выбор игрока (индексы свечей)
    this.zone = null;          // выбор игрока (рамка)
    this.anns = [];            // разметка: pivot / level / mark / zone
    this.judge = null;         // {ok:[i], bad:[i]} — раскраска после ответа
    this.locked = false;
    this.hover = null;

    this._drag = null;
    this._ro = new ResizeObserver(() => this.resize());
    this._ro.observe(el);
    this._bind();
    this.resize();
  }

  destroy() {
    this._ro.disconnect();
    this.canvas.remove();
  }

  /* ─────────── данные и состояние ─────────── */

  setData(ds) {
    this.data = ds;
    this.sel = [];
    this.zone = null;
    this.anns = [];
    this.judge = null;
    this.locked = false;
    this._calcScale();
    this.draw();
  }

  setMode(mode, max = 1) {
    this.mode = mode;
    this.max = max;
    this.canvas.style.cursor = mode === 'none' ? 'default' : 'crosshair';
    this.draw();
  }

  setAnnotations(list) { this.anns = list || []; this.draw(); }
  setJudge(j) { this.judge = j; this.locked = true; this.draw(); }
  clearSelection() { this.sel = []; this.zone = null; this.judge = null; this.locked = false; this.draw(); }

  _calcScale() {
    const d = this.data;
    if (!d) return;
    let hi = -Infinity, lo = Infinity;
    for (let i = 0; i < d.c.length; i++) { hi = Math.max(hi, d.h[i]); lo = Math.min(lo, d.l[i]); }
    const pad = (hi - lo) * 0.08 || 1;
    this.hi = hi + pad;
    this.lo = lo - pad;
  }

  /* ─────────── геометрия ─────────── */

  /* Размер берём синхронно, а не в rAF: когда Mini App стартует в фоне или
     вкладка скрыта, кадры не идут — график остался бы нулевого размера. */
  ensureSize() { if (!this.w) this.resize(); }

  resize() {
    const r = this.el.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    this.w = r.width;
    this.h = r.height;
    this.canvas.width = Math.round(r.width * dpr);
    this.canvas.height = Math.round(r.height * dpr);
    this.canvas.style.width = r.width + 'px';
    this.canvas.style.height = r.height + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.draw();
  }

  get padR() { return this.w < 420 ? 46 : 58; }
  get padB() { return 18; }
  get padT() { return 6; }
  get padL() { return 4; }
  get plotW() { return Math.max(10, this.w - this.padL - this.padR); }
  get plotH() { return Math.max(10, this.h - this.padT - this.padB); }

  xOf(i) {                       // центр свечи i
    const n = this.data.c.length;
    return this.padL + (i + 0.5) * (this.plotW / n);
  }
  iOf(x) {
    const n = this.data.c.length;
    const i = Math.floor((x - this.padL) / (this.plotW / n));
    return Math.max(0, Math.min(n - 1, i));
  }
  yOf(p) {
    return this.padT + (this.hi - p) / (this.hi - this.lo) * this.plotH;
  }
  pOf(y) {
    return this.hi - (y - this.padT) / this.plotH * (this.hi - this.lo);
  }

  /* ─────────── ввод: палец и мышь одним кодом ─────────── */

  _bind() {
    const c = this.canvas;
    const pos = e => {
      const r = c.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    };

    c.addEventListener('pointerdown', e => {
      if (this.locked || this.mode === 'none' || !this.data) return;
      try { c.setPointerCapture(e.pointerId); } catch (err) {}   // без захвата всё равно работает
      const p = pos(e);
      this._drag = { x0: p.x, y0: p.y, x: p.x, y: p.y, moved: false };
      if (this.mode === 'zone') { this.zone = null; this.draw(); }
      e.preventDefault();
    });

    c.addEventListener('pointermove', e => {
      const p = pos(e);
      if (!this._drag) {
        if (e.pointerType === 'mouse' && this.mode !== 'none' && !this.locked && this.data) {
          const i = this.iOf(p.x);
          if (i !== this.hover) { this.hover = i; this.draw(); }
        }
        return;
      }
      this._drag.x = p.x; this._drag.y = p.y;
      if (Math.abs(p.x - this._drag.x0) > 6 || Math.abs(p.y - this._drag.y0) > 6) this._drag.moved = true;
      if (this.mode === 'zone' && this._drag.moved) {
        this.zone = this._boxFromDrag();
        this.draw();
      }
      e.preventDefault();
    });

    const end = e => {
      if (!this._drag) return;
      const d = this._drag;
      this._drag = null;
      if (this.mode === 'tap' && !d.moved) this._tap(this.iOf(d.x));
      if (this.mode === 'zone') {
        if (d.moved) {
          this.zone = this._boxFromDrag(d);
          if (this.opts.onZone) this.opts.onZone(this.zone);
        }
        this.draw();
      }
      if (e) e.preventDefault();
    };
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', end);
    c.addEventListener('pointerleave', () => {
      if (this.hover !== null) { this.hover = null; this.draw(); }
    });
    c.addEventListener('contextmenu', e => e.preventDefault());
  }

  _boxFromDrag(d) {
    const g = d || this._drag;
    const i0 = this.iOf(Math.min(g.x0, g.x)), i1 = this.iOf(Math.max(g.x0, g.x));
    const p1 = this.pOf(Math.min(g.y0, g.y)), p0 = this.pOf(Math.max(g.y0, g.y));
    return { x0: i0, x1: i1, y0: p0, y1: p1 };
  }

  _tap(i) {
    const at = this.sel.indexOf(i);
    if (at >= 0) this.sel.splice(at, 1);
    else {
      if (this.sel.length >= this.max) this.sel.shift();   // сверх лимита — вытесняем самый старый
      this.sel.push(i);
    }
    this.draw();
    if (this.opts.onSelect) this.opts.onSelect(this.sel.slice());
  }

  /* ─────────── отрисовка ─────────── */

  /* Подписи зон складывались в кашу, когда зоны лежат друг на друге:
     каждая следующая на занятой строке сдвигается вниз. */
  _labelRow(y) {
    let yy = y;
    while (this._rows.some(r => Math.abs(r - yy) < 12)) yy += 12;
    this._rows.push(yy);
    return yy;
  }

  draw() {
    this.ensureSize();
    const x = this.ctx;
    if (!x || !this.w) return;
    this._rows = [];
    x.clearRect(0, 0, this.w, this.h);
    x.fillStyle = Palette.bg;
    x.fillRect(0, 0, this.w, this.h);
    if (!this.data) return;

    this._grid();
    this._zones();
    this._candles();
    this._levels();
    this._selection();
    this._marks();
    this._axes();
  }

  _grid() {
    const x = this.ctx;
    x.strokeStyle = Palette.grid;
    x.lineWidth = 1;
    x.beginPath();
    for (let k = 0; k <= 4; k++) {
      const y = Math.round(this.padT + this.plotH * k / 4) + 0.5;
      x.moveTo(this.padL, y); x.lineTo(this.padL + this.plotW, y);
    }
    x.stroke();
  }

  _candles() {
    const x = this.ctx, d = this.data, n = d.c.length;
    const step = this.plotW / n;
    const bw = Math.max(1.5, step * 0.66);
    for (let i = 0; i < n; i++) {
      const up = d.c[i] >= d.o[i];
      const col = up ? Palette.bull : Palette.bear;
      const cx = this.xOf(i);
      const dim = this.judge && this.judge.dim;
      x.globalAlpha = dim ? 0.55 : 1;
      x.strokeStyle = col;
      x.fillStyle = col;
      x.lineWidth = Math.max(1, Math.min(1.6, step * 0.14));
      x.beginPath();
      x.moveTo(Math.round(cx) + 0.5, this.yOf(d.h[i]));
      x.lineTo(Math.round(cx) + 0.5, this.yOf(d.l[i]));
      x.stroke();
      const yo = this.yOf(d.o[i]), yc = this.yOf(d.c[i]);
      const top = Math.min(yo, yc), hgt = Math.max(1.2, Math.abs(yc - yo));
      x.fillRect(cx - bw / 2, top, bw, hgt);
      x.globalAlpha = 1;
    }
  }

  _zones() {
    const x = this.ctx;
    for (const a of this.anns) {
      if (a.type !== 'zone') continue;
      const x0 = this.xOf(a.x0) - this.plotW / this.data.c.length / 2;
      const x1 = this.xOf(a.x1) + this.plotW / this.data.c.length / 2;
      const y0 = this.yOf(a.y1), y1 = this.yOf(a.y0);
      const t = ZONE_TONE[a.mine ? 'mine' : (a.tone || 'ref')] || ZONE_TONE.ref;
      x.globalAlpha = a.dim ? 0.5 : 1;
      x.fillStyle = t.fill;
      x.fillRect(x0, y0, x1 - x0, y1 - y0);
      x.strokeStyle = t.line;
      x.setLineDash(t.dash || []);
      x.lineWidth = 1.5;
      x.strokeRect(x0, y0, x1 - x0, y1 - y0);
      x.setLineDash([]);
      if (a.label) {
        x.fillStyle = t.line;
        x.font = '600 10px -apple-system, system-ui, sans-serif';
        const tw = x.measureText(a.label).width;
        const lx = Math.min(x0 + 4, this.padL + this.plotW - tw - 2);
        x.fillText(a.label, lx, this._labelRow(Math.max(this.padT + 10, y0 - 4)));
      }
      x.globalAlpha = 1;
    }
    // рамка, которую тянет игрок прямо сейчас
    if (this.zone && !this.locked) {
      const s = this.plotW / this.data.c.length / 2;
      const x0 = this.xOf(this.zone.x0) - s, x1 = this.xOf(this.zone.x1) + s;
      const y0 = this.yOf(this.zone.y1), y1 = this.yOf(this.zone.y0);
      x.fillStyle = Palette.zone;
      x.fillRect(x0, y0, x1 - x0, y1 - y0);
      x.strokeStyle = Palette.accent;
      x.lineWidth = 1.5;
      x.setLineDash([4, 3]);
      x.strokeRect(x0, y0, x1 - x0, y1 - y0);
      x.setLineDash([]);
    }
  }

  _levels() {
    const x = this.ctx;
    for (const a of this.anns) {
      if (a.type !== 'level') continue;
      const y = Math.round(this.yOf(a.price)) + 0.5;
      x.strokeStyle = a.dim ? 'rgba(255,255,255,.28)' : Palette.accent;
      x.lineWidth = 1.5;
      x.setLineDash([5, 4]);
      x.beginPath();
      x.moveTo(this.xOf(Math.max(0, a.i0)), y);
      x.lineTo(this.xOf(Math.min(this.data.c.length - 1, a.i1 + 2)), y);
      x.stroke();
      x.setLineDash([]);
    }
  }

  _selection() {
    const x = this.ctx, n = this.data.c.length;
    const step = this.plotW / n;
    // Полоса заметно шире свечи плюс «язычок» сверху: узкая колонка в цвет
    // свечей читалась как ещё одна свеча, а не как выбор игрока.
    const paint = (i, color, fill, solid) => {
      const cx = this.xOf(i);
      const w = Math.max(11, step * 1.7);
      x.fillStyle = fill;
      x.fillRect(cx - w / 2, this.padT, w, this.plotH);
      if (!solid) return;
      x.fillStyle = color;
      x.beginPath();
      x.moveTo(cx, this.padT + 9);
      x.lineTo(cx - 5, this.padT);
      x.lineTo(cx + 5, this.padT);
      x.closePath();
      x.fill();
      x.fillRect(cx - w / 2, this.padT + this.plotH - 2, w, 2);
    };
    if (this.hover !== null && !this.locked && this.mode === 'tap' && !this.sel.includes(this.hover)) {
      paint(this.hover, 'rgba(255,255,255,.18)', 'rgba(255,255,255,.05)');
    }
    if (this.judge) {
      for (const i of this.judge.ok || []) paint(i, Palette.good, 'rgba(38,208,124,.16)', true);
      for (const i of this.judge.bad || []) paint(i, Palette.bad, 'rgba(255,91,91,.16)', true);
    } else {
      for (const i of this.sel) paint(i, Palette.accent, 'rgba(91,140,255,.18)', true);
    }
  }

  _marks() {
    const x = this.ctx;
    for (const a of this.anns) {
      if (a.type === 'pivot') {
        const cx = this.xOf(a.i);
        const up = a.dir === 'H';
        const y = up ? this.yOf(this.data.h[a.i]) - 7 : this.yOf(this.data.l[a.i]) + 7;
        x.fillStyle = a.miss ? Palette.miss : (a.dim ? 'rgba(255,255,255,.45)' : Palette.good);
        x.beginPath();
        x.moveTo(cx, up ? y + 5 : y - 5);
        x.lineTo(cx - 4.5, up ? y - 2 : y + 2);
        x.lineTo(cx + 4.5, up ? y - 2 : y + 2);
        x.closePath();
        x.fill();
      }
      if (a.type === 'mark') {
        const cx = this.xOf(a.i);
        const up = a.dir === 1;
        const y = up ? this.yOf(this.data.h[a.i]) - 10 : this.yOf(this.data.l[a.i]) + 10;
        const col = a.dim ? 'rgba(255,255,255,.5)' : (a.label === '?' ? Palette.accent : Palette.good);
        x.font = '700 10px -apple-system, system-ui, sans-serif';
        const tw = x.measureText(a.label).width;
        const bx = Math.max(2, Math.min(this.padL + this.plotW - tw - 10, cx - tw / 2 - 4));
        const by = up ? y - 12 : y;
        x.fillStyle = 'rgba(19,23,34,.92)';
        x.strokeStyle = col;
        x.lineWidth = 1;
        x.beginPath();
        x.roundRect(bx, by, tw + 8, 14, 3);
        x.fill(); x.stroke();
        x.fillStyle = col;
        x.fillText(a.label, bx + 4, by + 10);
      }
    }
  }

  _axes() {
    const x = this.ctx, d = this.data;
    x.font = '10px -apple-system, system-ui, sans-serif';
    x.fillStyle = Palette.axis;
    x.textAlign = 'left';
    for (let k = 0; k <= 4; k++) {
      const p = this.hi - (this.hi - this.lo) * k / 4;
      const y = this.padT + this.plotH * k / 4;
      x.fillText(fmtPrice(p), this.padL + this.plotW + 5, Math.min(this.h - 2, y + 3));
    }
    const n = d.c.length;
    const marks = this.w < 420 ? 3 : 5;
    x.textAlign = 'center';
    for (let k = 0; k < marks; k++) {
      const i = Math.round((n - 1) * k / (marks - 1));
      const t = d.t0 + i * d.step;
      const lab = fmtTime(t, d.step);
      const half = x.measureText(lab).width / 2 + 2;   // крайние подписи не режем о край канваса
      const cx = Math.max(half, Math.min(this.padL + this.plotW - half, this.xOf(i)));
      x.fillText(lab, cx, this.h - 5);
    }
    x.textAlign = 'left';
  }
}

function fmtPrice(p) {
  if (p >= 10000) return Math.round(p).toLocaleString('ru-RU');
  if (p >= 100) return p.toFixed(1);
  return p.toFixed(2);
}

function fmtTime(ms, step) {
  const d = new Date(ms);
  const p2 = v => String(v).padStart(2, '0');
  const day = `${p2(d.getUTCDate())}.${p2(d.getUTCMonth() + 1)}`;
  if (step >= 14400000) return day;
  return `${day} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`;
}

</script>
<script>
/* Прогресс игрока: Telegram CloudStorage + зеркало в localStorage.

   Схема та же, что в леджере: облако — источник правды между устройствами,
   localStorage — чтобы игра работала и в обычном браузере, и когда облако
   недоступно. Счётчик rev не даёт старому снимку затереть свежий.
*/
const KEY = 'smcgame_m1_v1';

const Progress = (() => {
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  const vAtLeast = v => { try { return tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v); } catch (e) { return false; } };
  const cloud = (tg && tg.CloudStorage && vAtLeast('6.9')) ? tg.CloudStorage : null;

  const blank = () => ({ v: 1, rev: 0, xp: 0, streak: 0, streakBest: 0, levels: {} });
  let S = blank();
  let saveTimer = null;

  function lsLoad() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function lsSave() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  function cloudLoad() {
    return new Promise(res => {
      if (!cloud) return res(null);
      let done = false;
      const finish = v => { if (!done) { done = true; res(v); } };
      setTimeout(() => finish(null), 2500);   // облако иногда молчит — не держим старт игры
      try {
        cloud.getItem(KEY, (err, val) => {
          if (err || !val) return finish(null);
          try { finish(JSON.parse(val)); } catch (e) { finish(null); }
        });
      } catch (e) { finish(null); }
    });
  }

  function cloudSave() {
    if (!cloud) return;
    try { cloud.setItem(KEY, JSON.stringify(S), () => {}); } catch (e) {}
  }

  async function init() {
    const local = lsLoad();
    const remote = await cloudLoad();
    const best = [local, remote].filter(Boolean).sort((a, b) => (b.rev || 0) - (a.rev || 0))[0];
    S = best ? Object.assign(blank(), best) : blank();
    if (!S.levels) S.levels = {};
    lsSave();
    return S;
  }

  function save() {
    S.rev = (S.rev || 0) + 1;
    lsSave();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(cloudSave, 400);   // не дёргаем облако на каждый тап
  }

  return {
    get state() { return S; },
    init,
    cloud: !!cloud,

    level(id) { return S.levels[id] || { stars: 0, best: 0, done: false, runs: 0 }; },
    unlocked(ids, id) {
      const i = ids.indexOf(id);
      if (i <= 0) return true;
      return this.level(ids[i - 1]).done;
    },
    addXp(n) { S.xp += n; save(); },
    hit(ok) {
      S.streak = ok ? S.streak + 1 : 0;
      if (S.streak > S.streakBest) S.streakBest = S.streak;
      save();
      return S.streak;
    },
    finishLevel(id, stars, score) {
      const cur = this.level(id);
      S.levels[id] = {
        stars: Math.max(cur.stars, stars),
        best: Math.max(cur.best, score),
        done: cur.done || stars > 0,
        runs: (cur.runs || 0) + 1,
      };
      save();
    },
    reset() { S = blank(); save(); },
  };
})();

</script>
<script>
/* Игровой цикл: карта уровней → теория → практика → разбор → итог. */

const $ = s => document.querySelector(s);
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const haptic = (t = 'light') => {
  try {
    if (!tg || !tg.HapticFeedback) return;
    if (t === 'ok' || t === 'error' || t === 'warning') tg.HapticFeedback.notificationOccurred(t === 'ok' ? 'success' : t);
    else tg.HapticFeedback.impactOccurred(t);
  } catch (e) {}
};

/* Модули 3-5 показываем заглушками: пусть видно, куда идёт курс. */
const SOON = [
  { n: 3, title: 'Fair Value Gap' },
  { n: 4, title: 'Ликвидность' },
  { n: 5, title: 'Премиум и дисконт' },
];
const MODULE_NOTE = {
  1: 'Из чего сделан график: вершины, впадины, тренд и сломы структуры.',
  2: 'Зоны, откуда набирал позицию крупный игрок, и как отличать рабочие от пустых.',
};

const Game = {
  packs: [],
  pack: null,
  chart: null,
  chart2: null,
  demo: null,
  run: null,

  async boot() {
    await Progress.init();
    // в однофайловой сборке уровни уже вшиты в страницу (window.__PACKS)
    this.packs = window.__PACKS || await Promise.all(
      ['data/levels_m1.json?v=2', 'data/levels_m2.json?v=2']
        .map(u => fetch(u).then(r => r.json())));
    this.pack = this.packs[0];
    this.chart = new GameChart($('#chartBox'), {
      onSelect: () => this.syncCheck(),
      onZone: () => this.syncCheck(),
    });
    this.bind();
    this.measureHeader();
    window.addEventListener('resize', () => { this.measureHeader(); this.chart.resize(); });
    new ResizeObserver(() => this.measureHeader()).observe(document.querySelector('.hdr'));
    this.renderHome();
    this.show('home');
    $('#loading').remove();
  },

  /* ─────────────── экраны ─────────────── */

  /* Высоту экрана берём у Telegram, а не из vh: в WebView единицы вьюпорта
     врут (шапка клиента, клавиатура, разворот Mini App), и игровой экран
     уезжает за край. viewportStableHeight — единственное честное число. */
  measureHeader() {
    // именно getBoundingClientRect: offsetHeight округляет, и дробный остаток
    // шапки превращался в несколько пикселей паразитной прокрутки
    const h = document.querySelector('.hdr').getBoundingClientRect().height;
    if (h) document.documentElement.style.setProperty('--hdr', h.toFixed(2) + 'px');
    const vh = (tg && tg.viewportStableHeight) || window.innerHeight;
    if (vh) document.documentElement.style.setProperty('--vh', Math.round(vh) + 'px');
  },

  show(name) {
    this.screen = name;
    for (const s of document.querySelectorAll('.screen')) s.classList.toggle('on', s.dataset.screen === name);
    $('.hdr-title').textContent = name === 'home' ? 'Тренажёр SMC' : this.shortTitle(this.pack);
    const back = name !== 'home';
    $('#btnBack').classList.toggle('hidden', !back);
    try {
      if (tg && tg.BackButton) back ? tg.BackButton.show() : tg.BackButton.hide();
    } catch (e) {}
    if (name === 'play') {
      this.chart.resize();
      if (this.chart2) this.chart2.resize();
      requestAnimationFrame(() => { this.chart.resize(); if (this.chart2) this.chart2.resize(); });
    }
    window.scrollTo(0, 0);
  },

  bind() {
    $('#btnBack').addEventListener('click', () => this.back());
    $('#btnStart').addEventListener('click', () => this.startRun());
    $('#btnCheck').addEventListener('click', () => this.check());
    $('#btnHint').addEventListener('click', () => this.showHint());
    $('#btnNext').addEventListener('click', () => this.next());
    $('#btnAgain').addEventListener('click', () => this.openLevel(this.run.level.id));
    $('#btnToMap').addEventListener('click', () => { this.renderMap(); this.show('map'); });
    $('#btnNextMod').addEventListener('click', () => {
      this.openModule(this.packs.indexOf(this.pack) + 1);
    });
    try { if (tg && tg.BackButton) tg.BackButton.onClick(() => this.back()); } catch (e) {}
    try {
      if (tg && tg.onEvent) tg.onEvent('viewportChanged', () => {
        this.measureHeader();
        this.chart.resize();
        if (this.chart2) this.chart2.resize();
      });
    } catch (e) {}
  },

  back() {
    if (this.screen === 'map') { this.renderHome(); this.show('home'); return; }
    if (this.screen === 'play' || this.screen === 'theory' || this.screen === 'result') {
      this.stopDemo();
      this.renderMap();
      this.show('map');
    }
  },

  /* ─────────────── модули ─────────────── */

  shortTitle(p) { return (p.title || '').split(' - ').slice(1).join(' - ') || p.title; },
  moduleDone(p) { return p.levels.every(l => Progress.level(l.id).done); },

  stats() {
    const st = Progress.state;
    $('#xp').textContent = st.xp;
    $('#streak').textContent = st.streak;
    $('#streakWrap').classList.toggle('hidden', st.streak < 2);
  },

  renderHome() {
    this.stats();
    const box = $('#moduleList');
    box.innerHTML = '';
    this.packs.forEach((p, i) => {
      const done = p.levels.filter(l => Progress.level(l.id).done).length;
      const open = i === 0 || this.moduleDone(this.packs[i - 1]);
      const el = document.createElement('button');
      el.className = 'lvl' + (open ? '' : ' locked') + (done === p.levels.length ? ' done' : '');
      el.innerHTML = `
        <span class="lvl-id">${p.module}</span>
        <span class="lvl-main">
          <span class="lvl-title">${this.shortTitle(p)}</span>
          <span class="lvl-sub">${open ? `${done} из ${p.levels.length} уровней` : 'откроется после предыдущего модуля'}</span>
        </span>
        <span class="lvl-stars">${open ? '›' : '🔒'}</span>`;
      if (open) el.addEventListener('click', () => this.openModule(i));
      else el.addEventListener('click', () => haptic('warning'));
      box.appendChild(el);
    });
    for (const s of SOON) {
      const el = document.createElement('div');
      el.className = 'lvl locked';
      el.innerHTML = `
        <span class="lvl-id">${s.n}</span>
        <span class="lvl-main">
          <span class="lvl-title">${s.title}</span>
          <span class="lvl-sub">в работе</span>
        </span>
        <span class="lvl-stars">🔒</span>`;
      box.appendChild(el);
    }
  },

  openModule(i) {
    this.pack = this.packs[i];
    haptic('light');
    this.renderMap();
    this.show('map');
  },

  /* ─────────────── карта уровней ─────────────── */

  ids() { return this.pack.levels.map(l => l.id); },

  renderMap() {
    this.stats();
    const p = this.pack;
    $('#modKicker').textContent = `Модуль ${p.module} из 5`;
    $('#modTitle').textContent = this.shortTitle(p);
    $('#modNote').textContent = MODULE_NOTE[p.module] || '';

    const ids = this.ids();
    const doneCount = ids.filter(id => Progress.level(id).done).length;
    $('#modProgress').style.width = Math.round(doneCount / ids.length * 100) + '%';
    $('#modCount').textContent = `${doneCount} из ${ids.length}`;

    const box = $('#levelList');
    box.innerHTML = '';
    for (const lv of this.pack.levels) {
      const st = Progress.level(lv.id);
      const open = Progress.unlocked(ids, lv.id);
      const el = document.createElement('button');
      el.className = 'lvl' + (open ? '' : ' locked') + (lv.boss ? ' boss' : '') + (st.done ? ' done' : '');
      el.innerHTML = `
        <span class="lvl-id">${lv.boss ? '★' : lv.id}</span>
        <span class="lvl-main">
          <span class="lvl-title">${lv.title}</span>
          <span class="lvl-sub">${open ? (st.done ? `лучший результат ${Math.round(st.best * 100)}%` : `${lv.perRun} задания`) : 'откроется после предыдущего'}</span>
        </span>
        <span class="lvl-stars">${open ? [1, 2, 3].map(n => `<i class="${n <= st.stars ? 'on' : ''}">★</i>`).join('') : '🔒'}</span>`;
      if (open) el.addEventListener('click', () => this.openLevel(lv.id));
      else el.addEventListener('click', () => haptic('warning'));
      box.appendChild(el);
    }
  },

  /* ─────────────── теория ─────────────── */

  openLevel(id) {
    const level = this.pack.levels.find(l => l.id === id);
    this.run = { level, tasks: this.pick(level), i: 0, results: [] };
    haptic('light');
    if (!level.theory) { this.startRun(); return; }
    $('#thTitle').textContent = level.theory[0];
    $('#thBullets').innerHTML = level.theory.slice(1).map(t => `<li>${t}</li>`).join('');
    $('#btnStart').textContent = `Начать - ${level.perRun} задания`;
    this.show('theory');
    this.startDemo(level);
  },

  pick(level) {
    const pool = level.tasks.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, Math.min(level.perRun, pool.length));
  },

  /* Анимированный пример: свечи те же, реальные, разметка проявляется по шагам. */
  startDemo(level) {
    this.stopDemo();
    const shown = new Set(this.run.tasks.map(t => t.ds));
    const src = level.tasks.find(t => !shown.has(t.ds) && (t.reveal || []).length) || level.tasks[0];
    if (!src) return;
    const ds = this.pack.datasets[src.ds];
    if (!ds) return;
    $('#thDemoCap').textContent = src.caption + ' - пример разметки';
    if (!this.demo) this.demo = new GameChart($('#thDemo'), {});
    this.demo.setData(ds);
    const anns = (src.reveal || []).filter(a => a.type !== 'zone' || true);
    let k = 0;
    const tick = () => {
      k = k >= anns.length ? 0 : k;
      this.demo.setAnnotations(anns.slice(0, k + 1));
      k++;
      this._demoTimer = setTimeout(tick, k > anns.length ? 1600 : 750);
    };
    tick();
  },
  stopDemo() { clearTimeout(this._demoTimer); },

  /* ─────────────── практика ─────────────── */

  startRun() {
    this.stopDemo();
    this.run.i = 0;
    this.run.results = [];
    this.run.hints = 0;
    this.show('play');
    this.renderTask();
  },

  get task() { return this.run.tasks[this.run.i]; },

  renderTask() {
    const t = this.task;
    const lv = this.run.level;
    this.step = 0;
    this.choice = null;
    this.stepScores = [];

    $('#taskCaption').textContent = t.caption;
    $('#taskDots').innerHTML = this.run.tasks
      .map((_, i) => `<i class="${i < this.run.i ? 'past' : i === this.run.i ? 'cur' : ''}"></i>`).join('');
    $('#levelTag').textContent = lv.boss ? 'Boss' : 'Уровень ' + lv.id;

    const ds = this.pack.datasets[t.ds];
    this.chart.setData(ds);
    this.chart.setAnnotations(t.pre || []);

    // второй график — только для заданий про два таймфрейма
    const box2 = $('#chartBox2');
    const wrap2 = $('#chartBox2Wrap');
    if (t.ds2) {
      wrap2.classList.remove('hidden');
      box2.classList.remove('hidden');
      if (!this.chart2) this.chart2 = new GameChart(box2, {});
      this.chart2.setData(this.pack.datasets[t.ds2]);
      this.chart2.setMode('none');
      $('#chartTag').textContent = ds.tf + ' - старший';
      $('#chartTag2').textContent = this.pack.datasets[t.ds2].tf + ' - младший';
      $('#chartTag').classList.remove('hidden');
      $('#chartTag2').classList.remove('hidden');
    } else {
      wrap2.classList.add('hidden');
      box2.classList.add('hidden');
      $('#chartTag').classList.add('hidden');
      $('#chartTag2').classList.add('hidden');
    }

    // подсказка доступна на обучающих уровнях; на боссе её нет - это проверка
    this.hinted = false;
    const hasTip = !!t.tip && t.kind !== 'multi';
    $('#btnHint').classList.toggle('hidden', !hasTip);
    $('#btnHint').disabled = false;
    $('#tip').classList.add('hidden');
    $('#tip').innerHTML = '';

    $('#feedback').className = 'feedback';
    $('#feedback').innerHTML = '';
    $('#sheet').classList.remove('open');
    $('#playChart').classList.toggle('dual', !!t.ds2);
    $('#btnNext').classList.add('hidden');
    $('#btnCheck').classList.remove('hidden');
    this.renderStep();
    // второй график только что показали из display:none — ResizeObserver
    // приедет позже, а размер нужен сразу, иначе канвас останется нулевым
    this.chart.resize();
    if (this.chart2 && t.ds2) this.chart2.resize();
  },

  /* Boss — несколько шагов на одном графике, без промежуточных подсказок. */
  get stepNode() {
    const t = this.task;
    return t.kind === 'multi' ? t.steps[this.step] : t;
  },

  renderStep() {
    const t = this.task;
    const node = this.stepNode;
    $('#prompt').textContent = node.prompt;
    $('#hint').textContent = node.hint || '';
    $('#hint').classList.toggle('hidden', !node.hint);

    const opts = $('#options');
    opts.classList.remove('hidden');
    opts.innerHTML = '';
    this.choice = null;
    this.chart.clearSelection();
    this.chart.setAnnotations(t.pre || []);

    if (node.kind === 'choice') {
      this.chart.setMode('none');
      node.options.forEach((o, i) => {
        const b = document.createElement('button');
        b.className = 'opt';
        b.textContent = o;
        b.addEventListener('click', () => {
          if (this.answered) return;
          this.choice = i;
          for (const el of opts.children) el.classList.remove('sel');
          b.classList.add('sel');
          haptic('light');
          this.syncCheck();
        });
        opts.appendChild(b);
      });
    } else if (node.kind === 'tap') {
      this.chart.setMode('tap', node.need);
      opts.innerHTML = `<div class="counter"><span id="tapCount">0</span> из ${node.need}</div>`;
    } else {
      this.chart.setMode('zone');
      opts.innerHTML = '<div class="counter">Протяни рамку по графику</div>';
    }
    this.answered = false;
    this.syncCheck();
  },

  /* Подсказка - не текст «попробуй ещё», а разметка на графике: на сломах
     структуры словами объяснить нечего, надо показать сам уровень. */
  showHint() {
    const t = this.task;
    if (!t.tip || this.hinted || this.answered) return;
    this.hinted = true;
    this.run.hints = (this.run.hints || 0) + 1;
    $('#btnHint').disabled = true;
    const tip = $('#tip');
    tip.innerHTML = `<b>Подсказка.</b> ${t.tip.text}`;
    tip.classList.remove('hidden');
    this.chart.setAnnotations([...(t.pre || []), ...(t.tip.anns || [])]);
    this.chart.resize();
    haptic('light');
  },

  syncCheck() {
    const node = this.stepNode;
    let ready = false;
    if (node.kind === 'choice') ready = this.choice !== null;
    if (node.kind === 'tap') {
      ready = this.chart.sel.length === node.need;
      const c = $('#tapCount');
      if (c) c.textContent = this.chart.sel.length;
    }
    if (node.kind === 'zone') ready = !!this.chart.zone;
    $('#btnCheck').disabled = !ready;
  },

  /* ─────────────── проверка ─────────────── */

  check() {
    const t = this.task;
    const node = this.stepNode;
    const res = this.grade(node);
    this.stepScores.push(res.score);

    if (t.kind === 'multi' && this.step < t.steps.length - 1) {
      this.step++;
      haptic('light');
      this.renderStep();                       // на боссе разбор только в конце
      return;
    }

    this.answered = true;
    const score = this.stepScores.reduce((a, b) => a + b, 0) / this.stepScores.length;
    const ok = score >= this.passMark(t);
    this.run.results.push(score);
    Progress.hit(ok);
    Progress.addXp(ok ? (t.kind === 'multi' ? 25 : (this.hinted ? 5 : 10)) : 0);
    haptic(ok ? 'ok' : 'error');
    this.reveal(t, res, ok, score);
  },

  passMark(t) {
    if (t.kind === 'zone') return (t.answer && t.answer.pass) || 0.55;
    if (t.kind === 'multi') return 0.99;       // босс: спрашиваем всё, ошибки не прощаем
    if (t.kind === 'tap' && t.need > 1) return 0.66;
    return 0.99;
  },

  grade(node) {
    if (node.kind === 'choice') {
      const ok = this.choice === node.answer.correct;
      return { score: ok ? 1 : 0, chosen: this.choice, correct: node.answer.correct };
    }
    if (node.kind === 'tap') return this.gradeTap(node, this.chart.sel.slice());
    if (node.kind === 'zone') return this.gradeZone(node, this.chart.zone);
    return { score: 0 };
  },

  gradeTap(node, sel) {
    const refs = node.answer.idx.slice();
    const tol = node.answer.tol == null ? 1 : node.answer.tol;
    const used = new Set();
    const ok = [], bad = [];
    for (const s of sel) {
      let hit = -1, dist = 1e9;
      refs.forEach((r, k) => {
        if (used.has(k)) return;
        const d = Math.abs(r - s);
        if (d <= tol && d < dist) { hit = k; dist = d; }
      });
      if (hit >= 0) { used.add(hit); ok.push(s); } else bad.push(s);
    }
    const missed = refs.filter((_, k) => !used.has(k));
    const score = ok.length / Math.max(refs.length, sel.length || 1);
    return { score, ok, bad, missed };
  },

  gradeZone(node, z) {
    const ref = node.answer.zone;
    if (!z) return { score: 0, ref };
    const ov = (a0, a1, b0, b1) => {
      const inter = Math.max(0, Math.min(a1, b1) - Math.max(a0, b0));
      const uni = Math.max(a1, b1) - Math.min(a0, b0);
      return uni > 0 ? inter / uni : 0;
    };
    const price = ov(z.y0, z.y1, ref.y0, ref.y1);
    const time = ov(z.x0, z.x1, ref.x0, ref.x1);
    return { score: 0.7 * price + 0.3 * time, price, time, ref };
  },

  reveal(t, res, ok, score) {
    const node = this.stepNode;
    const anns = (t.reveal || []).slice();

    if (node.kind === 'tap' || (t.kind === 'multi' && t.steps.some(s => s.kind === 'tap'))) {
      const tapRes = t.kind === 'multi'
        ? this.gradeTap(t.steps.find(s => s.kind === 'tap'), this.chart.sel.slice())
        : res;
      this.chart.setJudge({ ok: tapRes.ok || [], bad: tapRes.bad || [] });
      // пропущенное подсвечиваем отдельным цветом — иначе оно сливается с
      // зелёной разметкой найденного, и «найдено 2 из 3» нечем подтвердить
      const ref = (t.reveal || []).find(a => a.type === 'pivot');
      const dir = ref ? ref.dir : 'H';
      const missed = tapRes.missed || [];
      for (let k = anns.length - 1; k >= 0; k--) {
        if (anns[k].type === 'pivot' && missed.some(m => Math.abs(m - anns[k].i) <= 1)) anns.splice(k, 1);
      }
      for (const m of missed) anns.push({ type: 'pivot', i: m, dir, miss: true });
    }
    if (node.kind === 'zone') {
      if (this.chart.zone) anns.push(Object.assign({ type: 'zone', mine: true, label: 'твоя рамка' }, this.chart.zone));
      this.chart.locked = true;
    }
    this.chart.setAnnotations(anns);
    this.chart.locked = true;

    // «Почти» — засчитано, но не идеально: иначе красная метка на графике
    // соседствует с бодрым «Верно», и игрок не понимает, что он сделал не так
    const clean = node.kind === 'zone' ? score >= ((t.answer && t.answer.star3) || 0.78) : score >= 0.99;
    const fb = $('#feedback');
    fb.className = 'feedback on ' + (!ok ? 'bad' : clean ? 'good' : 'part');
    let head = !ok ? 'Мимо' : clean ? 'Верно' : 'Почти';
    if (node.kind === 'zone') head += ` - совпадение ${Math.round(score * 100)}%`;
    if (t.kind === 'multi') head = ok ? 'Все шаги верны' : `Верных шагов: ${this.stepScores.filter(s => s >= 0.99).length} из ${this.stepScores.length}`;

    // после ответа оставляем только выбранный и правильный варианты:
    // на заданиях с двумя графиками три пункта отбирали высоту у самих свечей
    let extra = '';
    if (node.kind === 'choice') {
      [...$('#options').children].forEach((el, i) => {
        el.classList.remove('sel');
        if (i === node.answer.correct) el.classList.add('right');
        else if (i === this.choice) el.classList.add('wrong');
        else el.classList.add('hidden');
      });
      if (!ok) extra = `<div class="fb-right">Правильный ответ: ${node.options[node.answer.correct]}</div>`;
    }
    if (node.kind === 'tap' && res.ok && res.missed && res.missed.length) {
      extra = `<div class="fb-right">Найдено ${res.ok.length} из ${node.answer.idx.length} - пропущенные отмечены жёлтым</div>`;
    }
    fb.innerHTML = `<div class="fb-head">${head}</div>${extra}<div class="fb-text">${t.explain || ''}</div>`;

    $('#btnCheck').classList.add('hidden');
    $('#btnHint').classList.add('hidden');
    $('#tip').classList.add('hidden');       // место нужно разбору
    $('#btnNext').classList.remove('hidden');
    $('#btnNext').textContent = this.run.i === this.run.tasks.length - 1 ? 'Итог' : 'Дальше';
    $('#sheet').classList.add('open');
    $('#options').classList.toggle('hidden', node.kind !== 'choice');   // счётчик тапов после ответа не нужен
    this.chart.resize();
    if (this.chart2 && t.ds2) this.chart2.resize();
    requestAnimationFrame(() => this.chart.resize());

    const st = Progress.state;
    $('#xp').textContent = st.xp;
    $('#streak').textContent = st.streak;
    $('#streakWrap').classList.toggle('hidden', st.streak < 2);
  },

  next() {
    if (this.run.i < this.run.tasks.length - 1) {
      this.run.i++;
      this.renderTask();
    } else {
      this.finish();
    }
  },

  /* ─────────────── итог уровня ─────────────── */

  finish() {
    const r = this.run;
    const avg = r.results.reduce((a, b) => a + b, 0) / r.results.length;
    const hints = r.hints || 0;
    // третья звезда - только за самостоятельное прохождение, иначе она
    // перестаёт что-либо значить перед экзаменом
    const stars = Math.min(avg >= 0.92 ? 3 : avg >= 0.72 ? 2 : avg >= 0.5 ? 1 : 0,
                           hints > 0 ? 2 : 3);
    const before = Progress.level(r.level.id);
    Progress.finishLevel(r.level.id, stars, avg);
    if (stars > 0) Progress.addXp(stars * 10);

    $('#resStars').innerHTML = [1, 2, 3].map(n => `<i class="${n <= stars ? 'on' : ''}">★</i>`).join('');
    $('#resTitle').textContent = stars === 0 ? 'Уровень не сдан' : (stars === 3 ? 'Отлично' : 'Уровень сдан');
    $('#resScore').textContent = `Точность ${Math.round(avg * 100)}%`
      + (hints ? ` · подсказок: ${hints}` : '');
    const ids = this.ids();
    const nextId = ids[ids.indexOf(r.level.id) + 1];
    const mi = this.packs.indexOf(this.pack);
    const nextMod = this.packs[mi + 1];
    let note = '';
    if (stars === 0) note = 'Нужно минимум 50% точности. Разбор можно перечитать в теории уровня.';
    else if (!before.done && nextId) note = 'Следующий уровень открыт.';
    else if (!nextId && this.moduleDone(this.pack)) {
      note = nextMod
        ? `Модуль ${this.pack.module} пройден. Открыт модуль ${nextMod.module} - ${this.shortTitle(nextMod)}.`
        : `Модуль ${this.pack.module} пройден. Следующие модули в работе.`;
    }
    else if (hints > 0) note = 'Третья звезда - за прохождение без подсказок. Задания при пересдаче будут другие.';
    else note = stars < 3 ? 'Можно перепройти - задания подберутся другие.' : 'Чистое прохождение.';
    $('#resNote').textContent = note;
    $('#btnAgain').textContent = stars === 0 ? 'Ещё раз' : 'Перепройти';
    // кнопка в следующий модуль появляется ровно в момент, когда он открылся
    const gotNext = !nextId && this.moduleDone(this.pack) && !!nextMod;
    $('#btnNextMod').classList.toggle('hidden', !gotNext);
    $('#btnToMap').classList.toggle('primary', !gotNext);
    $('#btnToMap').classList.toggle('ghost', gotNext);
    haptic(stars === 0 ? 'warning' : 'ok');
    this.show('result');
  },
};

/* ─────────────── старт ─────────────── */

function applyTheme() {
  try {
    if (!tg) return;
    if (tg.setBackgroundColor) tg.setBackgroundColor('#0d1017');
    if (tg.setHeaderColor) tg.setHeaderColor('#0d1017');
    if (tg.setBottomBarColor) tg.setBottomBarColor('#0d1017');
  } catch (e) {}
}

window.addEventListener('DOMContentLoaded', () => {
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    applyTheme();
  }
  Game.boot().catch(e => {
    const l = document.getElementById('loading');
    if (l) l.textContent = 'Не удалось загрузить уровни: ' + e.message;
  });
});

</script>
