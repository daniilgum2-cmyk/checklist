<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Telegram Mini App кэширует страницу — просим не держать старую версию -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SMC-скринер · Bybit Futures</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  background: #0d1117;
  color: #c9d1d9;
  font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}

/* ---------- шапка ---------- */
header {
  flex: none;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 8px 14px;
  border-bottom: 1px solid #21262d;
  background: #161b22;
  flex-wrap: wrap;
}
.brand { font-weight: 700; font-size: 15px; color: #e6edf3; }
.brand .sub { font-weight: 400; font-size: 11px; color: #8b949e; margin-left: 4px; }

/* выбор таймфрейма одной кнопкой со списком (как в TradingView) */
.tfpick { position: relative; }
.tfpick > button {
  display: flex; align-items: center; gap: 6px;
  background: #21262d;
  border: 1px solid #30363d;
  color: #e6edf3;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  min-width: 62px;
}
.tfpick > button:hover { background: #30363d; }
.tfpick > button i { font-style: normal; font-size: 9px; color: #8b949e; margin-left: auto; }
#tfMenu {
  position: absolute;
  top: calc(100% + 5px);
  left: 0;
  z-index: 40;
  min-width: 100%;
  padding: 4px;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 8px;
  box-shadow: 0 10px 28px rgba(1, 4, 9, 0.7);
}
#tfMenu button {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  color: #c9d1d9;
  padding: 7px 12px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
}
#tfMenu button:hover { background: #21262d; color: #e6edf3; }
#tfMenu button.active { background: #1f6feb22; color: #e6edf3; font-weight: 600; }

/* камера: снимок графика (меню «Скачать» / «Скопировать»), живёт рядом с выбором таймфрейма */
.hdrbtns { display: flex; align-items: center; gap: 8px; }
.shotpick { position: relative; }
.shotpick > button {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 30px; padding: 0;
  background: #21262d; border: 1px solid #30363d; border-radius: 6px;
  color: #c9d1d9; cursor: pointer;
}
.shotpick > button:hover { background: #30363d; color: #e6edf3; }
.shotpick > button[aria-expanded="true"] { background: #1f6feb22; border-color: #1f6feb; color: #e6edf3; }
.shotpick > button svg { width: 17px; height: 17px; }
#shotMenu {
  position: absolute; top: calc(100% + 5px); right: 0; z-index: 40;
  min-width: 176px; padding: 4px;
  background: #161b22; border: 1px solid #30363d; border-radius: 8px;
  box-shadow: 0 10px 28px rgba(1, 4, 9, 0.7);
}
#shotMenu[hidden] { display: none; }
#shotMenu button {
  display: flex; align-items: center; gap: 9px; width: 100%;
  background: transparent; border: 0; border-radius: 5px;
  padding: 8px 11px; cursor: pointer; text-align: left;
  color: #c9d1d9; font-size: 12px; white-space: nowrap;
}
#shotMenu button:hover { background: #21262d; color: #e6edf3; }
#shotMenu button svg { width: 15px; height: 15px; flex: none; color: #7d8590; }
#shotMenu button:hover svg { color: #58a6ff; }

/* подсказка внизу экрана (успех, откат на «Скачать», «график ещё загружается») */
#toast {
  position: fixed; left: 50%; bottom: calc(58px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(8px); z-index: 100;
  display: flex; align-items: center; gap: 8px;
  max-width: min(440px, calc(100vw - 24px));
  padding: 9px 14px; border-radius: 8px;
  background: rgba(22, 27, 34, 0.97); border: 1px solid #30363d;
  box-shadow: 0 10px 28px rgba(1, 4, 9, 0.6);
  color: #e6edf3; font-size: 12.5px; line-height: 1.35;
  opacity: 0; pointer-events: none; transition: opacity .16s ease, transform .16s ease;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast svg { width: 16px; height: 16px; flex: none; }
#toast.ok svg { color: #3fb950; }
#toast.warn svg { color: #e3b341; }
#toast.wait svg { color: #58a6ff; }
#toast .spin { animation: shotspin .8s linear infinite; }
@keyframes shotspin { to { transform: rotate(360deg); } }

/* окно со снимком: только там, где Telegram не даёт скачать файл кодом */
#shotSheet {
  position: fixed; inset: 0; z-index: 95;
  display: flex; align-items: center; justify-content: center;
  padding: 12px; background: rgba(1, 4, 9, 0.78);
}
#shotSheet[hidden] { display: none; }
.ss-card {
  width: min(640px, 100%); max-height: 100%; overflow-y: auto;
  background: #161b22; border: 1px solid #30363d; border-radius: 12px;
  padding: 12px 14px 14px;
}
.ss-head { display: flex; align-items: center; margin-bottom: 10px; }
.ss-head b { font-size: 13px; color: #e6edf3; }
.ss-x { margin-left: auto; background: transparent; border: 0; color: #8b949e; font-size: 22px; line-height: 1; padding: 0 4px; cursor: pointer; }
.ss-x:hover { color: #e6edf3; }
/* картинку должно быть можно долго нажать и сохранить: никаких запретов на callout и выделение */
#shotSheet img {
  display: block; width: 100%; max-height: 62vh; object-fit: contain;
  border-radius: 8px; background: #0d1117;
  -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto;
}
.ss-hint { margin: 10px 2px 0; font-size: 12px; line-height: 1.45; color: #9da7b3; }
.ss-btns { display: flex; gap: 8px; margin-top: 10px; }
.ss-btns:empty { display: none; }
.ss-btns button {
  flex: 1; padding: 9px 12px; border-radius: 7px; cursor: pointer;
  background: #21262d; border: 1px solid #30363d; color: #e6edf3; font-size: 13px;
}
.ss-btns button:hover { background: #30363d; }

.controls { display: flex; align-items: center; gap: 12px; margin-left: auto; font-size: 12px; color: #8b949e; }
.controls select {
  background: #0d1117; color: #c9d1d9; border: 1px solid #30363d;
  border-radius: 5px; padding: 3px 6px; font-size: 12px;
}
.controls button {
  background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
  border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px;
}
.controls button:hover { background: #30363d; }
#status { font-size: 11px; color: #7d8590; min-width: 130px; }
#status.err { color: #f85149; }

/* ---------- каркас ---------- */
#layout { flex: 1; display: flex; min-height: 0; }

aside#sidebar {
  width: 250px;
  flex: none;
  overflow-y: auto;
  border-right: 1px solid #21262d;
  background: #0d1117;
  padding: 6px;
}

main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

#symbolBar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 7px 12px 0;
}
#symbolBar b { font-size: 15px; color: #e6edf3; }
#symbolBar a { color: #58a6ff; font-size: 12px; text-decoration: none; }
#symbolBar a:hover { text-decoration: underline; }

#layerBar {
  flex: none;
  padding: 5px 12px 0;
  font-size: 11px;
  color: #7d8590;
}
.lchip {
  display: inline-block;
  margin: 0 3px 3px 0;
  padding: 1px 8px;
  border: 1px solid #30363d;
  border-radius: 9px;
  cursor: pointer;
  color: #6e7681;
  user-select: none;
}
.lchip.on { color: #c9d1d9; border-color: #58a6ff88; background: #1f6feb14; }
.lchip:hover { border-color: #58a6ff; }

#summary {
  flex: none;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
  padding: 6px 12px;
  font-size: 12px;
  color: #9da7b3;
}
#summary b { color: #e6edf3; font-weight: 600; }

section.charts {
  flex: 1;
  display: flex;
  gap: 8px;
  min-height: 0;
  padding: 4px 10px 10px;
}
section[hidden] { display: none; }
.chartWrap {
  flex: 1;
  position: relative;
  min-width: 0;
  border: 1px solid #21262d;
  border-radius: 8px;
  overflow: hidden;
  background: #0d1117;
}
.chart { position: absolute; inset: 0; }

.chart-legend {
  position: absolute;
  top: 6px; left: 8px;
  z-index: 4;
  font: 11px ui-monospace, Menlo, monospace;
  color: #c9d1d9;
  pointer-events: none;
  background: rgba(13,17,23,0.65);
  padding: 2px 7px;
  border-radius: 4px;
}

.chart-reset {
  position: absolute;
  bottom: 34px; right: 76px;
  z-index: 4;
  font-size: 10px;
  color: #8b949e;
  background: rgba(22,27,34,0.85);
  border: 1px solid #30363d;
  border-radius: 5px;
  padding: 2px 8px;
  cursor: pointer;
}
.chart-reset:hover { color: #e6edf3; border-color: #58a6ff; }

/* ---------- сетка формаций ---------- */
#setupGrid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 8px;
  overflow-y: auto;
  align-content: start;
}
.fcard {
  height: 330px;
  display: flex;
  flex-direction: column;
  border: 1px solid #21262d;
  border-radius: 8px;
  background: #0d1117;
  overflow: hidden;
}
.fhead {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  background: #161b22;
  cursor: pointer;
  font-size: 12px;
}
.fhead b { color: #e6edf3; font-size: 13px; }
.fbadge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 8px;
  letter-spacing: 0.3px;
}
.fbadge.long { background: #23863626; color: #3fb950; border: 1px solid #3fb95055; }
.fbadge.short { background: #f8514926; color: #f85149; border: 1px solid #f8514955; }
.fbadge.break { background: #1f6feb26; color: #58a6ff; border: 1px solid #1f6feb55; }
.fago { font-size: 11px; color: #7d8590; }
.fopen { margin-left: auto; font-size: 11px; color: #58a6ff; }
.fchart { flex: 1; min-height: 0; position: relative; }
.ffoot {
  flex: none;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  padding: 6px 10px;
  font-size: 11px;
  color: #9da7b3;
  background: #10151c;
  border-top: 1px solid #21262d;
  cursor: pointer;
}
.ffoot b { color: #e6edf3; }
.ffoot .stop { color: #f85149; }
.ffoot .tp { color: #3fb950; }
.ffoot i { color: #6e7681; font-style: normal; }

/* ---------- страница плана сделки ---------- */
section.plan { flex-direction: column; }
.plan-body { flex: 1; display: flex; gap: 8px; min-height: 0; }

#setupCards { flex: none; display: flex; gap: 8px; flex-wrap: wrap; }
.setup-card {
  flex: 1;
  min-width: 210px;
  border: 1px solid #30363d;
  border-radius: 8px;
  background: #161b22;
  padding: 8px 11px;
  cursor: pointer;
}
.setup-card:hover { border-color: #58a6ff66; }
.setup-card.active { border-color: #1f6feb; background: #16213040; }
.sc-head { display: flex; align-items: center; gap: 8px; }
.sc-rank { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: #21262d; color: #8b949e; }
.sc-rank.r1 { background: #e3b34122; color: #e3b341; }
.sc-rank.r2 { background: #8b949e22; color: #b1bac4; }
.sc-rank.r3 { background: #f0883e22; color: #f0883e; }
.sc-head b { font-size: 13px; color: #e6edf3; }
.sc-tf { font-size: 10px; color: #58a6ff; border: 1px solid #58a6ff44; border-radius: 4px; padding: 0 5px; }
.sc-side { font-size: 11px; font-weight: 700; }
.sc-side.long { color: #26a69a; }
.sc-side.short { color: #ef5350; }
.sc-score { margin-left: auto; font-size: 13px; font-weight: 700; color: #e6edf3; background: #21262d; border-radius: 6px; padding: 1px 8px; }
.sc-row { font-size: 11px; color: #9da7b3; margin-top: 4px; }
.sc-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.sc-chips span { font-size: 10px; color: #8b949e; border: 1px solid #30363d; border-radius: 8px; padding: 0 6px; }
.sc-empty { flex: 1; padding: 10px 12px; font-size: 12px; color: #8b949e; border: 1px dashed #30363d; border-radius: 8px; }

.trade-card.long { border-color: #26a69a88; background: #26a69a0d; }
.trade-card.short { border-color: #ef535088; background: #ef53500d; }
.sc-rank.live { background: #23863626; color: #3fb950; }

.plan-close-btn {
  display: block;
  width: 100%;
  margin: 4px 0 10px;
  padding: 6px;
  background: #21262d;
  border: 1px solid #f8514966;
  color: #f85149;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}
.plan-close-btn:hover { background: #f8514922; }

.journal { margin-top: 10px; border-top: 1px solid #21262d; padding-top: 8px; }
.jhead { font-size: 11px; color: #8b949e; margin-bottom: 6px; font-weight: 600; }
.jrow {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 11px;
  color: #9da7b3;
  padding: 2px 0;
}
.jrow b { color: #e6edf3; }
.jrow .long { color: #26a69a; }
.jrow .short { color: #ef5350; }
.jrow .pos { color: #3fb950; margin-left: auto; font-weight: 600; }
.jrow .neg { color: #f85149; margin-left: auto; font-weight: 600; }
.jrow.dim { color: #6e7681; }
.jrow span:last-child { margin-left: auto; }

.planChart { flex: 1.6; }
#planPanel {
  flex: 1;
  min-width: 300px;
  max-width: 380px;
  overflow-y: auto;
  border: 1px solid #21262d;
  border-radius: 8px;
  background: #10151c;
  padding: 12px 14px;
  font-size: 12.5px;
}
.plan-status {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 10px;
  margin-bottom: 8px;
  letter-spacing: 0.3px;
}
.plan-status.approach { background: #1f6feb26; color: #58a6ff; border: 1px solid #1f6feb66; }
.plan-status.inzone { background: #e3b34126; color: #e3b341; border: 1px solid #e3b34166; }
.plan-status.trigger { background: #23863626; color: #3fb950; border: 1px solid #3fb95066; }
.plan-status.none { background: #6e768126; color: #8b949e; border: 1px solid #30363d; }
.plan-side { font-size: 16px; font-weight: 700; margin: 2px 0 8px; }
.plan-side.long { color: #26a69a; }
.plan-side.short { color: #ef5350; }
.plan-why { color: #9da7b3; margin-bottom: 10px; line-height: 1.5; }
.plan-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin-bottom: 12px; }
.plan-grid .k { color: #7d8590; }
.plan-grid .v { color: #e6edf3; font-family: ui-monospace, Menlo, monospace; }
.plan-grid .v.stop { color: #f85149; }
.plan-grid .v.tp { color: #3fb950; }
.plan-steps { margin: 0; padding-left: 18px; color: #c9d1d9; }
.plan-steps li { margin-bottom: 7px; line-height: 1.45; }
.plan-steps li.done { color: #3fb950; }
.plan-warn {
  margin-top: 10px;
  padding: 7px 10px;
  border-left: 3px solid #e3b341;
  background: #e3b34112;
  color: #d4a72c;
  font-size: 11.5px;
  border-radius: 0 6px 6px 0;
}
.plan-note { margin-top: 10px; font-size: 11px; color: #6e7681; }
.plan-score { font-size: 11px; color: #8b949e; font-weight: 400; margin-left: 6px; }
.plan-metrics {
  margin-bottom: 10px;
  padding: 7px 10px;
  border: 1px solid #21262d;
  border-radius: 6px;
  background: #0d1117;
  font-size: 11.5px;
  color: #9da7b3;
  line-height: 1.6;
}
.plan-reasons { font-size: 11.5px; color: #9da7b3; margin-bottom: 10px; line-height: 1.5; }

.row3 .hot { color: #e3b341; }

/* узкий экран: план в колонку — график сверху, панель снизу */
@media (max-width: 1100px) {
  #viewPlan { overflow-y: auto; }
  #viewPlan .plan-body { flex-direction: column; flex: none; }
  #viewPlan .planChart { flex: none; height: 420px; min-height: 420px; }
  #viewPlan #planPanel { flex: none; max-width: none; width: 100%; }
}

/* ---------- монеты в сайдбаре ---------- */
.coin {
  padding: 8px 9px;
  border: 1px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 4px;
}
.coin:hover { background: #161b22; }
.coin.active { background: #161b22; border-color: #1f6feb; }
.coin .row1 { display: flex; align-items: center; gap: 7px; }
.coin .rank {
  font-size: 10px; color: #7d8590;
  background: #21262d; border-radius: 4px;
  padding: 1px 5px;
}
.coin .row1 b { font-size: 13px; color: #e6edf3; }
.coin .chg { margin-left: auto; font-size: 12px; font-weight: 600; }
.chg.pos { color: #26a69a; }
.chg.neg { color: #ef5350; }
.coin .row2 {
  display: flex; gap: 10px;
  font-size: 11px; color: #7d8590;
  margin-top: 3px;
}
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.chip {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 8px;
  border: 1px solid #30363d;
  color: #8b949e;
}
.chip.gold { color: #e3b341; border-color: #e3b34155; }
.chip.blue { color: #58a6ff; border-color: #58a6ff55; }
.chip.orange { color: #f0883e; border-color: #f0883e55; }
.chip.dim { opacity: 0.55; }

footer {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px 16px;
  flex-wrap: wrap;
  padding: 5px 14px;
  font-size: 11px;
  color: #6e7681;
  border-top: 1px solid #21262d;
  background: #161b22;
}
/* реферальная ссылка на Bybit — прижата к правому краю подвала */
.reflink {
  margin-left: auto;
  color: #58a6ff;
  text-decoration: none;
  white-space: nowrap;
  border: 1px solid #1f6feb55;
  border-radius: 6px;
  padding: 2px 9px;
}
.reflink:hover { background: #1f6feb1a; border-color: #1f6feb; }

/* ---------- инструменты рисования (стиль TradingView) ---------- */
.draw-toolbar {
  position: absolute; left: 8px; top: 38px; z-index: 6;
  display: flex; flex-direction: column; gap: 1px;
  background: rgba(22,27,34,0.92); border: 1px solid #30363d;
  border-radius: 6px; padding: 3px; backdrop-filter: blur(6px);
  box-shadow: 0 4px 14px rgba(0,0,0,0.35);
}
.draw-toolbar button {
  width: 30px; height: 30px; border: none; border-radius: 4px;
  background: transparent; color: #b9c1cb;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
}
.draw-toolbar button svg { width: 18px; height: 18px; display: block; }
.draw-toolbar button:hover { background: #262c36; color: #e6edf3; }
.draw-toolbar button.active { background: rgba(47,129,247,0.22); color: #58a6ff; }
.draw-toolbar .sep { height: 1px; background: #30363d; margin: 3px 4px; }
@media (pointer: coarse) {
  .draw-toolbar button { width: 38px; height: 38px; }
  .draw-toolbar button svg { width: 21px; height: 21px; }
}

/* всплывающая подсказка о действии */
.draw-toast {
  position: absolute; left: 50%; bottom: 42px; transform: translateX(-50%) translateY(6px);
  z-index: 8; pointer-events: none;
  background: rgba(22,27,34,0.95); border: 1px solid #30363d; border-radius: 5px;
  color: #e6edf3; font: 11px -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: 5px 10px; opacity: 0; transition: opacity .15s ease, transform .15s ease;
}
.draw-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- поиск и избранное ---------- */
.controls input#inpSearch {
  width: 150px; padding: 5px 9px;
  background: #0d1117; border: 1px solid #30363d; border-radius: 6px;

/* ======================================================================

/* панель инструментов: на компьютере две колонки (все значки на виду), на тач-экране колонка с прокруткой */
.draw-toolbar {
  display: grid; grid-template-columns: repeat(2, 30px); gap: 1px;
  max-height: calc(100% - 46px); overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain;
}
.draw-toolbar::-webkit-scrollbar { display: none; }
.draw-toolbar .sep { grid-column: 1 / -1; }
.draw-toolbar button { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
@media (pointer: coarse) {
  .draw-toolbar { display: flex; flex-direction: column; }
  .draw-toolbar .sep { flex: none; }
}

/* плавающая панель у выделенного рисунка */
.draw-fp {
  position: absolute; z-index: 9;
  display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px;
  max-width: min(470px, calc(100% - 8px));
  padding: 5px 8px;

  box-shadow: 0 8px 24px rgba(1,4,9,0.6);
}
.draw-fp[hidden], .draw-fp [hidden] { display: none !important; }
.fp-colors, .fp-widths { display: flex; align-items: center; gap: 4px; }
.fp-c {
  width: 18px; height: 18px; padding: 0; border-radius: 50%; cursor: pointer;
  background: var(--c); border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
}
.fp-c:hover { transform: scale(1.12); }
.fp-c.on { border-color: #e6edf3; }
.fp-w { width: 26px; height: 24px; padding: 0; border: 0; border-radius: 4px; background: transparent; cursor: pointer;
        display: flex; align-items: center; justify-content: center; }
.fp-w i { display: block; width: 15px; background: #b9c1cb; border-radius: 2px; }
.fp-w:hover { background: #262c36; }

  width: 26px; height: 24px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: #b9c1cb; cursor: pointer;
  display: flex; align-items: center; justify-content: center;

@media (pointer: coarse) {

  .draw-fp > button svg { width: 19px; height: 19px; }
}

/* меню рисунка: разделитель и опасное действие */
.cx-sep { height: 1px; margin: 3px 4px; background: #21262d; }

/* настройки инструмента (долгое нажатие на значок) */
.draw-form {

  width: min(300px, calc(100% - 16px)); max-height: calc(100% - 8px); overflow-y: auto;
  padding: 10px 14px 12px;

}

<script>
/* Bybit v5 API через локальный прокси */
const API = {
  // локально (server.py, порт 8737) - через прокси, в облаке - напрямую в Bybit
  base: location.port === '8737' ? '/bybit' : 'https://api.bybit.com',
  async get(path, params) {
    const qs = new URLSearchParams(params).toString();
    const r = await fetch(`${API.base}${path}?${qs}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (j.retCode !== 0) throw new Error(j.retMsg || 'ошибка API');
    return j.result;
  },

  async tickers() {
    return (await this.get('/v5/market/tickers', { category: 'linear' })).list;
  },

  // свечи приходят от новых к старым — разворачиваем; время в секундах, сдвинутое в локальный пояс
  async klines(symbol, interval, limit = 400) {
    const res = await this.get('/v5/market/kline', { category: 'linear', symbol, interval, limit });
    const shift = -new Date().getTimezoneOffset() * 60;
    return res.list.map(r => ({
      t: Math.floor(+r[0] / 1000) + shift,
      o: +r[1], h: +r[2], l: +r[3], c: +r[4], v: +r[5],
    })).reverse();
  },

  // история открытого интереса (новые первыми), 15-мин интервалы
  async oiHistory(symbol, limit = 17) {
    const res = await this.get('/v5/market/open-interest', { category: 'linear', symbol, intervalTime: '15min', limit });
    return res.list.map(r => ({ t: +r.timestamp, oi: +r.openInterest }));
  },

  // соотношение лонг/шорт аккаунтов
  async accountRatio(symbol) {
    const res = await this.get('/v5/market/account-ratio', { category: 'linear', symbol, period: '15min', limit: 1 });
    const r = res.list && res.list[0];
    return r ? { buy: +r.buyRatio, sell: +r.sellRatio } : null;
  },

  // стакан: реальные лимитные ордера
  async orderbook(symbol) {
    return await this.get('/v5/market/orderbook', { category: 'linear', symbol, limit: 200 });
  },
};

</script>
<script>
/* Реальные биржевые метрики Bybit: открытый интерес, long/short, стены лимиток в стакане.
   Важно: стакан показывает лимитные ордера, а не стопы — стопы не видит никто. */
const Metrics = (() => {
  const cache = new Map(); // sym -> {ts, data}
  const TTL = 60000;
  const MAX = 60;          // чтобы карта не росла бесконечно за длинную сессию

  // стена = уровень, где лимиток в разы больше среднего по стакану (в пределах ±5% от цены)
  function findWalls(ob) {
    const mid = (+ob.b[0][0] + +ob.a[0][0]) / 2;
    const calc = (rows, side) => {
      const levels = rows.map(r => ({ p: +r[0], usd: +r[0] * +r[1] }));
      const avg = levels.reduce((s, l) => s + l.usd, 0) / (levels.length || 1);
      return levels
        .filter(l => l.usd > 6 * avg && Math.abs(l.p - mid) / mid < 0.05)
        .sort((a, b) => b.usd - a.usd)
        .slice(0, 3)
        .map(l => ({ price: l.p, usd: l.usd, side }));
    };
    return [...calc(ob.b, 'bid'), ...calc(ob.a, 'ask')];
  }

  async function get(sym, funding = null) {
    const hit = cache.get(sym);
    if (hit && Date.now() - hit.ts < TTL) {
      if (funding != null) hit.data.funding = funding;
      return hit.data;
    }
    const data = { funding, oiChg: null, ls: null, walls: [] };
    const [oi, ratio, ob] = await Promise.allSettled([
      API.oiHistory(sym), API.accountRatio(sym), API.orderbook(sym),
    ]);
    if (oi.status === 'fulfilled' && oi.value.length > 1) {
      const list = oi.value; // новые первыми
      const latest = list[0].oi, oldest = list[list.length - 1].oi;
      if (oldest > 0) data.oiChg = (latest - oldest) / oldest * 100; // изменение за ~4ч
    }
    if (ratio.status === 'fulfilled' && ratio.value) {
      data.ls = ratio.value.buy / (ratio.value.sell || 1);
    }
    if (ob.status === 'fulfilled' && ob.value && ob.value.b?.length && ob.value.a?.length) {
      data.walls = findWalls(ob.value);
    }
    cache.delete(sym);
    cache.set(sym, { ts: Date.now(), data });
    while (cache.size > MAX) cache.delete(cache.keys().next().value);
    return data;
  }

  return { get };
})();

</script>
<script>
/* Smart Money разметка: пивоты, структура (BOS/ЧоЧ), равные лои/хаи (ликвидность),
   ордер-блоки, FVG, снятия (SFP), ножи, консолидация, премиум/дисконт. */
const SMC = (() => {

  function atrSeries(cs, period = 14) {
    const out = new Array(cs.length).fill(0);
    let sum = 0;
    for (let i = 0; i < cs.length; i++) {
      const c = cs[i];
      const tr = i === 0 ? c.h - c.l
        : Math.max(c.h - c.l, Math.abs(c.h - cs[i - 1].c), Math.abs(c.l - cs[i - 1].c));
      if (i < period) { sum += tr; out[i] = sum / (i + 1); }
      else out[i] = (out[i - 1] * (period - 1) + tr) / period;
    }
    return out;
  }

  // фрактальные пивоты; слева строгое сравнение, справа нестрогое (плоские вершины не дублируются)
  function findPivots(cs, left = 3, right = 3) {
    const piv = [];
    for (let i = left; i < cs.length - right; i++) {
      let isH = true, isL = true;
      for (let j = i - left; j <= i + right; j++) {
        if (j === i) continue;
        if (j < i) {
          if (cs[j].h > cs[i].h) isH = false;
          if (cs[j].l < cs[i].l) isL = false;
        } else {
          if (cs[j].h >= cs[i].h) isH = false;
          if (cs[j].l <= cs[i].l) isL = false;
        }
        if (!isH && !isL) break;
      }
      if (isH) piv.push({ i, price: cs[i].h, type: 'H', confirmed: i + right });
      if (isL) piv.push({ i, price: cs[i].l, type: 'L', confirmed: i + right });
    }
    return piv;
  }

  // структура: BOS = пробой по тренду, ЧоЧ = первый пробой против тренда
  function buildStructure(cs, piv) {
    const events = [];
    const byConfirm = [...piv].sort((a, b) => a.confirmed - b.confirmed);
    let swingH = null, swingL = null, trend = 0, pi = 0;
    for (let i = 0; i < cs.length; i++) {
      while (pi < byConfirm.length && byConfirm[pi].confirmed <= i) {
        const p = byConfirm[pi++];
        if (p.type === 'H') { if (!swingH || p.i > swingH.i) swingH = p; }
        else { if (!swingL || p.i > swingL.i) swingL = p; }
      }
      const c = cs[i];
      if (swingH && c.c > swingH.price) {
        events.push({ at: i, from: swingH.i, level: swingH.price, dir: 1, type: trend === -1 ? 'CHOCH' : 'BOS' });
        trend = 1; swingH = null;
      }
      if (swingL && c.c < swingL.price) {
        events.push({ at: i, from: swingL.i, level: swingL.price, dir: -1, type: trend === 1 ? 'CHOCH' : 'BOS' });
        trend = -1; swingL = null;
      }
    }
    return { events, trend };
  }

  // равные лои/хаи: группы пивотов одного типа в пределах допуска -> уровень ликвидности
  function equalLevels(cs, piv, atrArr, tolMult = 0.25) {
    const res = [];
    for (const type of ['H', 'L']) {
      const ps = piv.filter(p => p.type === type);
      let group = [];
      const flush = () => {
        if (group.length >= 2) {
          const prices = group.map(g => g.price);
          res.push({
            kind: type === 'L' ? 'EQL' : 'EQH',
            price: type === 'L' ? Math.min(...prices) : Math.max(...prices),
            i0: group[0].i, iLast: group[group.length - 1].i, count: group.length,
          });
        }
        group = [];
      };
      for (const p of ps) {
        if (!group.length) { group = [p]; continue; }
        const tol = tolMult * (atrArr[p.i] || 0);
        if (Math.abs(p.price - group[0].price) <= tol) group.push(p);
        else { flush(); group = [p]; }
      }
      flush();
    }
    // снята ли ликвидность после последнего касания
    for (const lv of res) {
      lv.swept = false;
      for (let k = lv.iLast + 1; k < cs.length; k++) {
        if (lv.kind === 'EQL' && cs[k].l < lv.price - 0.02 * (atrArr[k] || 0)) { lv.swept = true; lv.sweptAt = k; break; }
        if (lv.kind === 'EQH' && cs[k].h > lv.price + 0.02 * (atrArr[k] || 0)) { lv.swept = true; lv.sweptAt = k; break; }
      }
    }
    return res;
  }

  // ордер-блок: последняя встречная свеча перед импульсом, сломавшим структуру
  function orderBlocks(cs, events) {
    const obs = [];
    for (const ev of events) {
      let found = null;
      for (let j = ev.at - 1; j >= Math.max(0, ev.at - 25); j--) {
        const c = cs[j];
        if (ev.dir === 1 && c.c < c.o) { found = j; break; }
        if (ev.dir === -1 && c.c > c.o) { found = j; break; }
      }
      if (found === null) continue;
      const c = cs[found];
      const zone = ev.dir === 1
        ? { top: Math.max(c.o, c.c), bottom: c.l }
        : { top: c.h, bottom: Math.min(c.o, c.c) };
      if (zone.top <= zone.bottom) continue;
      obs.push({ i: found, dir: ev.dir, ...zone, ev });
    }
    // митигирован / отработан
    for (const ob of obs) {
      ob.touched = false; ob.dead = false;
      for (let k = ob.ev.at; k < cs.length; k++) {
        const c = cs[k];
        if (ob.dir === 1) {
          if (c.c < ob.bottom) { ob.dead = true; break; }
          if (c.l <= ob.top) ob.touched = true;
        } else {
          if (c.c > ob.top) { ob.dead = true; break; }
          if (c.h >= ob.bottom) ob.touched = true;
        }
      }
    }
    const alive = obs.filter(o => !o.dead);
    // не дублируем зоны с одной свечи
    const seen = new Set();
    return alive.filter(o => { const k = o.i + ':' + o.dir; if (seen.has(k)) return false; seen.add(k); return true; });
  }

  // имбаланс (FVG), с учётом частичного заполнения
  function findFVG(cs) {
    const out = [];
    for (let i = 2; i < cs.length; i++) {
      if (cs[i].l > cs[i - 2].h) out.push({ i: i - 1, dir: 1, top: cs[i].l, bottom: cs[i - 2].h });
      if (cs[i].h < cs[i - 2].l) out.push({ i: i - 1, dir: -1, top: cs[i - 2].l, bottom: cs[i].h });
    }
    for (const f of out) {
      f.filled = false; f.curTop = f.top; f.curBottom = f.bottom;
      for (let k = f.i + 2; k < cs.length; k++) {
        const c = cs[k];
        if (f.dir === 1) {
          if (c.l <= f.bottom) { f.filled = true; break; }
          f.curTop = Math.min(f.curTop, c.l);
        } else {
          if (c.h >= f.top) { f.filled = true; break; }
          f.curBottom = Math.max(f.curBottom, c.h);
        }
      }
    }
    return out.filter(f => !f.filled && f.curTop > f.curBottom);
  }

  // SFP / снятие: свеча прокалывает прошлый пивот, но закрывается обратно
  function findSweeps(cs, piv, atrArr, lookback = 90) {
    const out = [];
    const lows = piv.filter(p => p.type === 'L');
    const highs = piv.filter(p => p.type === 'H');
    for (let i = Math.max(5, cs.length - lookback); i < cs.length; i++) {
      const c = cs[i], a = atrArr[i] || 0;
      for (let k = lows.length - 1; k >= 0; k--) {
        const p = lows[k];
        if (p.i >= i - 1) continue;
        if (i - p.i > 120) break;
        if (c.l < p.price && c.c > p.price && (p.price - c.l) >= 0.1 * a) {
          out.push({ i, dir: 1, level: p.price }); break;
        }
      }
      for (let k = highs.length - 1; k >= 0; k--) {
        const p = highs[k];
        if (p.i >= i - 1) continue;
        if (i - p.i > 120) break;
        if (c.h > p.price && c.c < p.price && (c.h - p.price) >= 0.1 * a) {
          out.push({ i, dir: -1, level: p.price }); break;
        }
      }
    }
    return out.slice(-6);
  }

  // нож: аномально большая направленная свеча
  function findKnives(cs, atrArr, lookback = 90) {
    const out = [];
    for (let i = Math.max(1, cs.length - lookback); i < cs.length; i++) {
      const c = cs[i], rng = c.h - c.l, a = atrArr[i] || 0;
      if (a > 0 && rng >= 2.8 * a && Math.abs(c.c - c.o) >= 0.55 * rng) {
        out.push({ i, dir: c.c < c.o ? -1 : 1 });
      }
    }
    return out.slice(-5);
  }

  // сжатие: последние N баров в узком диапазоне -> формация под пробой
  function findConsolidation(cs, atrArr, win = 30, mult = 3.0) {
    if (cs.length < win + 5) return null;
    const seg = cs.slice(cs.length - win);
    let top = -Infinity, bottom = Infinity;
    for (const c of seg) { top = Math.max(top, c.h); bottom = Math.min(bottom, c.l); }
    const a = atrArr[cs.length - 1] || 0;
    if (a > 0 && top - bottom <= mult * a) return { i0: cs.length - win, top, bottom };
    return null;
  }

  // диапазон сделки для премиум/дисконта: экстремумы пивотов в окне
  function dealingRange(cs, piv, lookback = 120) {
    const from = Math.max(0, cs.length - lookback);
    let hi = null, lo = null;
    for (const p of piv) {
      if (p.i < from) continue;
      if (p.type === 'H' && (!hi || p.price > hi.price)) hi = p;
      if (p.type === 'L' && (!lo || p.price < lo.price)) lo = p;
    }
    if (!hi || !lo) return null;
    return { high: hi.price, low: lo.price, eq: (hi.price + lo.price) / 2, hiI: hi.i, loI: lo.i };
  }

  function analyze(cs, opts = {}) {
    const o = Object.assign({ left: 3, right: 3, tolMult: 0.25, sweepLb: 90, knifeLb: 90, consolWin: 30, rangeLb: 120 }, opts);
    const atrArr = atrSeries(cs);
    const piv = findPivots(cs, o.left, o.right);
    const { events, trend } = buildStructure(cs, piv);
    return {
      atr: atrArr, piv, events, trend,
      levels: equalLevels(cs, piv, atrArr, o.tolMult),
      obs: orderBlocks(cs, events),
      fvgs: findFVG(cs),
      sweeps: findSweeps(cs, piv, atrArr, o.sweepLb),
      knives: findKnives(cs, atrArr, o.knifeLb),
      consol: findConsolidation(cs, atrArr, o.consolWin),
      range: dealingRange(cs, piv, o.rangeLb),
    };
  }

  return { analyze };
})();

</script>
<script>
/* Свечной график (lightweight-charts) + оверлей-канвас для SMC-разметки:
   зоны (OB/FVG), уровни ликвидности, линии структуры, боксы, премиум/дисконт. */
class ChartView {
  constructor(el) {
    this.el = el;
    if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
    this.chart = LightweightCharts.createChart(el, {
      autoSize: true,
      layout: { background: { color: 'transparent' }, textColor: '#8b949e', fontSize: 11 },
      grid: {
        vertLines: { color: 'rgba(110,118,129,0.08)' },
        horzLines: { color: 'rgba(110,118,129,0.08)' },
      },
      // rightOffset побольше: справа нужно свободное поле, чтобы набрасывать траекторию в будущее
      timeScale: { timeVisible: true, secondsVisible: false, borderColor: 'rgba(110,118,129,0.3)', rightOffset: 12 },
      rightPriceScale: { borderColor: 'rgba(110,118,129,0.3)' },
      crosshair: { mode: 0 },
    });
    this.series = this.chart.addCandlestickSeries({
      upColor: '#26a69a', downColor: '#ef5350',
      wickUpColor: '#26a69a', wickDownColor: '#ef5350',
      borderVisible: false,
      // на дневках монет, которые сильно росли, автомасштаб уводил шкалу в минус —
      // отрицательных цен не бывает, прижимаем нижнюю границу к нулю
      autoscaleInfoProvider: orig => {
        const r = orig();
        if (r && r.priceRange && r.priceRange.minValue < 0) r.priceRange.minValue = 0;
        return r;
      },
    });
    this.canvas = document.createElement('canvas');
    Object.assign(this.canvas.style, { position: 'absolute', left: 0, top: 0, pointerEvents: 'none', zIndex: 3 });
    el.appendChild(this.canvas);

    this.legend = document.createElement('div');
    this.legend.className = 'chart-legend';
    el.appendChild(this.legend);

    this.resetBtn = document.createElement('button');
    this.resetBtn.className = 'chart-reset';
    this.resetBtn.textContent = '⟲ к цене';
    this.resetBtn.title = 'Вернуть график к текущей цене (или двойной клик)';
    this.resetBtn.addEventListener('click', () => this.resetView());
    el.appendChild(this.resetBtn);
    // двойной клик возвращает к цене, но не когда им же заканчивают траекторию
    el.addEventListener('dblclick', () => {
      if (this.drawTools && this.drawTools.blocksDblClick()) return;
      this.resetView();
    });

    this.candles = null;
    this.drawings = null;
    this._raf = null;

    // СИНХРОННО (не requestDraw): при пане/зуме оверлей должен двигаться в том же
    // кадре, что и свечи — через rAF разметка «висит в воздухе» и доклеивается позже
    this.chart.timeScale().subscribeVisibleLogicalRangeChange(() => this.draw());
    new ResizeObserver(() => {
      // появилась ширина — отдаём отложенные данные и подгоняем вид
      if (this._pending && el.clientWidth > 0) {
        const p = this._pending;
        this._pending = null;
        this.setData(p.candles, { fit: true });
      }
      this.requestDraw();
    }).observe(el);
    // вертикальный пан шкалы цены и автоскейл НЕ дают событий — следим сами:
    // каждый кадр сверяем маппинг цена→пиксель и перерисовываем при сдвиге
    const watch = () => {
      // на скрытой вкладке сверять нечего — шесть таймфреймов иначе жгут батарею телефона
      if (this.candles && this.candles.length && this.el.clientWidth) {
        const ref = this.candles[this.candles.length - 1].c;
        const y = this.series.priceToCoordinate(ref);
        const lr = this.chart.timeScale().getVisibleLogicalRange();
        const sig = y + '|' + (lr ? lr.from.toFixed(2) + ':' + lr.to.toFixed(2) : '');
        if (sig !== this._sig) { this._sig = sig; this.draw(); }
      }
      requestAnimationFrame(watch);
    };
    requestAnimationFrame(watch);
    this.chart.subscribeCrosshairMove(p => this._updateLegend(p));
  }

  setPrecision(price) {
    let p = 2;
    if (price < 0.0001) p = 8;
    else if (price < 0.001) p = 7;
    else if (price < 0.01) p = 6;
    else if (price < 0.1) p = 5;
    else if (price < 1) p = 4;
    else if (price < 100) p = 3;
    this.precision = p;
    this.series.applyOptions({ priceFormat: { type: 'price', precision: p, minMove: Math.pow(10, -p) } });
  }

  setData(candles, { fit = false } = {}) {
    // В Telegram Mini App окно разворачивается с анимацией: контейнер какое-то время
    // имеет нулевую ширину. Если отдать данные графику в этот момент, масштаб
    // схлопывается навсегда. Ждём реальной ширины (сработает ResizeObserver ниже).
    if (!this.el.clientWidth) { this._pending = { candles, fit }; return; }
    this._pending = null;  // данные дошли — отложенные свечи больше не нужны
    this._dataLen = candles.length;
    // Обычное обновление той же монеты — доливаем свечи, а не перезаливаем график:
    // так масштаб и позиция не сбиваются, а у правого края график сам идёт за ценой.
    if (!fit && this._patch(candles)) return;
    this.candles = candles;
    this.series.setData(candles.map(c => ({ time: c.t, open: c.o, high: c.h, low: c.l, close: c.c })));
    this.resetView();
    this.requestDraw();
  }

  /* Доливка свежих свечей через series.update(). Возвращает false, если ряды не
     стыкуются (другая монета/ТФ, пропущенный кусок) — тогда перезаливаем целиком. */
  _patch(candles) {
    const old = this.candles;
    if (!old || old.length < 2 || !candles || !candles.length) return false;
    const iv = old[1].t - old[0].t;
    if (!iv || (candles.length > 1 && candles[1].t - candles[0].t !== iv)) return false;
    const lastT = old[old.length - 1].t;
    if (candles[0].t > lastT + iv) return false;              // между рядами дыра
    if (candles[0].t < old[0].t) return false;                // пришла история глубже — только перезаливом
    const i0 = candles.findIndex(c => c.t >= lastT);
    if (i0 < 0) return false;                                 // пришло старьё

    // следовать за новой свечой только если ты у правого края; если ушёл в
    // историю — график остаётся на месте (как в TradingView)
    this.chart.timeScale().applyOptions({ shiftVisibleRangeOnNewBar: this._atRightEdge() });
    for (let i = i0; i < candles.length; i++) {
      const c = candles[i];
      this.series.update({ time: c.t, open: c.o, high: c.h, low: c.l, close: c.c });
    }
    // Bybit отдаёт скользящее окно, но в графике старые свечи остаются — держим
    // такой же склеенный ряд, иначе разметка съедет по индексам.
    const head = [];
    for (const c of old) { if (c.t >= candles[0].t) break; head.push(c); }
    this.candles = head.concat(candles);
    this.requestDraw();
    return true;
  }

  /* Живая свеча: дописываем только последние бары, разметку не пересчитываем.
     _dataLen двигаем на столько же, чтобы индексы разметки остались на месте. */
  pushLast(candles) {
    if (!this.el.clientWidth || this._pending || !this.candles) return false;
    const before = this.candles.length;
    if (!this._patch(candles)) return false;
    this._dataLen += this.candles.length - before;
    return true;
  }

  // видна ли последняя свеча (стоим ли «в моменте»)
  _atRightEdge() {
    const lr = this.chart.timeScale().getVisibleLogicalRange();
    return !lr || lr.to >= this.candles.length - 3;
  }

  // сброс: последние ~140 баров + автомасштаб цены (чтобы график не «терялся» при смене монеты)
  resetView() {
    if (!this.candles || !this.candles.length) return;
    this.chart.priceScale('right').applyOptions({ autoScale: true });
    this.chart.timeScale().setVisibleLogicalRange({
      from: Math.max(0, this.candles.length - 140),
      to: this.candles.length + 14,   // запас справа под траекторию в будущее
    });
    this.requestDraw();
  }

  setMarkers(markers) {
    this.series.setMarkers(markers.sort((a, b) => a.time - b.time));
  }

  setDrawings(d) {
    this.drawings = d;
    this.requestDraw();
  }

  requestDraw() {
    if (this._raf) return;
    this._raf = requestAnimationFrame(() => { this._raf = null; this.draw(); });
  }

  _updateLegend(p) {
    if (!p || !p.seriesData || !p.seriesData.get(this.series)) { this.legend.textContent = this._title || ''; return; }
    const d = p.seriesData.get(this.series);
    const f = v => v.toFixed(this.precision || 2);
    this.legend.textContent = `${this._title || ''}  O ${f(d.open)}  H ${f(d.high)}  L ${f(d.low)}  C ${f(d.close)}`;
  }

  setTitle(t) { this._title = t; this.legend.textContent = t; }

  // x-координата по логическому индексу бара (работает и за пределами видимой области)
  _xMapper() {
    const ts = this.chart.timeScale();
    const lr = ts.getVisibleLogicalRange();
    if (!lr || lr.to === lr.from) return null;
    const a = Math.max(0, Math.ceil(lr.from));
    const b = Math.min(this.candles.length - 1, Math.floor(lr.to));
    let xa = ts.logicalToCoordinate(a), xb = ts.logicalToCoordinate(b);
    if (xa == null || xb == null || b <= a) {
      const w = this._paneW();
      return l => (l - lr.from) / (lr.to - lr.from) * w;
    }
    const slope = (xb - xa) / (b - a);
    return l => xa + (l - a) * slope;
  }

  _paneW() {
    let psw = 60;
    try { psw = this.chart.priceScale('right').width(); } catch (e) {}
    return this.el.clientWidth - psw;
  }

  _paneH() {
    let tsh = 28;
    try { tsh = this.chart.timeScale().height(); } catch (e) {}
    return this.el.clientHeight - tsh;
  }

  draw() {
    const cv = this.canvas, dpr = window.devicePixelRatio || 1;
    const w = this.el.clientWidth, h = this.el.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    this._paint(ctx);
  }

  /* Рисует SMC-разметку (зоны, уровни, линии структуры, полосы) в ctx. Координаты в
     CSS-пикселях: transform выставляет вызывающий. Один и тот же код рисует и экран (draw),
     и снимок графика (shot.js), поэтому они не могут разойтись. */
  _paint(ctx) {
    if (!this.candles || !this.drawings) return;

    const xOf = this._xMapper();
    if (!xOf) return;
    // разметку считали по последнему запросу свечей, а в графике могут лежать ещё
    // и более старые (доливка) — сдвигаем индексы на эту разницу
    const off = this.candles.length - (this._dataLen || this.candles.length);
    const xAt = i => xOf(i + off);
    const yOf = p => this.series.priceToCoordinate(p);
    const paneW = this._paneW(), paneH = this._paneH();

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, paneW, paneH);
    ctx.clip();
    ctx.font = '10px -apple-system, sans-serif';

    const d = this.drawings;

    // фоновые полосы (премиум/дисконт)
    for (const b of d.bands || []) {
      const y1 = yOf(b.top), y2 = yOf(b.bottom);
      if (y1 == null || y2 == null) continue;
      ctx.fillStyle = b.fill;
      ctx.fillRect(0, y1, paneW, y2 - y1);
      if (b.label) {
        ctx.fillStyle = b.color || 'rgba(139,148,158,0.7)';
        ctx.fillText(b.label, 6, Math.min(y1, y2) + 12);
      }
    }

    // зоны: OB / FVG / боксы консолидации
    for (const z of d.zones || []) {
      const x1 = xAt(z.i0);
      const x2 = z.i1 != null ? xAt(z.i1) : paneW;
      const y1 = yOf(z.top), y2 = yOf(z.bottom);
      if (y1 == null || y2 == null) continue;
      ctx.fillStyle = z.fill;
      ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
      if (z.stroke) {
        ctx.strokeStyle = z.stroke;
        ctx.lineWidth = 1;
        ctx.setLineDash(z.dash || []);
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
        ctx.setLineDash([]);
      }
      if (z.label) {
        ctx.fillStyle = z.labelColor || z.stroke || '#8b949e';
        ctx.fillText(z.label, Math.max(x1, 2) + 3, (y1 + y2) / 2 + 3);
      }
    }

    // горизонтальные уровни (ликвидность, EQ, стены стакана).
    // Подписи все прижаты к правому краю и на близких ценах налезали друг на друга —
    // держим занятые строки и сдвигаем следующую подпись вниз.
    const usedRows = [];
    const freeRow = y => {
      let ry = y - 4;
      for (let guard = 0; guard < 12 && usedRows.some(u => Math.abs(u - ry) < 11); guard++) ry += 12;
      usedRows.push(ry);
      return ry;
    };
    for (const ln of d.hlines || []) {
      const y = yOf(ln.price);
      if (y == null) continue;
      const x1 = ln.i0 != null ? xAt(ln.i0) : 0;
      const x2 = ln.i1 != null ? xAt(ln.i1) : paneW;
      ctx.strokeStyle = ln.color;
      ctx.lineWidth = ln.width || 1;
      ctx.setLineDash(ln.dash || []);
      ctx.beginPath();
      ctx.moveTo(x1, y); ctx.lineTo(x2, y);
      ctx.stroke();
      ctx.setLineDash([]);
      if (ln.label) {
        ctx.fillStyle = ln.color;
        const tw = ctx.measureText(ln.label).width;
        ctx.fillText(ln.label, Math.min(x2 - tw - 4, paneW - tw - 4), freeRow(y));
      }
    }

    // линии структуры (BOS/ЧоЧ): от пивота до свечи пробоя
    for (const s of d.slines || []) {
      const x1 = xAt(s.i0), x2 = xAt(s.i1);
      const y = yOf(s.price);
      if (y == null) continue;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x1, y); ctx.lineTo(x2, y);
      ctx.stroke();
      if (s.label) {
        ctx.fillStyle = s.color;
        const tw = ctx.measureText(s.label).width;
        ctx.fillText(s.label, (x1 + x2) / 2 - tw / 2, s.dir === 1 ? y - 4 : y + 12);
      }
    }

    ctx.restore();
  }
}

</script>
<script>
/* Инструменты рисования поверх графика (набор под скальпинг пробоев): курсор, линия тренда,
   горизонтальный луч, вертикаль, перекрестие, прямоугольник, эллипс, фибо, кисть, текст,
   линейка (Δ% и бары, эфемерная), траектория цены (ломаная из колен).
   Плавающая панель, меню рисунка, настройки инструментов и правка текста - в draw2.js.
   Горячие клавиши как в TradingView, магнит к свечам, отмена Cmd+Z.
   Рисунки хранятся в localStorage по символу в координатах время+цена,
   поэтому переживают обновление свечей и видны на всех таймфреймах. */
const DRAW_STORE = 'smc_drawings_v1';
const DRAW_TYPES = ['trend', 'hray', 'path', 'rect', 'ellipse', 'vline', 'cross', 'fib', 'brush', 'text'];  // всё остальное из старых версий игнорируем

/* Из скольких «точек» состоит рисунок. От этого зависят сдвиг, перетаскивание и поиск под курсором.
   two: p1+p2 (углы или концы); one: t+price; time: только t (вертикаль); many: pts[] */
const DRAW_KIND = { trend: 'two', rect: 'two', ellipse: 'two', fib: 'two', hray: 'one', cross: 'one', text: 'one',
                    vline: 'time', path: 'many', brush: 'many' };

// Цвета и толщина по умолчанию. У рисунков, сохранённых раньше, полей c/w нет: берём отсюда, вид не меняется
const DRAW_COLOR0 = { trend: '#58a6ff', path: '#58a6ff', hray: '#e6edf3', vline: '#e6edf3', cross: '#8b949e',
                      rect: '#58a6ff', ellipse: '#a371f7', fib: '#e3b341', brush: '#f0883e', text: '#e6edf3' };
const DRAW_WIDTH0 = { trend: 1.7, path: 1.7, hray: 1.4, vline: 1.2, cross: 1, rect: 1.5, ellipse: 1.5, fib: 1.2, brush: 2, text: 1 };
const DRAW_PALETTE = ['#58a6ff', '#e6edf3', '#3fb950', '#ef5350', '#e3b341', '#a371f7', '#f0883e', '#8b949e'];
const DRAW_WIDTHS = [1, 2, 3.5];
// куда кладём элементы интерфейса поверх графика: по клику на них рисование не начинается
const DRAW_UI_SEL = '.draw-toolbar, .chart-reset, .draw-help, .draw-fp, .draw-form, .chart-ctx, .draw-textin';

const dCol = it => it.c || DRAW_COLOR0[it.type] || '#58a6ff';
const dWid = it => it.w || DRAW_WIDTH0[it.type] || 1.5;
function drawRgba(hex, a) {
  const n = parseInt(String(hex).slice(1), 16) || 0;
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

/* Настройки по умолчанию (долгое нажатие на значок инструмента): одни на все графики,
   хранятся в браузере. У созданного рисунка стиль копируется в сам рисунок, поэтому
   позднейшая смена настроек старые рисунки не перекрашивает. */
const DRAW_DEF_KEY = 'smc_draw_defaults';
const DRAW_DEF = (() => { try { return JSON.parse(localStorage.getItem(DRAW_DEF_KEY) || '{}') || {}; } catch (e) { return {}; } })();
function drawDefSave() { try { localStorage.setItem(DRAW_DEF_KEY, JSON.stringify(DRAW_DEF)); } catch (e) {} }

const DRAW_NAMES = { trend: 'Линия тренда', hray: 'Горизонтальный луч', vline: 'Вертикальная линия', cross: 'Перекрестие',
                     rect: 'Прямоугольник', ellipse: 'Эллипс', fib: 'Фибо-уровни', brush: 'Кисть', text: 'Текст',
                     path: 'Траектория', ruler: 'Линейка' };

// Уровни Фибоначчи как в TradingView: 0 - конец рисунка (p2), 1 - начало (p1), отрицательные - цели за концом
const FIB_LEVELS_ALL = [-0.618, -0.272, 0, 0.236, 0.382, 0.5, 0.618, 0.786, 1, 1.272, 1.618];
const FIB_LEVELS0 = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];
const DRAW_FILLS = [0, 0.12, 0.28];          // заливка: нет / лёгкая / плотная
const TEXT_SIZES = [11, 14, 18, 24];

const drawFont = sz => `600 ${sz}px -apple-system, "Segoe UI", Roboto, sans-serif`;
const drawMeasure = (() => { let c = null; return () => c || (c = document.createElement('canvas').getContext('2d')); })();

// стиль нового рисунка: настройки инструмента (долгое нажатие на значок) поверх заводских
function drawStyleFor(type) {
  const d = DRAW_DEF[type] || {};
  const st = { c: d.c || DRAW_COLOR0[type], w: d.w || DRAW_WIDTH0[type] };
  if (type === 'rect' || type === 'ellipse') st.fa = d.fa != null ? d.fa : DRAW_FILLS[1];
  if (type === 'text') { st.sz = d.sz || TEXT_SIZES[1]; delete st.w; }
  if (type === 'fib') {
    st.lv = (d.lv && d.lv.length ? d.lv : FIB_LEVELS0).slice();
    st.ext = d.ext ? 1 : 0;
    st.lab = d.lab === 0 ? 0 : 1;
  }
  return st;
}

/* Сочетания «Alt+буква» -> инструмент. Сверено 2026-09-19 со встроенным списком TradingView
   (Help - Keyboard shortcuts): tv = как у них. У эллипса, кисти и текста в TradingView клавиш
   нет, поэтому и у нас нет: не придумываем сочетания, которых там не будет. */
const DRAW_HOTKEYS = [
  { code: 'KeyT', tool: 'trend', tv: true },
  { code: 'KeyJ', tool: 'hray', tv: true },
  { code: 'KeyH', tool: 'hray', alias: true },              // в TradingView Alt+H - горизонтальная линия, у нас луч
  { code: 'KeyV', tool: 'vline', tv: true },
  { code: 'KeyC', tool: 'cross', tv: true },
  { code: 'KeyF', tool: 'fib', tv: true },
  { code: 'KeyR', shift: true, tool: 'rect', tv: true },
  { code: 'KeyA', tool: 'path' },
  { code: 'KeyM', tool: 'ruler' },
];

/* У каждого таймфрейма (15M/5M/1M) свой экземпляр DrawTools со своей копией
   рисунков в памяти. Список нужен, чтобы после правки разослать свежие рисунки
   соседям: иначе нарисованное на минутке появится на 15M только после перезагрузки. */
const DRAW_BUS = [];

/* Буфер обмена рисунков — общий для всех графиков, чтобы Cmd+C на одном
   таймфрейме вставлялся Cmd+V на другом (как в TradingView). */
const DRAW_CLIP = [];

/* Оповещения о пробое цены.
   Скринер — статическая страница без сервера, поэтому оповещение ставится так:
   собираем нагрузку «монета|цена|направление|таймфрейм», кодируем в base64url и
   открываем t.me/<бот>?start=<нагрузка>. Telegram отправляет боту /start с этой
   строкой, бот ставит оповещение и дальше сам сторожит цену круглосуточно.
   Лимит Telegram на нагрузку — 64 символа, наша укладывается в ~40. */
const ALERT_BOT = 'gumerovtraderbot';

// На маке модификатор Cmd (metaKey), на остальных Ctrl. Alt в событиях = физическая клавиша Option.
// Ctrl+клик на маке система превращает в правый клик, поэтому Ctrl там за модификатор НЕ считаем
const IS_MAC = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent);
const DRAW_MOD = IS_MAC ? 'Cmd' : 'Ctrl';
const DRAW_ALT = IS_MAC ? 'Option' : 'Alt';
const modKey = e => (IS_MAC ? e.metaKey : e.ctrlKey);

/* Шпаргалка по горячим клавишам (кнопка «?» и вкладка «Клавиши»). Строка: [действие, клавиши, пометка].
   Клавиши: Alt и Mod подставляются под платформу (Option/Cmd на маке), «~текст» - жест мышью.
   Пометка: tv = как в TradingView (сверено 2026-09-19 с их списком), own = своё, none = у инструмента клавиши нет
   (как и в TradingView: у эллипса, кисти и текста сочетаний нет). */
const DRAW_HELP = [
  ['Инструменты: кликни по значку слева, клавиши не нужны', [
    ['Линия тренда', ['Alt', 'T'], 'tv'],
    ['Горизонтальный луч', ['Alt', 'J'], 'tv'],

/* Текст клавиши под платформу. В данных шпаргалки: Alt / Mod - «родные» клавиши платформы,
   значение с ~ - жест мышью (рисуется обычным текстом, а не клавишей). */
function drawKeyLabel(tok, mac) {
  if (tok === 'Alt') return mac ? 'Option' : 'Alt';
  if (tok === 'Mod') return mac ? 'Cmd' : 'Ctrl';
  return tok;
}
function drawKeysHtml(ks, mac = IS_MAC) {
  return ks.map(k => k[0] === '~' ? `<span class="dh-g">${k.slice(1)}</span>` : `<kbd>${drawKeyLabel(k, mac)}</kbd>`)
           .join('<i>+</i>');
}

class DrawTools {
  constructor(cv) {
    this.cv = cv;
    this.symbol = null;
    this.tool = 'cursor';
    this.magnet = false;  // по умолчанию выключен — включается кнопкой 🧲 или Alt+S
    this.items = [];
    this.draft = null;   // создаваемый рисунок
    this.ruler = null;   // линейка (эфемерная, не сохраняется)
    this.sel = [];       // индексы выделенных рисунков (Cmd+клик добавляет)
    this.hidden = false; // Cmd+Alt+H прячет всю разметку
    this.drag = null;
    this._history = [];
    DRAW_BUS.push(this);

    this.canvas = document.createElement('canvas');
    Object.assign(this.canvas.style, { position: 'absolute', left: 0, top: 0, pointerEvents: 'none', zIndex: 4 });
    cv.el.appendChild(this.canvas);

    this._buildToolbar();

    // перерисовываемся вместе с основным оверлеем
    const orig = cv.draw.bind(cv);
    cv.draw = () => { orig(); this.render(); };

    cv.el.addEventListener('pointerdown', e => this._down(e), true);
    cv.el.addEventListener('contextmenu', e => this._ctxOpen(e));
    // поле ввода текста открываем по click, а не по pointerdown: iOS показывает клавиатуру, только если
    // фокус поставлен из «завершённого» жеста
    cv.el.addEventListener('click', () => this._textPendingFire());
    window.addEventListener('pointermove', e => this._move(e));
    window.addEventListener('pointerup', e => this._up(e));
    // браузер отобрал жест (на таче - под прокрутку): без этого перетаскивание «залипло» бы до следующего отпускания
    window.addEventListener('pointercancel', e => this._up(e));
    window.addEventListener('keydown', e => this._hotkey(e));
  }

  /* ---------- панель ---------- */
  _buildToolbar() {
    const bar = document.createElement('div');
    bar.className = 'draw-toolbar';
    const A = DRAW_ALT;
    this.btns = {};
    const sep = () => bar.appendChild(Object.assign(document.createElement('div'), { className: 'sep' }));
    const mk = (icon, title, fn) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = DRAW_ICONS[icon];
      b.title = title;
      // после клика мышью фокус со значка снимаем: иначе Enter/Пробел потом нажмут его ещё раз
      b.addEventListener('click', e => { fn(e); if (e.detail) b.blur(); });
      bar.appendChild(b);
      return b;
    };
    // инструмент: клик включает, долгое нажатие (или правый клик) открывает настройки
    const tool = (id, label, key) => {
      const b = mk(id, `${label} · ${key}` + (id === 'cursor' ? '' : ' · зажми значок — настройки'),
                   () => { if (b._lp) { b._lp = false; return; } this.setTool(this.tool === id ? 'cursor' : id); });
      if (id !== 'cursor') this._longPress(b, () => this._formOpen(id, null, b));
      this.btns[id] = b;
      return b;
    };
    // Порядок важен: на компьютере панель в две колонки, пары идут по строкам без пустых клеток
    tool('cursor', `Курсор: выбрать, подвинуть, ${DRAW_MOD}+клик — несколько`, 'Esc');
    this.magnetBtn = mk('magnet', `Магнит: привязка к свечам · ${A}+S (${DRAW_MOD} при перетаскивании точки — временно наоборот)`, () => this.toggleMagnet());
    this.magnetBtn.classList.toggle('active', this.magnet);
    sep();
    // оповещения и шпаргалка вверху: на телефоне панель прокручивается, и они не должны уехать вниз за края
    this.bellBtn = mk('bell', 'Оповещение о пробое цены', () => this.toggleAlerts());
    this.helpBtn = mk('help', 'Горячие клавиши', () => this.toggleHelp());
    sep();
    tool('trend', 'Линия тренда (Shift — ровно)', A + '+T');
    tool('hray', 'Горизонтальный луч (уровень вправо)', A + '+J');
    tool('vline', 'Вертикальная линия', A + '+V');
    tool('cross', 'Перекрестие', A + '+C');
    tool('rect', 'Прямоугольник (Shift — квадрат)', 'Shift+' + A + '+R');
    tool('ellipse', 'Эллипс (Shift — круг)', 'без клавиши');
    tool('fib', 'Фибо-уровни: два клика', A + '+F');
    tool('path', 'Траектория цены: клик за кликом, двойной клик — конец', A + '+A');
    tool('brush', 'Кисть: рисуй от руки', 'без клавиши');
    tool('text', 'Текст: клик и печатай', 'без клавиши');
    tool('ruler', 'Линейка (или Shift+протянуть)', A + '+M');
    this.eyeBtn = mk('eye', `Спрятать / показать все рисунки · ${DRAW_MOD}+${A}+H`, () => this.toggleHidden());
    sep();
    mk('trash', 'Удалить выделенное · Delete, Backspace или клик колесом мыши', () => this._deleteSelected());
    mk('clear', `Стереть все рисунки на монете · ${A}+Backspace`, () => this.clearAll());

    this.cv.el.appendChild(bar);
    this.bar = bar;
    this.setTool('cursor');
  }

  setTool(id) {
    // вернулись к курсору после рисунка: двойной клик, которым его закончили, не должен сбросить вид графика
    if (this.tool !== 'cursor' && id === 'cursor') this._finishedAt = Date.now();
    this._textClose(true);
    this._formClose();
    this.tool = id;
    this.draft = null;
    for (const [k, b] of Object.entries(this.btns)) b.classList.toggle('active', k === id);
    // пока активен инструмент — жесты не двигают график (важно для тача)
    this.cv.el.style.touchAction = id === 'cursor' ? '' : 'none';
    this.cv.requestDraw();
  }

  toggleMagnet() {
    this.magnet = !this.magnet;
    this.magnetBtn.classList.toggle('active', this.magnet);
    this._toast(this.magnet ? 'Магнит включён' : 'Магнит выключен');
  }

  _isSel(i) { return this.sel.includes(i); }

  /* Сдвинуть рисунок на dt/dp от его ТЕКУЩЕГО положения (стрелки, вставка). */
  _shift(it, dt, dp) {
    const k = DRAW_KIND[it.type];
    if (k === 'one') { it.t += dt; it.price += dp; }
    else if (k === 'time') it.t += dt;
    else if (k === 'many') it.pts = it.pts.map(q => ({ t: q.t + dt, price: q.price + dp }));
    else {
      it.p1 = { t: it.p1.t + dt, price: it.p1.price + dp };
      it.p2 = { t: it.p2.t + dt, price: it.p2.price + dp };
    }
  }

  _anchorOf(it) {
    const k = DRAW_KIND[it.type];
    if (k === 'one') return { t: it.t, price: it.price };
    if (k === 'time') return { t: it.t, price: 0 };    // у вертикали цены нет, при вставке её сдвиг не применяется
    if (k === 'many') return { t: it.pts[0].t, price: it.pts[0].price };
    return { t: it.p1.t, price: it.p1.price };
  }

  /* Сдвиг в единицах графика на dx/dy ЭКРАННЫХ пикселей (от середины поля):
     одинаковый шаг на любом масштабе. */
  _screenDelta(dx, dy) {
    const ts = this.cv.chart.timeScale();
    const rx = this.cv._paneW() / 2, ry = this.cv._paneH() / 2;
    const l0 = ts.coordinateToLogical(rx), l1 = ts.coordinateToLogical(rx + dx);
    const p0 = this.cv.series.coordinateToPrice(ry), p1 = this.cv.series.coordinateToPrice(ry + dy);
    return { dt: (l0 != null && l1 != null) ? (l1 - l0) * this._iv() : 0, dp: (p0 != null && p1 != null) ? p1 - p0 : 0 };
  }

  /* Стрелки двигают выделенное на dx/dy ЭКРАННЫХ пикселей — как в TradingView,
     то есть шаг одинаковый на любом масштабе. */
  _nudge(dx, dy) {
    if (!this.sel.length || !this.cv.candles) return;
    const { dt, dp } = this._screenDelta(dx, dy);
    if (!dt && !dp) return;
    this._pushHistory();
    for (const i of this.sel) if (this.items[i]) this._shift(this.items[i], dt, dp);
    this._save();
    this.cv.requestDraw();
  }

  copySel() {
    if (!this.sel.length) { this._toast('Нечего копировать'); return; }
    DRAW_CLIP.length = 0;
    for (const i of this.sel) if (this.items[i]) DRAW_CLIP.push(JSON.parse(JSON.stringify(this.items[i])));
    this._toast(`Скопировано: ${DRAW_CLIP.length}`);
  }

  pasteClip() {
    if (!DRAW_CLIP.length) { this._toast('Буфер пуст'); return; }
    this._pushHistory();
    // опорная точка - первый рисунок, у которого есть цена (у вертикали её нет)
    const ref = DRAW_CLIP.find(i => DRAW_KIND[i.type] !== 'time') || DRAW_CLIP[0];
    const base = this._anchorOf(ref);
    const to = this._lastPt || base;   // вставляем туда, где курсор
    const dt = to.t - base.t, dp = to.price - base.price;
    this.sel = [];
    for (const src of DRAW_CLIP) {
      const it = JSON.parse(JSON.stringify(src));
      this._shift(it, dt, dp);
      this.items.push(it);
      this.sel.push(this.items.length - 1);
    }
    this._save();
    this.cv.requestDraw();
    this._toast(`Вставлено: ${DRAW_CLIP.length}`);
  }

  // Cmd+Alt+H — спрятать/показать всю разметку сразу на всех таймфреймах
  toggleHidden(force) {
    const v = force == null ? !this.hidden : force;
    for (const o of DRAW_BUS) {
      o.hidden = v;
      if (o.eyeBtn) o.eyeBtn.classList.toggle('active', v);
      o.cv.requestDraw();
    }
    this._toast(v ? 'Рисунки скрыты' : 'Рисунки показаны');
  }

  /* ---------- меню по правому клику ---------- */

  _ctxOpen(e) {
    // на панелях и кнопках оставляем обычное меню браузера
    if (e.target.closest(DRAW_UI_SEL)) return;
    if (!this.cv.candles) return;
    if (this.draft) {   // правый клик отменяет недорисованное (то же, что Esc)
      e.preventDefault();
      this.draft = null;
      this.cv.requestDraw();
      return;
    }
    const { x, y } = this._xy(e);
    if (!this._inPane(x, y)) return;
    const price = this.cv.series.coordinateToPrice(y);
    if (price == null || !(price > 0)) return;
    e.preventDefault();
    this._textClose(true);
    this._formClose();

    // правый клик по рисунку - меню самого рисунка, по пустому месту - меню цены
    const hit = this.tool === 'cursor' ? this._hitTest(x, y) : null;
    if (hit) {
      this.sel = [hit.i];
      this.drag = null;
      this.cv.requestDraw();
      this._itemMenu(hit.i, x, y);
      return;
    }
    this._ctxShow(x, y, this._fmt(price), [
      { icon: 'bell', label: 'Оповещение на этой цене', fn: () => this._sendAlert(price) },
      { icon: 'hray', label: 'Горизонтальный луч здесь', fn: () => this._ctxAddRay(price) },
      { icon: 'copy', label: 'Скопировать цену', fn: () => this._ctxCopy(price) },
    ]);
  }

  /* Одно меню на график, содержимое собирается заново: rows = [{icon, label, fn, danger?} | {sep:true}].
     Позиция - x/y внутри графика, меню не вылезает за край. */
  _ctxShow(x, y, head, rows) {
    if (!this.ctxEl) {
      const box = document.createElement('div');
      box.className = 'chart-ctx';
      box.hidden = true;
      box.addEventListener('pointerdown', ev => ev.stopPropagation());
      box.addEventListener('click', ev => {
        const b = ev.target.closest('[data-i]');
        if (!b) return;
        const row = this._ctxRows[+b.dataset.i];
        this._ctxClose();
        if (row && row.fn) row.fn();
      });
      this.cv.el.appendChild(box);
      this.ctxEl = box;
      // закрываем по клику мимо, по Esc и при прокрутке графика
      window.addEventListener('pointerdown', ev => {
        if (!this.ctxEl || this.ctxEl.hidden) return;
        // target не всегда элемент (бывает document) — closest() там нет
        const t = ev.target instanceof Element ? ev.target : null;
        if (!t || !t.closest('.chart-ctx')) this._ctxClose();
      }, true);
      this.cv.el.addEventListener('wheel', () => this._ctxClose(), { passive: true });
    }
    this._ctxRows = rows;
    const box = this.ctxEl;
    box.innerHTML = `<div class="cx-price">${head}</div>` + rows.map((r, i) => r.sep
      ? '<div class="cx-sep"></div>'
      : `<button type="button" data-i="${i}"${r.danger ? ' class="danger"' : ''}>${DRAW_ICONS[r.icon] || ''}<span>${r.label}</span></button>`).join('');
    box.hidden = false;
    // держим меню внутри графика, а не за краем
    const w = box.offsetWidth, h = box.offsetHeight;
    box.style.left = Math.max(2, Math.min(x, this.cv.el.clientWidth - w - 2)) + 'px';
    box.style.top = Math.max(2, Math.min(y, this.cv.el.clientHeight - h - 2)) + 'px';
  }

  _ctxClose() {
    if (this.ctxEl) this.ctxEl.hidden = true;
  }

  _ctxAddRay(price) {
    const cs = this.cv.candles;
    if (!cs || !cs.length) return;
    this._pushHistory();
    // луч начинаем от левого края видимой области — так он виден целиком
    const lr = this.cv.chart.timeScale().getVisibleLogicalRange();
    const t = this._l2t(lr ? Math.max(0, lr.from) : 0);
    this.items.push(this._newItem('hray', { t, price }));
    this.sel = [this.items.length - 1];
    this._save();
    this.cv.requestDraw();
    this._toast('Уровень ' + this._fmt(price));
  }

  _ctxCopy(price) {
    const txt = this._fmt(price);
    const ok = () => this._toast('Скопировано: ' + txt);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(ok, () => this._ctxCopyFallback(txt, ok));
    } else {
      this._ctxCopyFallback(txt, ok);
    }
  }

  // запасной путь: в старых WebView Telegram нет clipboard API
  _ctxCopyFallback(txt, ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      ok();
    } catch (e) {
      this._toast('Не удалось скопировать');
    }
  }

  /* ---------- оповещения о пробое ---------- */

  _alertSymbol() { return this.symbol || (typeof state !== 'undefined' ? state.symbol : '') || ''; }

  _alertTf() {
    try { return TF_CFG[state.mode].label; } catch (e) { return ''; }
  }

  _lastPrice() {
    const cs = this.cv.candles;
    return cs && cs.length ? cs[cs.length - 1].c : 0;
  }

  /* Открыть бота со ссылкой, по которой он поставит оповещение. */
  _sendAlert(price) {
    const sym = this._alertSymbol();
    const last = this._lastPrice();
    if (!sym || !(price > 0) || !last) { this._toast('Нужна цена больше нуля'); return; }
    if (Math.abs(price - last) / last < 0.0001) { this._toast('Цена слишком близко к текущей'); return; }
    const dir = price > last ? 'up' : 'down';
    // округляем до точности графика: у уровня с графика цена сырая, с 16 знаками,
    // и на дешёвых монетах нагрузка не влезла бы в лимит Telegram в 64 символа
    const px = +Number(price).toFixed(this.cv.precision || 8);
    const raw = `${sym}|${px}|${dir}|${this._alertTf()}`;
    const payload = btoa(raw).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    if (payload.length > 64) { this._toast('Слишком длинная цена'); return; }
    const url = `https://t.me/${ALERT_BOT}?start=${payload}`;
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
    else window.open(url, '_blank', 'noopener');
  }

  /* Панель: цена вручную + быстрые кнопки по нарисованным горизонтальным уровням. */
  toggleAlerts(open) {
    if (!this.alertEl) {
      const box = document.createElement('div');
      box.className = 'draw-help draw-alerts';
      box.hidden = true;
      box.innerHTML =
        '<div class="dh-head"><b>Оповещение о пробое</b><button type="button" class="dh-x" title="Закрыть · Esc">×</button></div>' +
        '<div class="al-info"></div>' +
        '<div class="al-form"><input type="text" inputmode="decimal" class="al-price" placeholder="цена"><button type="button" class="al-go">Поставить</button></div>' +
        '<div class="al-dir"></div>' +
        '<div class="al-levels"></div>' +
        `<div class="al-note">Оповещение придёт в бота @${ALERT_BOT}. Сработает один раз, потом снимется. Все свои — команда /alerts в боте.</div>`;
      box.querySelector('.dh-x').addEventListener('click', () => this.toggleAlerts(false));
      const inp = box.querySelector('.al-price');
      inp.addEventListener('input', () => this._alertDir());
      inp.addEventListener('keydown', e => {
        e.stopPropagation();                       // Esc и буквы не должны дёргать инструменты
        if (e.key === 'Enter') this._sendAlert(parseFloat(inp.value.replace(',', '.')));
      });
      box.querySelector('.al-go').addEventListener('click', () => this._sendAlert(parseFloat(inp.value.replace(',', '.'))));
      box.querySelector('.al-levels').addEventListener('click', e => {
        const b = e.target.closest('[data-price]');
        if (b) this._sendAlert(parseFloat(b.dataset.price));
      });
      this.cv.el.appendChild(box);
      this.alertEl = box;
    }
    const show = open == null ? this.alertEl.hidden : open;
    this.alertEl.hidden = !show;
    if (this.bellBtn) this.bellBtn.classList.toggle('active', show);
    clearInterval(this._alertTimer);
    if (show) {
      this._alertFill();
      // цена живая: пока панель открыта, обновляем её и процент до уровня
      this._alertTimer = setInterval(() => {
        if (this.alertEl.hidden) { clearInterval(this._alertTimer); return; }
        this._alertFill();
      }, 1000);
    }
  }

  _alertFill() {
    const box = this.alertEl, last = this._lastPrice(), f = v => v.toFixed(this.cv.precision || 2);
    box.querySelector('.al-info').innerHTML =
      `<b>${this._alertSymbol() || '—'}</b> · ${this._alertTf()}<br>Цена сейчас: <b>${last ? f(last) : '—'}</b>`;
    const inp = box.querySelector('.al-price');
    if (!inp.value && last && document.activeElement !== inp) inp.value = f(last);
    this._alertDir();
    // уровни, которые уже нарисованы горизонтальным лучом на этой монете
    const lv = this.items.filter(i => i.type === 'hray' || i.type === 'cross').map(i => i.price).sort((a, b) => b - a);
    box.querySelector('.al-levels').innerHTML = lv.length
      ? '<div class="al-cap">Уровни с графика</div>' + lv.map(pr =>
          `<button type="button" class="al-lv" data-price="${pr}">${f(pr)} <i>${pr > last ? 'вверх ↑' : 'вниз ↓'}</i></button>`).join('')
      : '<div class="al-cap dim">Нарисуй горизонтальный луч (' + DRAW_ALT + '+J) — уровень появится здесь кнопкой</div>';
  }

  _alertDir() {
    const box = this.alertEl, last = this._lastPrice();
    const v = parseFloat((box.querySelector('.al-price').value || '').replace(',', '.'));
    const el = box.querySelector('.al-dir');
    if (!(v > 0) || !last) { el.textContent = ''; return; }
    if (Math.abs(v - last) / last < 0.0001) {   // ровно текущая цена — направления нет
      el.textContent = 'Укажи цену выше или ниже текущей';
      return;
    }
    const up = v > last;
    const pct = Math.abs(v - last) / last * 100;
    el.innerHTML = `Сработает при пробое <b>${up ? 'вверх ↑' : 'вниз ↓'}</b> · ${pct.toFixed(2)}% от текущей`;
  }

  /* Шпаргалка: строится один раз при первом открытии. */
  toggleHelp(open) {
    if (!this.helpEl) {
      const box = document.createElement('div');
      box.className = 'draw-help';
      box.hidden = true;
      box.innerHTML =
        '<div class="dh-head"><b>Горячие клавиши</b><button type="button" class="dh-x" title="Закрыть · Esc">×</button></div>' +
        DRAW_HELP.map(([title, rows]) =>
          `<div class="dh-group">${title}</div>` +
          rows.map(([label, ks, tag]) =>
            `<div class="dh-row"><span>${label}${tag === 'tv' ? '<em class="dh-tv" title="Как в TradingView">TV</em>' : ''}</span>` +
            `<span class="dh-keys">${drawKeysHtml(ks)}</span></div>`).join('')
        ).join('') +
        '<button type="button" class="dh-open">Открыть вкладкой: все клавиши, поиск и проверка</button>';
      box.querySelector('.dh-x').addEventListener('click', () => this.toggleHelp(false));
      box.querySelector('.dh-open').addEventListener('click', () => {
        this.toggleHelp(false);
        if (typeof Keys !== 'undefined') Keys.show(true);
      });
      // клик внутри шпаргалки не должен доходить до графика
      box.addEventListener('pointerdown', e => e.stopPropagation());
      this.cv.el.appendChild(box);
      this.helpEl = box;
    }
    const show = open == null ? this.helpEl.hidden : open;
    this.helpEl.hidden = !show;
    if (this.helpBtn) this.helpBtn.classList.toggle('active', show);
  }

  clearAll() {
    if (!this.items.length) return;
    this._pushHistory();
    this.items = [];
    this.sel = [];
    this.ruler = null;
    this._save();
    this.cv.requestDraw();
    this._toast('Рисунки удалены · ' + DRAW_MOD + '+Z вернёт');
  }

  // короткая подсказка в углу графика
  _toast(text) {
    clearTimeout(this._toastT);
    if (!this._toastEl) {
      this._toastEl = document.createElement('div');
      this._toastEl.className = 'draw-toast';
      this.cv.el.appendChild(this._toastEl);
    }
    this._toastEl.textContent = text;
    this._toastEl.classList.add('show');
    this._toastT = setTimeout(() => this._toastEl.classList.remove('show'), 1400);
  }

  /* ---------- история (Cmd+Z) ---------- */
  _pushHistory() {
    this._history.push(JSON.stringify(this.items));
    if (this._history.length > 50) this._history.shift();
  }

  undo() {
    if (!this._history.length) { this._toast('Отменять нечего'); return; }
    this.items = JSON.parse(this._history.pop());
    this.sel = [];
    this.draft = null;
    this._save();
    this.cv.requestDraw();
    this._toast('Отменено');
  }

  /* ---------- горячие клавиши (раскладка TradingView) ---------- */
  _hotkey(e) {
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) return;
    if (e.isComposing) return;                                    // набор через IME - не наши клавиши
    if (typeof Keys !== 'undefined' && Keys.isOpen()) return;     // на вкладке «Клавиши» график не трогаем
    if (!this.cv.el.offsetParent) return;                         // только видимая вкладка

    const code = e.code;  // раскладка-независимо: KeyT работает и на русской. На маке Option+буква
                          // печатает другой символ (e.key), но e.code остаётся KeyT
    const mod = e.metaKey || e.ctrlKey;

    if (mod && !e.altKey && code === 'KeyZ') { e.preventDefault(); this.undo(); return; }
    if (mod && e.altKey && code === 'KeyH') { e.preventDefault(); this.toggleHidden(); return; }
    // Cmd+Option+C/V не трогаем: у браузера там инструменты разработчика
    if (mod && !e.altKey && code === 'KeyC') { e.preventDefault(); this.copySel(); return; }
    if (mod && !e.altKey && code === 'KeyV') { e.preventDefault(); this.pasteClip(); return; }

    // стрелки двигают выделенное; с Shift — крупным шагом
    const ARROW = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (ARROW[code] && this.sel.length && !mod) {
      e.preventDefault();
      const k = e.shiftKey ? 10 : 1;
      this._nudge(ARROW[code][0] * k, ARROW[code][1] * k);
      return;
    }

    if (e.altKey && !mod) {
      const hk = DRAW_HOTKEYS.find(h => h.code === code && !!h.shift === e.shiftKey);
      if (hk) {
        e.preventDefault();
        this.setTool(hk.tool);
        this._toast(this.btns[hk.tool].title.split(' · ')[0]);
        return;
      }
      // запасное сочетание для «спрятать разметку»: Cmd+Option+H в macOS ещё и «Скрыть остальные»
      if (code === 'KeyH' && e.shiftKey) { e.preventDefault(); this.toggleHidden(); return; }
      if (code === 'KeyS' && !e.shiftKey) { e.preventDefault(); this.toggleMagnet(); return; }
      if (code === 'Backspace' || code === 'Delete') { e.preventDefault(); this.clearAll(); return; }
      return;
    }

    if (code === 'Enter' && this.draft && this.draft.type === 'path') {
      e.preventDefault();
      this._finishPath();
      return;
    }
    if (code === 'Escape') {
      e.preventDefault();
      if (this.formEl) { this._formClose(); return; }
      if (this.helpEl && !this.helpEl.hidden) { this.toggleHelp(false); return; }
      if (this.ctxEl && !this.ctxEl.hidden) { this._ctxClose(); return; }
      if (this.alertEl && !this.alertEl.hidden) { this.toggleAlerts(false); return; }
      if (this.draft) { this.draft = null; this.cv.requestDraw(); }
      else if (this.tool !== 'cursor') this.setTool('cursor');
      else if (this.sel.length) { this.sel = []; this.cv.requestDraw(); }
      return;
    }
    if ((code === 'Delete' || code === 'Backspace') && this.sel.length) {
      e.preventDefault();
      this._deleteSelected();
    }
  }

  setSymbol(sym) {
    if (sym === this.symbol) return;
    this.symbol = sym;
    // в панели оповещений осталась бы цена прошлой монеты — и оповещение
    // ушло бы на уровень, которого у новой монеты нет
    // Заполнять сразу нельзя: setSymbol зовётся ДО setData, свечи ещё от прошлой
    // монеты — в поле попала бы её цена. Просто чистим, а обновит таймер панели,
    // когда данные новой монеты уже приедут.
    if (this.alertEl) this.alertEl.querySelector('.al-price').value = '';
    this._textClose(false);
    this._formClose();
    this._ctxClose();
    this.items = this._load(sym);
    this.sel = [];
    this.draft = null;
    this.ruler = null;
    this._history = [];
    this.cv.requestDraw();
  }

  /* ---------- хранение ---------- */
  _load(sym) {
    try {
      const arr = (JSON.parse(localStorage.getItem(DRAW_STORE) || '{}')[sym]) || [];
      return arr
        // старые стрелки из двух точек — это та же траектория, не теряем их
        .map(i => (i.type === 'arrow' && i.p1 && i.p2) ? { type: 'path', pts: [i.p1, i.p2] } : i)
        .filter(i => i && DRAW_TYPES.includes(i.type) && this._valid(i));
    } catch (e) { return []; }
  }

  // битый рисунок (нет точек, нет текста) лучше выбросить, чем уронить отрисовку
  _valid(i) {
