  bell: '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 12.6V8.2a4.4 4.4 0 0 1 8.8 0v4.4l1.3 1.6H3.3z"/><path d="M7.4 16.1a1.9 1.9 0 0 0 3.2 0"/></svg>',
  help: '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="9" cy="9" r="6.6"/><path d="M7.1 6.9a1.95 1.95 0 1 1 2.6 1.85c-.5.2-.7.6-.7 1.1v.4"/><circle cx="9" cy="13" r=".75" fill="currentColor" stroke="none"/></svg>',
  copy: '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6.4" y="6.4" width="8.2" height="8.2" rx="1.6"/><path d="M11.6 6.4V5a1.6 1.6 0 0 0-1.6-1.6H5A1.6 1.6 0 0 0 3.4 5v5a1.6 1.6 0 0 0 1.6 1.6h1.4"/></svg>',
  clear: '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4.5 4.5l9 9M13.5 4.5l-9 9"/></svg>',
};

class DrawTools {
  constructor(cv) {
    this.cv = cv;
    this.symbol = null;
    this.tool = 'cursor';
    this.magnet = false;  // по умолчанию выключен — включается кнопкой 🧲 или Alt+S
    this.items = [];
    this.draft = null;   // создаваемый рисунок
    this.ruler = null;   // линейка (эфемерная, не сохраняется)
    this.sel = [];       // индексы выделенных рисунков (Cmd+клик добавляет)
    this.hidden = false; // Cmd+Alt+H прячет всю разметку
    this.drag = null;
    this._history = [];
    DRAW_BUS.push(this);

    this.canvas = document.createElement('canvas');
    Object.assign(this.canvas.style, { position: 'absolute', left: 0, top: 0, pointerEvents: 'none', zIndex: 4 });
    cv.el.appendChild(this.canvas);

    this._buildToolbar();

    // перерисовываемся вместе с основным оверлеем
    const orig = cv.draw.bind(cv);
    cv.draw = () => { orig(); this.render(); };

    cv.el.addEventListener('pointerdown', e => this._down(e), true);
    cv.el.addEventListener('contextmenu', e => this._ctxOpen(e));
    window.addEventListener('pointermove', e => this._move(e));
    window.addEventListener('pointerup', e => this._up(e));
    window.addEventListener('keydown', e => this._hotkey(e));
  }

  /* ---------- панель ---------- */
  _buildToolbar() {
    const bar = document.createElement('div');
    bar.className = 'draw-toolbar';
    const groups = [
      [['cursor', 'Курсор: выбрать, подвинуть, Cmd+клик — несколько', 'Esc']],
      [['trend', 'Линия тренда (Shift — ровно)', 'Alt+T'],
       ['hray', 'Горизонтальный луч (уровень вправо)', 'Alt+J'],
       ['path', 'Траектория цены: клик за кликом, двойной клик — конец', 'Alt+A']],
      [['ruler', 'Линейка (или Shift+протянуть)', 'Alt+M']],
    ];
    this.btns = {};
    groups.forEach((group, gi) => {
      if (gi) bar.appendChild(Object.assign(document.createElement('div'), { className: 'sep' }));
      for (const [id, label, key] of group) {
        const b = document.createElement('button');
        b.innerHTML = DRAW_ICONS[id];
        b.title = `${label} · ${key}`;
        b.addEventListener('click', () => this.setTool(id));
        bar.appendChild(b);
        this.btns[id] = b;
      }
    });

    bar.appendChild(Object.assign(document.createElement('div'), { className: 'sep' }));
    this.magnetBtn = document.createElement('button');
    this.magnetBtn.innerHTML = DRAW_ICONS.magnet;
    this.magnetBtn.title = 'Магнит: привязка к свечам · Alt+S (Cmd при перетаскивании точки — временно наоборот)';
    this.magnetBtn.classList.toggle('active', this.magnet);
    this.magnetBtn.addEventListener('click', () => this.toggleMagnet());
    bar.appendChild(this.magnetBtn);

    bar.appendChild(Object.assign(document.createElement('div'), { className: 'sep' }));
    const del = document.createElement('button');
    del.innerHTML = DRAW_ICONS.trash;
    del.title = 'Удалить выделенное · Delete, Backspace или клик колесом мыши';
    del.addEventListener('click', () => this._deleteSelected());
    bar.appendChild(del);
    const clear = document.createElement('button');
    clear.innerHTML = DRAW_ICONS.clear;
    clear.title = 'Стереть все рисунки на монете · Alt+Backspace';
    clear.addEventListener('click', () => this.clearAll());
    bar.appendChild(clear);

    bar.appendChild(Object.assign(document.createElement('div'), { className: 'sep' }));
    const bell = document.createElement('button');
    bell.innerHTML = DRAW_ICONS.bell;
    bell.title = 'Оповещение о пробое цены';
    bell.addEventListener('click', () => this.toggleAlerts());
    bar.appendChild(bell);
    this.bellBtn = bell;

    const help = document.createElement('button');
    help.innerHTML = DRAW_ICONS.help;
    help.title = 'Горячие клавиши';
    help.addEventListener('click', () => this.toggleHelp());
    bar.appendChild(help);
    this.helpBtn = help;

    this.cv.el.appendChild(bar);
    this.setTool('cursor');
  }

  setTool(id) {
    this.tool = id;
    this.draft = null;
    for (const [k, b] of Object.entries(this.btns)) b.classList.toggle('active', k === id);
    // пока активен инструмент — жесты не двигают график (важно для тача)
    this.cv.el.style.touchAction = id === 'cursor' ? '' : 'none';
    this.cv.requestDraw();
  }

  toggleMagnet() {
    this.magnet = !this.magnet;
    this.magnetBtn.classList.toggle('active', this.magnet);
    this._toast(this.magnet ? 'Магнит включён' : 'Магнит выключен');
  }

  _isSel(i) { return this.sel.includes(i); }

  /* Сдвинуть рисунок на dt/dp от его ТЕКУЩЕГО положения (стрелки, вставка). */
  _shift(it, dt, dp) {
    if (it.type === 'hray') { it.t += dt; it.price += dp; return; }
    if (it.type === 'path') { it.pts = it.pts.map(q => ({ t: q.t + dt, price: q.price + dp })); return; }
    it.p1 = { t: it.p1.t + dt, price: it.p1.price + dp };
    it.p2 = { t: it.p2.t + dt, price: it.p2.price + dp };
  }

  _anchorOf(it) {
    if (it.type === 'hray') return { t: it.t, price: it.price };
    if (it.type === 'path') return { t: it.pts[0].t, price: it.pts[0].price };
    return { t: it.p1.t, price: it.p1.price };
  }

  /* Стрелки двигают выделенное на dx/dy ЭКРАННЫХ пикселей — как в TradingView,
     то есть шаг одинаковый на любом масштабе. */
  _nudge(dx, dy) {
    if (!this.sel.length || !this.cv.candles) return;
    const ts = this.cv.chart.timeScale();
    const rx = this.cv._paneW() / 2, ry = this.cv._paneH() / 2;
    const l0 = ts.coordinateToLogical(rx), l1 = ts.coordinateToLogical(rx + dx);
    const p0 = this.cv.series.coordinateToPrice(ry), p1 = this.cv.series.coordinateToPrice(ry + dy);
    const dt = (l0 != null && l1 != null) ? (l1 - l0) * this._iv() : 0;
    const dp = (p0 != null && p1 != null) ? p1 - p0 : 0;
    if (!dt && !dp) return;
    this._pushHistory();
    for (const i of this.sel) if (this.items[i]) this._shift(this.items[i], dt, dp);
    this._save();
    this.cv.requestDraw();
  }

  copySel() {
    if (!this.sel.length) { this._toast('Нечего копировать'); return; }
    DRAW_CLIP.length = 0;
    for (const i of this.sel) if (this.items[i]) DRAW_CLIP.push(JSON.parse(JSON.stringify(this.items[i])));
    this._toast(`Скопировано: ${DRAW_CLIP.length}`);
  }

  pasteClip() {
    if (!DRAW_CLIP.length) { this._toast('Буфер пуст'); return; }
    this._pushHistory();
    const base = this._anchorOf(DRAW_CLIP[0]);
    const to = this._lastPt || base;   // вставляем туда, где курсор
    const dt = to.t - base.t, dp = to.price - base.price;
    this.sel = [];
    for (const src of DRAW_CLIP) {
      const it = JSON.parse(JSON.stringify(src));
      this._shift(it, dt, dp);
      this.items.push(it);
      this.sel.push(this.items.length - 1);
    }
    this._save();
    this.cv.requestDraw();
    this._toast(`Вставлено: ${DRAW_CLIP.length}`);
  }

  // Cmd+Alt+H — спрятать/показать всю разметку сразу на всех таймфреймах
  toggleHidden() {
    const v = !this.hidden;
    for (const o of DRAW_BUS) { o.hidden = v; o.cv.requestDraw(); }
    this._toast(v ? 'Рисунки скрыты' : 'Рисунки показаны');
  }

  /* ---------- меню по правому клику ---------- */

  _ctxOpen(e) {
    // на панелях и кнопках оставляем обычное меню браузера
    if (e.target.closest('.draw-toolbar') || e.target.closest('.draw-help') || e.target.closest('.chart-reset')) return;
    if (!this.cv.candles) return;
    const { x, y } = this._xy(e);
    if (!this._inPane(x, y)) return;
    const price = this.cv.series.coordinateToPrice(y);
    if (price == null || !(price > 0)) return;
    e.preventDefault();

    if (!this.ctxEl) {
      const box = document.createElement('div');
      box.className = 'chart-ctx';
      box.hidden = true;
      box.innerHTML =
        '<div class="cx-price"></div>' +
        `<button type="button" data-act="alert">${DRAW_ICONS.bell}<span>Оповещение на этой цене</span></button>` +
        `<button type="button" data-act="hray">${DRAW_ICONS.hray}<span>Горизонтальный луч здесь</span></button>` +
        `<button type="button" data-act="copy">${DRAW_ICONS.copy}<span>Скопировать цену</span></button>`;
      box.addEventListener('pointerdown', ev => ev.stopPropagation());
      box.addEventListener('click', ev => {
        const b = ev.target.closest('[data-act]');
        if (!b) return;
        const pr = this._ctxPrice;
        this._ctxClose();
        if (b.dataset.act === 'alert') this._sendAlert(pr);
        else if (b.dataset.act === 'hray') this._ctxAddRay(pr);
        else this._ctxCopy(pr);
      });
      this.cv.el.appendChild(box);
      this.ctxEl = box;
      // закрываем по клику мимо, по Esc и при прокрутке графика
      window.addEventListener('pointerdown', ev => {
        if (!this.ctxEl || this.ctxEl.hidden) return;
        // target не всегда элемент (бывает document) — closest() там нет
        const t = ev.target instanceof Element ? ev.target : null;
        if (!t || !t.closest('.chart-ctx')) this._ctxClose();
      }, true);
      this.cv.el.addEventListener('wheel', () => this._ctxClose(), { passive: true });
    }

    this._ctxPrice = price;
    const box = this.ctxEl;
    box.querySelector('.cx-price').textContent = this._fmt(price);
    box.hidden = false;
    // держим меню внутри графика, а не за краем
    const w = box.offsetWidth, h = box.offsetHeight;
    box.style.left = Math.max(2, Math.min(x, this.cv.el.clientWidth - w - 2)) + 'px';
    box.style.top = Math.max(2, Math.min(y, this.cv.el.clientHeight - h - 2)) + 'px';
  }

  _ctxClose() {
    if (this.ctxEl) this.ctxEl.hidden = true;
  }

  _ctxAddRay(price) {
    const cs = this.cv.candles;
    if (!cs || !cs.length) return;
    this._pushHistory();
    // луч начинаем от левого края видимой области — так он виден целиком
    const lr = this.cv.chart.timeScale().getVisibleLogicalRange();
    const t = this._l2t(lr ? Math.max(0, lr.from) : 0);
    this.items.push({ type: 'hray', t, price });
    this.sel = [this.items.length - 1];
    this._save();
    this.cv.requestDraw();
    this._toast('Уровень ' + this._fmt(price));
  }

  _ctxCopy(price) {
    const txt = this._fmt(price);
    const ok = () => this._toast('Скопировано: ' + txt);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(ok, () => this._ctxCopyFallback(txt, ok));
    } else {
      this._ctxCopyFallback(txt, ok);
    }
  }

  // запасной путь: в старых WebView Telegram нет clipboard API
  _ctxCopyFallback(txt, ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      ok();
    } catch (e) {
      this._toast('Не удалось скопировать');
    }
  }

  /* ---------- оповещения о пробое ---------- */

  _alertSymbol() { return this.symbol || (typeof state !== 'undefined' ? state.symbol : '') || ''; }

  _alertTf() {
    try { return TF_CFG[state.mode].label; } catch (e) { return ''; }
  }

  _lastPrice() {
    const cs = this.cv.candles;
    return cs && cs.length ? cs[cs.length - 1].c : 0;
  }

  /* Открыть бота со ссылкой, по которой он поставит оповещение. */
  _sendAlert(price) {
    const sym = this._alertSymbol();
    const last = this._lastPrice();
    if (!sym || !(price > 0) || !last) { this._toast('Нужна цена больше нуля'); return; }
    if (Math.abs(price - last) / last < 0.0001) { this._toast('Цена слишком близко к текущей'); return; }
    const dir = price > last ? 'up' : 'down';
    // округляем до точности графика: у уровня с графика цена сырая, с 16 знаками,
    // и на дешёвых монетах нагрузка не влезла бы в лимит Telegram в 64 символа
    const px = +Number(price).toFixed(this.cv.precision || 8);
    const raw = `${sym}|${px}|${dir}|${this._alertTf()}`;
    const payload = btoa(raw).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    if (payload.length > 64) { this._toast('Слишком длинная цена'); return; }
    const url = `https://t.me/${ALERT_BOT}?start=${payload}`;
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg && tg.openTelegramLink) tg.openTelegramLink(url);
    else window.open(url, '_blank', 'noopener');
  }

  /* Панель: цена вручную + быстрые кнопки по нарисованным горизонтальным уровням. */
  toggleAlerts(open) {
    if (!this.alertEl) {
      const box = document.createElement('div');
      box.className = 'draw-help draw-alerts';
      box.hidden = true;
      box.innerHTML =
        '<div class="dh-head"><b>Оповещение о пробое</b><button type="button" class="dh-x" title="Закрыть · Esc">×</button></div>' +
        '<div class="al-info"></div>' +
        '<div class="al-form"><input type="text" inputmode="decimal" class="al-price" placeholder="цена"><button type="button" class="al-go">Поставить</button></div>' +
        '<div class="al-dir"></div>' +
        '<div class="al-levels"></div>' +
        `<div class="al-note">Оповещение придёт в бота @${ALERT_BOT}. Сработает один раз, потом снимется. Все свои — команда /alerts в боте.</div>`;
      box.querySelector('.dh-x').addEventListener('click', () => this.toggleAlerts(false));
      const inp = box.querySelector('.al-price');
      inp.addEventListener('input', () => this._alertDir());
      inp.addEventListener('keydown', e => {
        e.stopPropagation();                       // Esc и буквы не должны дёргать инструменты
        if (e.key === 'Enter') this._sendAlert(parseFloat(inp.value.replace(',', '.')));
      });
      box.querySelector('.al-go').addEventListener('click', () => this._sendAlert(parseFloat(inp.value.replace(',', '.'))));
      box.querySelector('.al-levels').addEventListener('click', e => {
        const b = e.target.closest('[data-price]');
        if (b) this._sendAlert(parseFloat(b.dataset.price));
      });
      this.cv.el.appendChild(box);
      this.alertEl = box;
    }
    const show = open == null ? this.alertEl.hidden : open;
    this.alertEl.hidden = !show;
    if (this.bellBtn) this.bellBtn.classList.toggle('active', show);
    clearInterval(this._alertTimer);
    if (show) {
      this._alertFill();
      // цена живая: пока панель открыта, обновляем её и процент до уровня
      this._alertTimer = setInterval(() => {
        if (this.alertEl.hidden) { clearInterval(this._alertTimer); return; }
        this._alertFill();
      }, 1000);
    }
  }

  _alertFill() {
    const box = this.alertEl, last = this._lastPrice(), f = v => v.toFixed(this.cv.precision || 2);
    box.querySelector('.al-info').innerHTML =
      `<b>${this._alertSymbol() || '—'}</b> · ${this._alertTf()}<br>Цена сейчас: <b>${last ? f(last) : '—'}</b>`;
    const inp = box.querySelector('.al-price');
    if (!inp.value && last && document.activeElement !== inp) inp.value = f(last);
    this._alertDir();
    // уровни, которые уже нарисованы горизонтальным лучом на этой монете
    const lv = this.items.filter(i => i.type === 'hray').map(i => i.price).sort((a, b) => b - a);
    box.querySelector('.al-levels').innerHTML = lv.length
      ? '<div class="al-cap">Уровни с графика</div>' + lv.map(pr =>
          `<button type="button" class="al-lv" data-price="${pr}">${f(pr)} <i>${pr > last ? 'вверх ↑' : 'вниз ↓'}</i></button>`).join('')
      : '<div class="al-cap dim">Нарисуй горизонтальный луч (Alt+J) — уровень появится здесь кнопкой</div>';
  }

  _alertDir() {
    const box = this.alertEl, last = this._lastPrice();
    const v = parseFloat((box.querySelector('.al-price').value || '').replace(',', '.'));
    const el = box.querySelector('.al-dir');
    if (!(v > 0) || !last) { el.textContent = ''; return; }
    if (Math.abs(v - last) / last < 0.0001) {   // ровно текущая цена — направления нет
      el.textContent = 'Укажи цену выше или ниже текущей';
      return;
    }
    const up = v > last;
    const pct = Math.abs(v - last) / last * 100;
    el.innerHTML = `Сработает при пробое <b>${up ? 'вверх ↑' : 'вниз ↓'}</b> · ${pct.toFixed(2)}% от текущей`;
  }

  /* Шпаргалка: строится один раз при первом открытии. */
  toggleHelp(open) {
    if (!this.helpEl) {
      const box = document.createElement('div');
      box.className = 'draw-help';
      box.hidden = true;
      const keys = ks => ks.map(k => `<kbd>${k}</kbd>`).join('<i>+</i>');
      box.innerHTML =
        '<div class="dh-head"><b>Горячие клавиши</b><button type="button" class="dh-x" title="Закрыть · Esc">×</button></div>' +
        DRAW_HELP.map(([title, rows]) =>
          `<div class="dh-group">${title}</div>` +
          rows.map(([label, ks]) => `<div class="dh-row"><span>${label}</span><span class="dh-keys">${keys(ks)}</span></div>`).join('')
        ).join('');
      box.querySelector('.dh-x').addEventListener('click', () => this.toggleHelp(false));
      // клик внутри шпаргалки не должен доходить до графика
      box.addEventListener('pointerdown', e => e.stopPropagation());
      this.cv.el.appendChild(box);
      this.helpEl = box;
    }
    const show = open == null ? this.helpEl.hidden : open;
    this.helpEl.hidden = !show;
    if (this.helpBtn) this.helpBtn.classList.toggle('active', show);
  }

  clearAll() {
    if (!this.items.length) return;
    this._pushHistory();
    this.items = [];
    this.sel = [];
    this.ruler = null;
    this._save();
    this.cv.requestDraw();
    this._toast('Рисунки удалены · Cmd+Z вернёт');
  }

  // короткая подсказка в углу графика
  _toast(text) {
    clearTimeout(this._toastT);
    if (!this._toastEl) {
      this._toastEl = document.createElement('div');
      this._toastEl.className = 'draw-toast';
      this.cv.el.appendChild(this._toastEl);
    }
    this._toastEl.textContent = text;
    this._toastEl.classList.add('show');
    this._toastT = setTimeout(() => this._toastEl.classList.remove('show'), 1400);
  }

  /* ---------- история (Cmd+Z) ---------- */
  _pushHistory() {
    this._history.push(JSON.stringify(this.items));
    if (this._history.length > 50) this._history.shift();
  }

  undo() {
    if (!this._history.length) { this._toast('Отменять нечего'); return; }
    this.items = JSON.parse(this._history.pop());
    this.sel = [];
    this.draft = null;
    this._save();
    this.cv.requestDraw();
    this._toast('Отменено');
  }

  /* ---------- горячие клавиши (раскладка TradingView) ---------- */
  _hotkey(e) {
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) return;
    if (!this.cv.el.offsetParent) return;  // только видимая вкладка

    const code = e.code;  // раскладка-независимо: KeyT работает и на русской
    const mod = e.metaKey || e.ctrlKey;

    if (mod && code === 'KeyZ') { e.preventDefault(); this.undo(); return; }
    if (mod && e.altKey && code === 'KeyH') { e.preventDefault(); this.toggleHidden(); return; }
    if (mod && code === 'KeyC') { e.preventDefault(); this.copySel(); return; }
    if (mod && code === 'KeyV') { e.preventDefault(); this.pasteClip(); return; }

    // стрелки двигают выделенное; с Shift — крупным шагом
    const ARROW = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (ARROW[code] && this.sel.length && !mod) {
      e.preventDefault();
      const k = e.shiftKey ? 10 : 1;
      this._nudge(ARROW[code][0] * k, ARROW[code][1] * k);
      return;
    }

    if (e.altKey && !mod) {
      // Alt+J — горизонтальный луч, как в TradingView; Alt+H оставлен привычным алиасом
      const map = { KeyT: 'trend', KeyJ: 'hray', KeyH: 'hray', KeyA: 'path', KeyM: 'ruler' };
      if (map[code]) {
        e.preventDefault();
        this.setTool(map[code]);
        this._toast(this.btns[map[code]].title.split(' · ')[0]);
        return;
      }
      if (code === 'KeyS') { e.preventDefault(); this.toggleMagnet(); return; }
      if (code === 'Backspace' || code === 'Delete') { e.preventDefault(); this.clearAll(); return; }
      return;
    }

    if (code === 'Enter' && this.draft && this.draft.type === 'path') {
      e.preventDefault();
      this._finishPath();
      return;
    }
    if (code === 'Escape') {
      e.preventDefault();
      if (this.helpEl && !this.helpEl.hidden) { this.toggleHelp(false); return; }
      if (this.ctxEl && !this.ctxEl.hidden) { this._ctxClose(); return; }
      if (this.alertEl && !this.alertEl.hidden) { this.toggleAlerts(false); return; }
      if (this.draft) { this.draft = null; this.cv.requestDraw(); }
      else if (this.tool !== 'cursor') this.setTool('cursor');
      else if (this.sel.length) { this.sel = []; this.cv.requestDraw(); }
      return;
    }
    if ((code === 'Delete' || code === 'Backspace') && this.sel.length) {
      e.preventDefault();
      this._deleteSelected();
    }
  }

  setSymbol(sym) {
    if (sym === this.symbol) return;
    this.symbol = sym;
    // в панели оповещений осталась бы цена прошлой монеты — и оповещение
    // ушло бы на уровень, которого у новой монеты нет
    // Заполнять сразу нельзя: setSymbol зовётся ДО setData, свечи ещё от прошлой
    // монеты — в поле попала бы её цена. Просто чистим, а обновит таймер панели,
    // когда данные новой монеты уже приедут.
    if (this.alertEl) this.alertEl.querySelector('.al-price').value = '';
    this.items = this._load(sym);
    this.sel = [];
    this.draft = null;
    this.ruler = null;
    this._history = [];
    this.cv.requestDraw();
  }

  /* ---------- хранение ---------- */
  _load(sym) {
    try {
      const arr = (JSON.parse(localStorage.getItem(DRAW_STORE) || '{}')[sym]) || [];
      return arr
        // старые стрелки из двух точек — это та же траектория, не теряем их
        .map(i => (i.type === 'arrow' && i.p1 && i.p2) ? { type: 'path', pts: [i.p1, i.p2] } : i)
        .filter(i => DRAW_TYPES.includes(i.type) && (i.type !== 'path' || (i.pts && i.pts.length >= 2)));
    } catch (e) { return []; }
  }

  _save() {
    if (!this.symbol) return;
    try {
      const all = JSON.parse(localStorage.getItem(DRAW_STORE) || '{}');
      if (this.items.length) all[this.symbol] = this.items;
      else delete all[this.symbol];
      localStorage.setItem(DRAW_STORE, JSON.stringify(all));
    } catch (e) {}
    this._sync();
  }

  // отдаём свежие рисунки графикам других таймфреймов по той же монете
  _sync() {
    for (const o of DRAW_BUS) {
      if (o === this || o.symbol !== this.symbol) continue;
      o.items = JSON.parse(JSON.stringify(this.items));  // копия: перетаскивание не должно менять чужой список
      o._history = this._history.slice();
      o.sel = [];
      o.draft = null;
      o.drag = null;
      o.cv.requestDraw();
    }
  }

  _deleteSelected() {
    if (!this.sel.length) return;
    this._pushHistory();
    // с конца, иначе индексы съедут при первом же splice
    for (const i of [...this.sel].sort((a, b) => b - a)) this.items.splice(i, 1);
    this.sel = [];
    this._save();
    this.cv.requestDraw();
  }

  /* ---------- координаты и магнит ---------- */
  _iv() {
    const cs = this.cv.candles;
    return cs && cs.length > 1 ? cs[1].t - cs[0].t : 60;
  }

  _t2l(t) { return (t - this.cv.candles[0].t) / this._iv(); }
  _l2t(l) { return this.cv.candles[0].t + l * this._iv(); }

  _xy(e) {
    const r = this.cv.el.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  // привязка к ближайшей свече: время → центр свечи, цена → ближайший из OHLC
  _snap(pt) {
    const cs = this.cv.candles;
    // Cmd, зажатый при перетаскивании точки, временно переключает магнит
    const on = this._cmd ? !this.magnet : this.magnet;
    if (!on || !cs || !cs.length) return pt;
    if (pt.t > cs[cs.length - 1].t) return pt;  // справа от последней свечи магнититься не к чему
    let idx = Math.round((pt.t - cs[0].t) / this._iv());
    idx = Math.max(0, Math.min(cs.length - 1, idx));
    const c = cs[idx];
    let best = c.o;
    for (const v of [c.o, c.h, c.l, c.c]) {
      if (Math.abs(v - pt.price) < Math.abs(best - pt.price)) best = v;
    }
    return { t: c.t, price: best };
  }

  _pt(x, y, snap = true) {
    const l = this.cv.chart.timeScale().coordinateToLogical(x);
    const price = this.cv.series.coordinateToPrice(y);
    if (l == null || price == null) return null;
    let pt = { t: this._l2t(l), price };
    if (snap) pt = this._snap(pt);
    return pt;
  }

  _inPane(x, y) {
    return x >= 0 && x <= this.cv._paneW() && y >= 0 && y <= this.cv._paneH();
  }

  // Shift — ровная линия: строго горизонталь, вертикаль или 45° (как в TradingView).
  // Направление берём по движению КУРСОРА от точки нажатия (sx, sy), а строим от
  // якоря from: иначе магнит уводит якорь и «горизонтальное» ведение уходит в 45°.
  // Магнит при выравнивании не применяем — привязка к OHLC ломала бы ровность.
  _constrain(from, x, y, sx, sy) {
    const m = this._screen();
    const x0 = m.X(from.t), y0 = m.yOf(from.price);
    if (y0 == null) return this._pt(x, y);
    const dx = (sx != null ? x - sx : x - x0);
    const dy = (sy != null ? y - sy : y - y0);
    const adx = Math.abs(dx), ady = Math.abs(dy);
    const K = 2.414;  // tan(67.5°) — сектор «почти горизонтально/вертикально»
    if (adx > ady * K) {
      const pt = this._pt(x, y, false);
      return pt ? { t: pt.t, price: from.price } : null;   // ровная горизонталь
    }
    if (ady > adx * K) {
      const pt = this._pt(x, y, false);
      return pt ? { t: from.t, price: pt.price } : null;   // ровная вертикаль
    }
    const len = (adx + ady) / 2;                            // ровные 45° от якоря
    return this._pt(x0 + Math.sign(dx) * len, y0 + Math.sign(dy) * len, false);
  }

  _fmt(v) { return v.toFixed(this.cv.precision || 2); }

  /* ---------- события ---------- */
  _down(e) {
    if (e.target.closest('.draw-toolbar') || e.target.closest('.chart-reset')
        || e.target.closest('.draw-help')) return;   // .draw-alerts тоже имеет класс .draw-help
    if (!this.cv.candles) return;
    const { x, y } = this._xy(e);
    // клик колесом мыши удаляет рисунок под курсором (как в TradingView)
    if (e.button === 1) {
      if (!this._inPane(x, y)) return;
      const hit = this._hitTest(x, y);
      if (hit) {
        e.preventDefault();
        e.stopPropagation();
        this._pushHistory();
        this.items.splice(hit.i, 1);
        this.sel = [];
        this._save();
        this.cv.requestDraw();
      }
      return;
    }
    if (e.button > 0) return;
    if (!this._inPane(x, y)) return;
    const pt = this._pt(x, y);
    if (!pt) return;

    // Shift+протянуть при курсоре — быстрая линейка (как в TradingView)
    if (this.tool === 'cursor' && e.shiftKey) {
      this.ruler = null;
      this.draft = { type: 'ruler', p1: pt, p2: pt };
      e.preventDefault();
      e.stopPropagation();
      this.cv.requestDraw();
      return;
    }

    this.ruler = null;

    if (this.tool === 'cursor') {
      const hit = this._hitTest(x, y);
      const cmd = e.metaKey || e.ctrlKey;
      if (hit) {
        this._pushHistory();  // перемещение тоже отменяется по Cmd+Z
        // Cmd без движения = добавить в выделение, Cmd + тянуть = клонировать.
        // Что именно — решаем в _move/_up по первому движению.
        if (!cmd && !this._isSel(hit.i)) this.sel = [hit.i];
        this.drag = { i: hit.i, handle: hit.handle, x0: x, y0: y, cmd, moved: false, cloned: false,
                      orig: JSON.parse(JSON.stringify(this.items[hit.i])) };
        // тянем за тело при нескольких выделенных — двигаем всю группу
        if (hit.handle === 'body' && !cmd && this.sel.length > 1) {
          this.drag.origs = {};
          for (const i of this.sel) this.drag.origs[i] = JSON.parse(JSON.stringify(this.items[i]));
        }
        e.preventDefault();
        e.stopPropagation();
      } else if (this.sel.length) {
        this.sel = [];
      }
      this.cv.requestDraw();
      return;
    }

    e.preventDefault();
    e.stopPropagation();

    // Траектория: ставится точка за точкой. Последняя точка в draft.pts — «резинка»,
    // она едет за курсором. Клик по предыдущей точке (в т.ч. второй клик двойного)
    // заканчивает рисунок.
    if (this.tool === 'path') {
      if (!this.draft) {
        this.draft = { type: 'path', pts: [pt, { t: pt.t, price: pt.price }] };
      } else {
        const pts = this.draft.pts;
        const prev = pts[pts.length - 2];
        if (prev && this._nearPoint(prev, x, y)) this._finishPath();
        else { pts[pts.length - 1] = pt; pts.push({ t: pt.t, price: pt.price }); }
      }
      this.cv.requestDraw();
      return;
    }

    if (this.tool === 'hray') {
      this._pushHistory();
      this.items.push({ type: 'hray', t: pt.t, price: pt.price });
      this.sel = [this.items.length - 1];
      this._save();
      this.setTool('cursor');
    } else if (this.tool === 'trend' || this.tool === 'ruler') {
      // sx/sy — экранная точка нажатия: по ней считаем направление при Shift
      this.draft = { type: this.tool, p1: pt, p2: pt, sx: x, sy: y };
    }
    this.cv.requestDraw();
  }

  _move(e) {
    if (!this.cv.candles) return;
    const { x, y } = this._xy(e);
    const cx = Math.min(Math.max(x, 0), this.cv._paneW());
    const cy = Math.min(Math.max(y, 0), this.cv._paneH());
    const pt = this._pt(cx, cy);
    if (!pt) return;

    this._lastPt = pt;              // куда вставлять по Cmd+V
    this._cmd = e.metaKey || e.ctrlKey;

    if (this.drag) {
      if (!this.drag.moved && Math.hypot(x - this.drag.x0, y - this.drag.y0) > 3) {
        this.drag.moved = true;
        // Cmd + тянуть за тело — работаем с копией, оригинал остаётся на месте
        if (this.drag.cmd && this.drag.handle === 'body' && !this.drag.cloned) {
          const copy = JSON.parse(JSON.stringify(this.items[this.drag.i]));
          this.items.push(copy);
          this.drag.i = this.items.length - 1;
          this.drag.orig = JSON.parse(JSON.stringify(copy));
          this.drag.cloned = true;
          this.sel = [this.drag.i];
          this._toast('Копия рисунка');
        }
      }
      const it = this.items[this.drag.i];
      const o = this.drag.orig;
      const l0 = this.cv.chart.timeScale().coordinateToLogical(this.drag.x0);
      const l1 = this.cv.chart.timeScale().coordinateToLogical(x);
      let dt = (l0 != null && l1 != null) ? (l1 - l0) * this._iv() : 0;
      const p0 = this.cv.series.coordinateToPrice(this.drag.y0);
      let dp = p0 != null ? pt.price - p0 : 0;
      let dragPt = pt;
      if (e.shiftKey) {
        const hp = /^p(\d+)$/.exec(this.drag.handle || '');
        if (o.pts && hp) {
          // точка траектории — выравниваем относительно соседнего колена
          const k = +hp[1], anchor = o.pts[k - 1] || o.pts[k + 1];
          if (anchor) dragPt = this._constrain(anchor, cx, cy, this.drag.x0, this.drag.y0) || pt;
        } else if (this.drag.handle === 'p1' || this.drag.handle === 'p2') {
          // тянем конец линии — выравниваем относительно противоположной точки
          const anchor = this.drag.handle === 'p1' ? o.p2 : o.p1;
          if (anchor) dragPt = this._constrain(anchor, cx, cy, this.drag.x0, this.drag.y0) || pt;
        } else {
          // двигаем рисунок целиком — только по одной оси
          if (Math.abs(cx - this.drag.x0) >= Math.abs(cy - this.drag.y0)) dp = 0;
          else dt = 0;
        }
      }
      if (this.drag.origs) {
        for (const [i, oi] of Object.entries(this.drag.origs)) {
          if (this.items[i]) this._applyDrag(this.items[i], oi, 'body', dt, dp, dragPt);
        }
      } else {
        this._applyDrag(it, o, this.drag.handle, dt, dp, dragPt);
      }
      this.cv.requestDraw();
      return;
    }
    if (this.draft) {
      if (this.draft.type === 'path') {
        // тянем последнее колено от предыдущей точки; Shift — ровно
        const pts = this.draft.pts, prev = pts[pts.length - 2];
        pts[pts.length - 1] = (e.shiftKey && prev) ? (this._constrain(prev, cx, cy) || pt) : pt;
        this.cv.requestDraw();
        return;
      }
      // Shift во время рисования — ровная линия (горизонт/вертикаль/45°)
      this.draft.p2 = (e.shiftKey && this.draft.type !== 'ruler')
        ? (this._constrain(this.draft.p1, cx, cy, this.draft.sx, this.draft.sy) || pt)
        : pt;
      this.cv.requestDraw();
    }
  }

  // экранное расстояние до точки рисунка (для «клик по той же точке»)
  _nearPoint(p, x, y) {
    const m = this._screen();
    const px = m.X(p.t), py = m.yOf(p.price);
    return px != null && py != null && Math.hypot(x - px, y - py) < 9;
  }

  /* Закончить траекторию: последняя точка — «резинка» за курсором, её выбрасываем,
     подряд идущие дубли (второй клик двойного) схлопываем. */
  _finishPath() {
    const d = this.draft;
    if (!d || d.type !== 'path') return;
    this.draft = null;
    this._finishedAt = Date.now();   // чтобы двойной клик не сбросил вид графика
    const pts = [];
    for (const p of d.pts.slice(0, -1)) {
      const last = pts[pts.length - 1];
      if (last && last.t === p.t && last.price === p.price) continue;
      pts.push(p);
    }
    if (pts.length >= 2) {
      this._pushHistory();
      this.items.push({ type: 'path', pts });
      this.sel = [this.items.length - 1];
      this._save();
    }
    this.setTool('cursor');
    this.cv.requestDraw();
  }

  // двойной клик по графику возвращает вид к цене — пока рисуем, это мешает
  blocksDblClick() {
    return this.tool !== 'cursor' || !!this.draft || Date.now() - (this._finishedAt || 0) < 500;
  }

  _up() {
    if (this.drag) {
      const d = this.drag;
      this.drag = null;
      if (!d.moved) {
        this._history.pop();          // клик без перемещения историю не засоряет
        if (d.cmd) {                  // Cmd+клик — добавить/убрать из выделения
          const k = this.sel.indexOf(d.i);
          if (k >= 0) this.sel.splice(k, 1); else this.sel.push(d.i);
        } else {
          this.sel = [d.i];
        }
        this.cv.requestDraw();
        return;
      }
      this._save();
      return;
    }
    const d = this.draft;
    if (!d) return;
    if (d.type === 'path') return;  // траектория живёт до двойного клика / Enter, а не до отпускания
    const moved = Math.abs(d.p2.t - d.p1.t) > 0 || Math.abs(d.p2.price - d.p1.price) > 0;
    if (d.type === 'ruler') {
      if (moved) this.ruler = { p1: d.p1, p2: d.p2 };
      this.draft = null;
      this.setTool('cursor');
    } else if (moved) {
      this._pushHistory();
      this.items.push({ type: d.type, p1: d.p1, p2: d.p2 });
      this.sel = [this.items.length - 1];
      this._save();
      this.draft = null;
      this.setTool('cursor');
    } else {
      this.draft = null;
    }
    this.cv.requestDraw();
  }

  _applyDrag(it, o, handle, dt, dp, pt) {
    if (it.type === 'hray') {
      if (handle === 'p1') { it.t = pt.t; it.price = pt.price; }
      else { it.t = o.t + dt; it.price = o.price + dp; }
      return;
    }
    if (it.type === 'path') {
      const hp = /^p(\d+)$/.exec(handle || '');
      if (hp) it.pts[+hp[1]] = { t: pt.t, price: pt.price };
      else it.pts = o.pts.map(p => ({ t: p.t + dt, price: p.price + dp }));
      return;
    }
    // trend
    if (handle === 'p1') { it.p1 = { t: pt.t, price: pt.price }; }
    else if (handle === 'p2') { it.p2 = { t: pt.t, price: pt.price }; }
    else {
      it.p1 = { t: o.p1.t + dt, price: o.p1.price + dp };
      it.p2 = { t: o.p2.t + dt, price: o.p2.price + dp };
    }
  }

  /* ---------- поиск под курсором ---------- */
  _screen() {
    const xOf = this.cv._xMapper();
    const yOf = p => this.cv.series.priceToCoordinate(p);
    const X = t => (xOf ? xOf(this._t2l(t)) : 0);
    return { xOf, yOf, X };
  }

  _distSeg(x, y, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? ((x - x1) * dx + (y - y1) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(x - (x1 + t * dx), y - (y1 + t * dy));
  }

  _hitTest(x, y) {
    const m = this._screen();
    if (!m.xOf) return null;
    const paneW = this.cv._paneW();
    const R = 7;
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      if (it.type === 'hray') {
        const yy = m.yOf(it.price), x0 = m.X(it.t);
        if (yy == null) continue;
        if (Math.hypot(x - x0, y - yy) < R) return { i, handle: 'p1' };
        if (Math.abs(y - yy) < R && x >= x0 - R) return { i, handle: 'body' };
      } else if (it.type === 'path') {
        const pts = it.pts.map(p => [m.X(p.t), m.yOf(p.price)]);
        if (pts.some(p => p[1] == null)) continue;
        for (let k = 0; k < pts.length; k++) {
          if (Math.hypot(x - pts[k][0], y - pts[k][1]) < R) return { i, handle: 'p' + k };
        }
        for (let k = 1; k < pts.length; k++) {
          if (this._distSeg(x, y, pts[k - 1][0], pts[k - 1][1], pts[k][0], pts[k][1]) < R) return { i, handle: 'body' };
        }
      } else {
        const x1 = m.X(it.p1.t), y1 = m.yOf(it.p1.price);
        const x2 = m.X(it.p2.t), y2 = m.yOf(it.p2.price);
        if (y1 == null || y2 == null) continue;
        if (Math.hypot(x - x1, y - y1) < R) return { i, handle: 'p1' };
        if (Math.hypot(x - x2, y - y2) < R) return { i, handle: 'p2' };
        if (this._distSeg(x, y, x1, y1, x2, y2) < R) return { i, handle: 'body' };
      }
    }
    return null;
  }

  /* ---------- отрисовка ---------- */
  render() {
    const cvs = this.canvas, dpr = window.devicePixelRatio || 1;
    const w = this.cv.el.clientWidth, h = this.cv.el.clientHeight;
    cvs.width = w * dpr; cvs.height = h * dpr;
    cvs.style.width = w + 'px'; cvs.style.height = h + 'px';
    const ctx = cvs.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (!this.cv.candles || this.hidden) return;   // Cmd+Alt+H — разметка спрятана
    const m = this._screen();
    if (!m.xOf) return;
    const paneW = this.cv._paneW(), paneH = this.cv._paneH();

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, paneW, paneH);
    ctx.clip();
    ctx.font = '11px -apple-system, sans-serif';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    this.items.forEach((it, i) => this._renderItem(ctx, m, it, this._isSel(i), paneW));
    if (this.draft) {
      if (this.draft.type === 'ruler') this._renderRuler(ctx, m, this.draft);
      else this._renderItem(ctx, m, this.draft, false, paneW, true);
    }
    if (this.ruler) this._renderRuler(ctx, m, this.ruler);
    ctx.restore();
  }

  _renderItem(ctx, m, it, selected, paneW, isDraft = false) {
    if (it.type === 'hray') {
      const y = m.yOf(it.price), x0 = m.X(it.t);
      if (y == null) return;
      ctx.strokeStyle = '#e6edf3';
      ctx.lineWidth = selected ? 2 : 1.4;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(paneW, y); ctx.stroke();
      const label = this._fmt(it.price);
      ctx.fillStyle = '#e6edf3';
      ctx.fillText(label, paneW - ctx.measureText(label).width - 4, y - 4);
      if (selected) this._handles(ctx, [[x0, y]]);
      return;
    }

    if (it.type === 'path') {
      const pts = it.pts.map(p => [m.X(p.t), m.yOf(p.price)]);
      if (pts.some(p => p[1] == null)) return;
      ctx.strokeStyle = '#58a6ff';
      ctx.lineWidth = selected ? 2.4 : 1.7;
      if (isDraft) ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
      ctx.stroke();
      ctx.setLineDash([]);
      const n = pts.length;
      if (n >= 2) this._arrowHead(ctx, pts[n - 2], pts[n - 1]);
      if (selected) this._handles(ctx, pts);
      return;
    }

    const x1 = m.X(it.p1.t), y1 = m.yOf(it.p1.price);
    const x2 = m.X(it.p2.t), y2 = m.yOf(it.p2.price);
    if (y1 == null || y2 == null) return;
    ctx.strokeStyle = '#58a6ff';
    ctx.lineWidth = selected ? 2.4 : 1.7;
    if (isDraft) ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.setLineDash([]);

    if (selected) this._handles(ctx, [[x1, y1], [x2, y2]]);
  }

  // наконечник в конце последнего колена траектории
  _arrowHead(ctx, [x1, y1], [x2, y2]) {
    if (Math.hypot(x2 - x1, y2 - y1) < 4) return;
    const a = Math.atan2(y2 - y1, x2 - x1), L = 11, w = 0.42;
    ctx.fillStyle = '#58a6ff';
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - L * Math.cos(a - w), y2 - L * Math.sin(a - w));
    ctx.lineTo(x2 - L * Math.cos(a + w), y2 - L * Math.sin(a + w));
    ctx.closePath();
    ctx.fill();
  }

  _renderRuler(ctx, m, r) {
    const x1 = m.X(r.p1.t), y1 = m.yOf(r.p1.price);
    const x2 = m.X(r.p2.t), y2 = m.yOf(r.p2.price);
    if (y1 == null || y2 == null) return;
    const up = r.p2.price >= r.p1.price;
    const col = up ? 'rgba(38,166,154' : 'rgba(239,83,80';
    ctx.fillStyle = col + ',0.12)';
    ctx.fillRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
    ctx.strokeStyle = col + ',0.9)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const dPct = (r.p2.price - r.p1.price) / r.p1.price * 100;
    const bars = Math.round(Math.abs(r.p2.t - r.p1.t) / this._iv());
    const mins = bars * this._iv() / 60;
    const label = `${dPct > 0 ? '+' : ''}${dPct.toFixed(2)}% · ${this._fmt(Math.abs(r.p2.price - r.p1.price))} · ${bars} бар (${mins >= 60 ? (mins / 60).toFixed(1) + 'ч' : mins + 'м'})`;
    const tw = ctx.measureText(label).width;
    const bx = (x1 + x2) / 2 - tw / 2 - 5, by = Math.min(y1, y2) - 22;
    ctx.fillStyle = 'rgba(13,17,23,0.92)';
    ctx.fillRect(bx, by, tw + 10, 16);
    ctx.strokeStyle = col + ',0.9)';
    ctx.strokeRect(bx, by, tw + 10, 16);
    ctx.fillStyle = up ? '#26a69a' : '#ef5350';
    ctx.fillText(label, bx + 5, by + 11);
  }

  _handles(ctx, pts) {
    for (const [x, y] of pts) {
      ctx.fillStyle = '#0d1117';
      ctx.strokeStyle = '#58a6ff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
  }
}

</script>
<script>
/* SMC-скринер: рейтинг волатильных монет Bybit + авторазметка Smart Money на шести
   таймфреймах (1M / 5M / 15M / 1H / 4H / 1D), поиск и избранное, инструменты рисования. */
const $ = s => document.querySelector(s);

const state = {
  mode: 'm15',
  symbol: null,
  top: [],
  all: [],        // все USDT-тикеры Bybit — для поиска любой монеты, не только топа
  n: 10,
  minTurnover: 100e6,
  busy: false,
  queued: false,
  search: '',
};

/* Хранилище может быть запрещено (приватный режим, WebView) или содержать мусор.
   Без этих обёрток одно битое значение валило весь скрипт — экран оставался пустым. */
function lsGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw == null) return fallback;
    const v = JSON.parse(raw);
    return v == null ? fallback : v;
  } catch (e) { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

/* ---------- избранное (закреплённые монеты) ---------- */
const FAVS_KEY = 'smc_favs';
let FAVS = Array.isArray(lsGet(FAVS_KEY, [])) ? lsGet(FAVS_KEY, []) : [];
function saveFavs() { lsSet(FAVS_KEY, FAVS); }
function isFav(sym) { return FAVS.includes(sym); }
function toggleFav(sym) {
  const i = FAVS.indexOf(sym);
  if (i >= 0) FAVS.splice(i, 1); else FAVS.push(sym);
  saveFavs();
  renderSidebar();
}

const charts = {};

/* График создаём ТОЛЬКО когда его вкладка видима. Если создать его в скрытом
   контейнере (ширина 0), lightweight-charts схлопывает barSpacing в минимум и
   больше не восстанавливает — свечи «уезжают» вправо, а слева пустота. */
const CHART_SLOTS = {
  d1: ['tfD1', '#chartTfD1'], h4: ['tfH4', '#chartTfH4'], h1: ['tfH1', '#chartTfH1'],
  m15: ['tf15', '#chartTf15'], m5: ['tf5', '#chartTf5'], m1: ['tf1', '#chartTf1'],
};
function ensureChart(mode) {
  const [key, sel] = CHART_SLOTS[mode];
  const el = $(sel);
  let cv = charts[key];
  // Если масштаб всё же залип (barSpacing упал в минимум, слева пустота), вылечить
  // его через API графика нельзя — ни fitContent, ни setVisibleLogicalRange, ни
  // resize не действуют. Пересоздаём график целиком; рисунки лежат в localStorage.
  if (cv && el.clientWidth > 0 && cv.candles) {
    const ts = cv.chart.timeScale();
    const r = ts.getVisibleLogicalRange();
    if (ts.options().barSpacing <= 0.6 || (r && r.from < -50)) {
      try { cv.chart.remove(); } catch (e) {}
      el.innerHTML = '';
      cv = null;
    }
  }
  if (!cv) {
    cv = new ChartView(el);
    cv.drawTools = new DrawTools(cv);
    charts[key] = cv;
  }
  return cv;
}

const VIEWS = {
  d1: '#viewD1',
  h4: '#viewH4',
  h1: '#viewH1',
  m15: '#viewM15',
  m5: '#viewM5',
  m1: '#viewM1',
};

/* ---------- слои графика (что показывать) ---------- */
const LAYER_DEFS = [
  ['ob', 'Ордер-блоки'], ['fvg', 'FVG'], ['liq', '$$$ ликвидность'],
  ['struct', 'BOS/ЧоЧ'], ['sfp', 'SFP'], ['knives', 'Ножи'],
  ['bands', 'Премиум/дисконт'], ['extremes', 'Хай/лой'],
  ['walls', 'Стены стакана'], ['consol', 'Сжатие'],
];
const LAYERS = Object.assign(
  Object.fromEntries(LAYER_DEFS.map(([k]) => [k, true])),
  lsGet('smc_layers', {}),
);
function saveLayers() { lsSet('smc_layers', LAYERS); }

/* limit 1000 — максимум Bybit за запрос: 1M ≈ 16 ч истории, 15M ≈ 10 дней, 4H ≈ 5 месяцев,
   1D — всё, что есть у монеты. bands (премиум/дисконт) рисуем на старших ТФ, extremes
   (хай/лой окна) — на младших, где нужна ближняя цель. */
const TF_CFG = {
  m1: { interval: '1', minPerBar: 1, label: '1M', limit: 1000, bands: false, extremes: true, opts: { sweepLb: 120, knifeLb: 120, consolWin: 30, rangeLb: 200 } },
  m5: { interval: '5', minPerBar: 5, label: '5M', limit: 1000, bands: false, extremes: true, opts: { sweepLb: 120, knifeLb: 120, consolWin: 30, rangeLb: 200 } },
  m15: { interval: '15', minPerBar: 15, label: '15M', limit: 1000, bands: true, extremes: false, opts: { sweepLb: 120, knifeLb: 120, consolWin: 30, rangeLb: 160 } },
  h1: { interval: '60', minPerBar: 60, label: '1H', limit: 1000, bands: true, extremes: false, opts: { sweepLb: 120, knifeLb: 120, consolWin: 30, rangeLb: 160 } },
  h4: { interval: '240', minPerBar: 240, label: '4H', limit: 1000, bands: true, extremes: false, opts: { sweepLb: 120, knifeLb: 120, consolWin: 30, rangeLb: 160 } },
  d1: { interval: 'D', minPerBar: 1440, label: '1D', limit: 1000, bands: true, extremes: false, opts: { sweepLb: 90, knifeLb: 90, consolWin: 20, rangeLb: 120 } },
};
const TF_ORDER = ['m1', 'm5', 'm15', 'h1', 'h4', 'd1'];  // порядок в выпадашке, от младшего к старшему

/* ---------- форматирование ---------- */
const fmtUsd = v => v >= 1e9 ? '$' + (v / 1e9).toFixed(1) + 'B'
  : v >= 1e6 ? '$' + (v / 1e6).toFixed(0) + 'M'
  : '$' + (v / 1e3).toFixed(0) + 'K';
const fmtPct = v => (v > 0 ? '+' : '') + v.toFixed(1) + '%';
const fmtFund = v => (v > 0 ? '+' : '') + (v * 100).toFixed(3) + '%';
const fmtPrice = (v) => {
  const p = v < 0.0001 ? 8 : v < 0.001 ? 7 : v < 0.01 ? 6 : v < 0.1 ? 5 : v < 1 ? 4 : v < 100 ? 3 : 2;
  return v.toFixed(p);
};

/* ---------- кэш свечей ---------- */
const klineCache = new Map();
const KLINE_CACHE_MAX = 40;  // ~40 рядов по 1000 свечей: дальше выкидываем самые старые
async function klines(sym, interval, limit) {
  const key = `${sym}:${interval}`;
  const hit = klineCache.get(key);
  if (hit && Date.now() - hit.ts < 25000 && hit.data.length >= limit * 0.9) return hit.data;
  const data = await API.klines(sym, interval, limit);
  klineCache.delete(key);          // переставляем в конец: Map помнит порядок вставки
  klineCache.set(key, { ts: Date.now(), data });
  while (klineCache.size > KLINE_CACHE_MAX) klineCache.delete(klineCache.keys().next().value);
  return data;
}

function fundingOf(sym) {
  const r = state.top.find(r => r.sym === sym);
  return r ? r.fr : null;
}

/* ---------- сборка разметки ---------- */
function buildDrawings(cs, A, { bands = false, maxOB = 3, maxFVG = 4, maxEvents = 6, extremes = false } = {}) {
  const zones = [], hlines = [], slines = [], bandsArr = [];
  const last = cs.length - 1;
  if (!LAYERS.ob) maxOB = 0;
  if (!LAYERS.fvg) maxFVG = 0;
  if (!LAYERS.struct) maxEvents = 0;
  if (!LAYERS.bands) bands = false;
  if (!LAYERS.extremes) extremes = false;

  if (bands && A.range) {
    bandsArr.push({ top: A.range.high, bottom: A.range.eq, fill: 'rgba(239,83,80,0.045)', label: 'премиум', color: 'rgba(239,83,80,0.55)' });
    bandsArr.push({ top: A.range.eq, bottom: A.range.low, fill: 'rgba(38,166,154,0.045)', label: 'дисконт', color: 'rgba(38,166,154,0.55)' });
    hlines.push({ price: A.range.eq, color: 'rgba(139,148,158,0.5)', dash: [4, 4], label: 'EQ 50%' });
  }

  for (const lv of (LAYERS.liq ? A.levels : [])) {
    if (lv.swept && last - lv.sweptAt > 25) continue;
    const col = lv.swept ? 'rgba(139,148,158,0.55)' : '#e3b341';
    hlines.push({
      price: lv.price, i0: lv.i0, color: col, dash: [6, 4], width: lv.swept ? 1 : 1.5,
      label: `$$$ ${lv.kind}×${lv.count}${lv.swept ? ' (снята)' : ''}`,
    });
  }

  let bullN = 0, bearN = 0;
  for (let k = A.obs.length - 1; k >= 0; k--) {
    const ob = A.obs[k];
    if (ob.dir === 1 && bullN >= maxOB) continue;
    if (ob.dir === -1 && bearN >= maxOB) continue;
    if (ob.dir === 1) bullN++; else bearN++;
    const base = ob.dir === 1 ? '38,166,154' : '239,83,80';
    let label = 'OB' + (ob.touched ? ' (тест)' : '');
    if (bands && A.range && !ob.touched) {
      if (ob.dir === 1 && ob.top <= A.range.eq) label = 'OB ★ POI';
      if (ob.dir === -1 && ob.bottom >= A.range.eq) label = 'OB ★ POI';
    }
    zones.push({
      i0: ob.i, i1: null, top: ob.top, bottom: ob.bottom,
      fill: `rgba(${base},${ob.touched ? 0.07 : 0.14})`,
      stroke: `rgba(${base},${ob.touched ? 0.35 : 0.7})`,
      label,
    });
  }

  for (const f of (maxFVG > 0 ? A.fvgs.slice(-maxFVG) : [])) {  // slice(-0) вернул бы ВЕСЬ массив — слой не выключался бы
    zones.push({
      i0: f.i, i1: null, top: f.curTop, bottom: f.curBottom,
      fill: 'rgba(171,130,255,0.10)', stroke: 'rgba(171,130,255,0.45)', dash: [3, 3], label: 'FVG',
    });
  }

  for (const ev of (maxEvents > 0 ? A.events.slice(-maxEvents) : [])) {  // slice(-0) вернул бы ВЕСЬ массив — BOS/ЧоЧ не выключались бы
    const col = ev.type === 'CHOCH' ? '#f0883e' : (ev.dir === 1 ? '#26a69a' : '#ef5350');
    slines.push({ i0: ev.from, i1: ev.at, price: ev.level, color: col, dir: ev.dir, label: ev.type === 'CHOCH' ? 'ЧоЧ' : 'BOS' });
  }

  if (A.consol && LAYERS.consol) {
    zones.push({
      i0: A.consol.i0, i1: null, top: A.consol.top, bottom: A.consol.bottom,
      fill: 'rgba(88,166,255,0.06)', stroke: 'rgba(88,166,255,0.55)', dash: [5, 3], label: 'сжатие',
    });
  }

  if (extremes) {
    const from = Math.max(0, cs.length - 200);
    let hiI = from, loI = from;
    for (let i = from; i < cs.length; i++) {
      if (cs[i].h > cs[hiI].h) hiI = i;
      if (cs[i].l < cs[loI].l) loI = i;
    }
    hlines.push({ price: cs[hiI].h, i0: hiI, color: 'rgba(239,83,80,0.75)', label: 'хай' });
    hlines.push({ price: cs[loI].l, i0: loI, color: 'rgba(38,166,154,0.75)', label: 'лой' });
  }

  return { zones, hlines, slines, bands: bandsArr };
}

function wallLines(m) {
  if (!m || !m.walls || !LAYERS.walls) return [];
  return m.walls.slice(0, 4).map(w => ({
    price: w.price,
    color: w.side === 'bid' ? 'rgba(63,185,80,0.85)' : 'rgba(248,81,73,0.85)',
    width: 2,
    label: `СТЕНА ${w.side === 'bid' ? 'БИД' : 'АСК'} ${fmtUsd(w.usd)}`,
  }));
}

function buildMarkers(cs, A, { sweeps = true, knives = true } = {}) {
  const ms = [];
  if (!LAYERS.sfp) sweeps = false;
  if (!LAYERS.knives) knives = false;
  if (sweeps) for (const s of A.sweeps) {
    ms.push({
      time: cs[s.i].t,
      position: s.dir === 1 ? 'belowBar' : 'aboveBar',
      color: '#e3b341',
      shape: s.dir === 1 ? 'arrowUp' : 'arrowDown',
      text: 'SFP',
    });
  }
  if (knives) for (const k of A.knives) {
    ms.push({
      time: cs[k.i].t,
      position: k.dir === -1 ? 'belowBar' : 'aboveBar',
      color: '#58a6ff', shape: 'circle', text: 'нож',
    });
  }
  return ms;
}

/* ---------- сводки ---------- */
function trendWord(A) {
  const ev = A.events[A.events.length - 1];
  if (!ev) return 'структура не определена';
  const dir = A.trend === 1 ? 'бычья' : 'медвежья';
  return `${dir} (посл. ${ev.type === 'CHOCH' ? 'ЧоЧ' : 'BOS'}${ev.dir === 1 ? '↑' : '↓'})`;
}

function nearestLiquidity(A, price) {
  let below = null, above = null;
  for (const lv of A.levels) {
    if (lv.swept) continue;
    if (lv.kind === 'EQL' && lv.price < price && (!below || lv.price > below.price)) below = lv;
    if (lv.kind === 'EQH' && lv.price > price && (!above || lv.price < above.price)) above = lv;
  }
  return { below, above };
}

function metricItems(m) {
  const items = [];
  if (!m) return items;
  if (m.funding != null) items.push(`<b>фандинг:</b> ${fmtFund(m.funding)} ${m.funding > 0.0003 ? '(толпа в лонгах)' : m.funding < -0.0003 ? '(толпа в шортах)' : ''}`);
  if (m.oiChg != null) items.push(`<b>OI за 4ч:</b> ${fmtPct(m.oiChg)}`);
  if (m.ls != null) items.push(`<b>L/S:</b> ${m.ls.toFixed(2)}`);
  return items;
}

// возраст события: минуты на младших ТФ, часы и дни — на старших
function agoText(mins) {
  if (mins < 90) return `${mins} мин`;
  if (mins < 2880) return `${(mins / 60).toFixed(mins < 600 ? 1 : 0)} ч`;
  return `${Math.round(mins / 1440)} дн`;
}
// «0 мин назад» на 4H читалось странно — событие на незакрытой свече называем прямо
const agoPhrase = mins => mins <= 0 ? 'на текущей свече' : agoText(mins) + ' назад';

function tfSummary(cs, A, label, minPerBar, m) {
  const price = cs[cs.length - 1].c;
  const last = cs.length - 1;
  const items = [];
  items.push(`<b>${label} структура:</b> ${trendWord(A)}`);
  if (A.range && A.range.high > A.range.low) {
    // цена может уйти ЗА диапазон — раньше в этом случае печатался отрицательный процент
    const pct = Math.round((price - A.range.low) / (A.range.high - A.range.low) * 100);
    if (pct < 0) items.push('<b>диапазон:</b> цена ниже — лой пробит');
    else if (pct > 100) items.push('<b>диапазон:</b> цена выше — хай пробит');
    else items.push(`<b>в диапазоне:</b> ${pct}% — ${pct >= 50 ? 'премиум' : 'дисконт'}`);
  }
  if (A.consol) items.push('<b>сжатие:</b> да — жди пробой');
  const lq = nearestLiquidity(A, price);
  if (lq.below) items.push(`<b>ликвидность за лоями:</b> ${fmtPrice(lq.below.price)} (EQL×${lq.below.count})`);
  if (lq.above) items.push(`<b>ликвидность за хаями:</b> ${fmtPrice(lq.above.price)} (EQH×${lq.above.count})`);
  // «свежо» — последние 45 минут, но не меньше трёх баров: на 4H и 1D минуты бессмысленны
  const fresh = Math.max(3, Math.round(45 / minPerBar));
  const sw = A.sweeps[A.sweeps.length - 1];
  if (sw && last - sw.i <= fresh) {
    items.push(`<b>снятие (SFP):</b> ${agoPhrase((last - sw.i) * minPerBar)}, ${sw.dir === 1 ? 'лой снят → смотрим лонг' : 'хай снят → смотрим шорт'}`);
  }
  const kn = A.knives[A.knives.length - 1];
  if (kn && last - kn.i <= fresh) items.push(`<b>нож:</b> ${agoPhrase((last - kn.i) * minPerBar)} (${kn.dir === -1 ? 'вниз' : 'вверх'})`);
  return items.concat(metricItems(m));
}

/* ---------- рейтинг ---------- */
async function loadRanking() {
  try {
    const list = await API.tickers();
    const rows = list
      .filter(t => t.symbol.endsWith('USDT'))
      .map(t => ({
        sym: t.symbol,
        last: +t.lastPrice,
        chg: +t.price24hPcnt * 100,
        vol: (+t.highPrice24h - +t.lowPrice24h) / (+t.lastPrice || 1) * 100,
        to: +t.turnover24h,
        fr: +t.fundingRate,
        oiv: +t.openInterestValue,
        chips: null,
      }))
      .filter(r => r.vol > 0 && isFinite(r.vol));
    rows.forEach(r => { r.score = r.vol * Math.log10(Math.max(10, r.to)); });
    rows.sort((a, b) => b.score - a.score);
    // все монеты держим для поиска и избранного, в топ идут только «живые» по обороту
    const prev = new Map(state.all.map(r => [r.sym, r.chips]));
    rows.forEach(r => { r.chips = prev.has(r.sym) ? prev.get(r.sym) : null; });
    state.all = rows;
    state.top = rows.filter(r => r.to >= state.minTurnover).slice(0, state.n);
    renderSidebar();
    setStatus('обновлено ' + new Date().toLocaleTimeString());
    if (!state.symbol && state.top.length) selectSymbol(state.top[0].sym);
    fetchBadges();
  } catch (e) {
    setStatus('ошибка: ' + e.message, true);
  }
}

// какие монеты показываем в сайдбаре: избранные сверху, затем топ по волатильности,
// а при поиске — совпадения по тикеру среди всех монет биржи
function sidebarRows() {
  const q = state.search.trim().toUpperCase();
  if (q) {
    return state.all
      .filter(r => r.sym.replace('USDT', '').includes(q))
      .slice(0, 30);
  }
  const byS = new Map(state.all.map(r => [r.sym, r]));
  const favs = FAVS.map(s => byS.get(s)).filter(Boolean);
  const rest = state.top.filter(r => !isFav(r.sym));
  return favs.concat(rest);
}

async function fetchBadges() {
  for (const r of sidebarRows().slice(0, 12)) {
    try {
      const cs = await klines(r.sym, '1', 240);
      const A = SMC.analyze(cs, { sweepLb: 60, knifeLb: 60, consolWin: 30 });
      const last = cs.length - 1;
      const chips = [];
      const eqls = A.levels.filter(l => !l.swept && l.kind === 'EQL');
      const eqhs = A.levels.filter(l => !l.swept && l.kind === 'EQH');
      if (eqls.length) chips.push({ t: `EQL×${eqls.reduce((s, l) => s + l.count, 0)}`, c: 'gold' });
      if (eqhs.length) chips.push({ t: `EQH×${eqhs.reduce((s, l) => s + l.count, 0)}`, c: 'gold' });
      if (A.consol) chips.push({ t: 'сжатие', c: 'blue' });
      const sw = A.sweeps[A.sweeps.length - 1];
      if (sw && last - sw.i <= 30) chips.push({ t: 'SFP', c: 'gold' });
      const kn = A.knives[A.knives.length - 1];
      if (kn && last - kn.i <= 30) chips.push({ t: 'нож', c: 'blue' });
      const ev = A.events[A.events.length - 1];
      if (ev && ev.type === 'CHOCH' && last - ev.at <= 40) chips.push({ t: 'ЧоЧ', c: 'orange' });
      r.chips = chips;
    } catch (e) { r.chips = []; }
  }
  renderSidebar();
}

function renderSidebar() {
  const el = $('#sidebar');
  const rows = sidebarRows();
  if (!rows.length) {
    const msg = state.search ? 'Ничего не найдено'
      : state.all.length ? 'Под фильтр оборота никто не подходит — снизь порог'
      : 'Загрузка…';
    el.innerHTML = `<div class="sb-empty">${msg}</div>`;
    return;
  }
  el.innerHTML = rows.map((r, idx) => `
    <div class="coin ${r.sym === state.symbol ? 'active' : ''}" data-sym="${r.sym}">
      <div class="row1">
        <span class="rank">${isFav(r.sym) ? '★' : idx + 1}</span>
        <b>${r.sym.replace('USDT', '')}</b>
        <span class="fav ${isFav(r.sym) ? 'on' : ''}" data-fav="${r.sym}"
              title="${isFav(r.sym) ? 'Убрать из избранного' : 'В избранное'}">${isFav(r.sym) ? '★' : '☆'}</span>
        <span class="chg ${r.chg >= 0 ? 'pos' : 'neg'}">${fmtPct(r.chg)}</span>
      </div>
      <div class="row2">
        <span>${fmtPrice(r.last)}</span>
        <span title="Оборот за 24ч">${fmtUsd(r.to)}</span>
        <span title="Диапазон за 24ч">Δ${r.vol.toFixed(1)}%</span>
      </div>
      <div class="row2 row3">
        <span class="${Math.abs(r.fr) >= 0.0003 ? 'hot' : ''}" title="Ставка фандинга">F ${fmtFund(r.fr)}</span>
        <span title="Открытый интерес">OI ${fmtUsd(r.oiv)}</span>
      </div>
      <div class="chips">${(r.chips || []).map(c => `<span class="chip ${c.c}">${c.t}</span>`).join('')}
        ${r.chips === null ? '<span class="chip dim">анализ…</span>' : ''}
        ${r.chips && !r.chips.length ? '<span class="chip dim">чисто</span>' : ''}
      </div>
    </div>`).join('');
}

/* ---------- графики ---------- */
function selectSymbol(sym) {
  state.symbol = sym;
  renderSidebar();
  $('#curSym').textContent = sym;
  $('#lnkTV').href = `https://www.tradingview.com/chart/?symbol=BYBIT%3A${sym}.P`;
  // ref=VLEK85 — реферальный код Даниила: если Bybit учтёт переход по торговой
  // странице, партнёрка засчитается; отдельная ссылка на регистрацию — в подвале
  $('#lnkBB').href = `https://www.bybit.com/trade/usdt/${sym}?ref=VLEK85`;
  refreshCharts(true);
}

/* Живая цена: раз в 2 секунды тянем только последние свечи и дописываем их в
   график. Разметку и метрики не трогаем — они пересчитываются раз в 25 секунд. */
async function liveTick() {
  if (!state.symbol || state.busy || state.liveBusy) return;
  const mode = state.mode, sym = state.symbol;
  const cv = charts[(CHART_SLOTS[mode] || [])[0]];
  if (!cv || !cv.candles || !cv.el.clientWidth || document.hidden) return;
  state.liveBusy = true;
  try {
    // мимо кэша свечей: он отдаёт данные 25-секундной давности
    const cs = await API.klines(sym, TF_CFG[mode].interval, 3);
    if (state.symbol === sym && state.mode === mode) cv.pushLast(cs);
  } catch (e) {
    /* сеть моргнула — следующий тик через 2 секунды */
  } finally {
    state.liveBusy = false;
  }
}

async function refreshCharts(fit = false) {
  if (!state.symbol) return;
  if (state.busy) { state.queued = state.queued || fit; return; }
  state.busy = true;
  const sym = state.symbol, mode = state.mode;
  const stale = () => {
    if (state.symbol === sym && state.mode === mode) return false;
    state.queued = true;
    return true;
  };
  try {
    {
      const cfg = TF_CFG[mode];
      const cs = await klines(sym, cfg.interval, cfg.limit);
      if (stale()) return;
      if (!cs.length) throw new Error('нет свечей по этой монете на ' + cfg.label);
      const A = SMC.analyze(cs, cfg.opts);
      const price = cs[cs.length - 1].c;
      let m = null;
      try { m = await Metrics.get(sym, fundingOf(sym)); } catch (e) {}
      const cv = ensureChart(mode);
      if (cv.drawTools) cv.drawTools.setSymbol(sym);
      // на дневках время на оси не нужно — только даты
      cv.chart.applyOptions({ timeScale: { timeVisible: cfg.minPerBar < 1440 } });
      cv.setPrecision(price);
      cv.setTitle(`${sym} · ${cfg.label}`);
      cv.setData(cs, { fit });
      const d = buildDrawings(cs, A, { bands: cfg.bands, maxOB: 3, maxFVG: 4, maxEvents: 6, extremes: cfg.extremes });
      d.hlines.push(...wallLines(m));
      cv.setDrawings(d);
      cv.setMarkers(buildMarkers(cs, A));
      renderSummary(tfSummary(cs, A, cfg.label, cfg.minPerBar, m));
    }
    setStatus('обновлено ' + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus('ошибка: ' + e.message, true);
  } finally {
    state.busy = false;
    if (state.queued) {
      const f = state.queued === true;
      state.queued = false;
      refreshCharts(f);
    }
  }
}

function renderSummary(items) {
  $('#summary').innerHTML = items.map(i => `<span class="sumitem">${i}</span>`).join('');
}

function renderLayerBar() {
  $('#layerBar').innerHTML = 'Слои: ' + LAYER_DEFS.map(([k, label]) =>
    `<span class="lchip ${LAYERS[k] ? 'on' : ''}" data-layer="${k}">${label}</span>`).join('');
}

function setStatus(msg, err = false) {
  const el = $('#status');
  el.textContent = msg;
  el.classList.toggle('err', err);
}

/* ---------- инициализация ---------- */
function setMode(mode) {
  state.mode = mode;
  $('#curTf').textContent = TF_CFG[mode].label;
  tfMenu(false);
  for (const [m, sel] of Object.entries(VIEWS)) $(sel).hidden = m !== mode;
  refreshCharts(true);
}

/* Выбор таймфрейма одной кнопкой (как в TradingView): клик — список, клик по пункту —
   переключение. open = true/false принудительно, без аргумента — переключить. */
function tfMenu(open) {
  const menu = $('#tfMenu');
  const show = open == null ? menu.hidden : open;
  if (show) {
    menu.innerHTML = TF_ORDER
      .map(k => `<button type="button" data-mode="${k}"${k === state.mode ? ' class="active"' : ''}>${TF_CFG[k].label}</button>`)
      .join('');
  }
  menu.hidden = !show;
  $('#btnTf').setAttribute('aria-expanded', show ? 'true' : 'false');
}

document.addEventListener('DOMContentLoaded', () => {
  ensureChart(state.mode);  // остальные ТФ создадутся при первом открытии их вкладки

  $('#sidebar').addEventListener('click', e => {
    const star = e.target.closest('[data-fav]');
    if (star) { e.stopPropagation(); toggleFav(star.dataset.fav); return; }
    const c = e.target.closest('.coin');
    if (c) selectSymbol(c.dataset.sym);
  });

  // поиск монеты: фильтрует список, Enter открывает первую найденную
  const inpSearch = $('#inpSearch');
  inpSearch.addEventListener('input', () => {
    state.search = inpSearch.value;
    renderSidebar();
  });
  inpSearch.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const first = sidebarRows()[0];
      if (first) { selectSymbol(first.sym); inpSearch.blur(); }
    } else if (e.key === 'Escape') {
      inpSearch.value = '';
      state.search = '';
      renderSidebar();
      inpSearch.blur();
    }
  });

  $('#curTf').textContent = TF_CFG[state.mode].label;
  $('#btnTf').addEventListener('click', e => { e.stopPropagation(); tfMenu(); });
  $('#tfMenu').addEventListener('click', e => {
    const b = e.target.closest('[data-mode]');
    if (b) setMode(b.dataset.mode);
  });
  // на фазе перехвата: инструменты рисования гасят всплытие, обычный click сюда не дойдёт
  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('.tfpick')) tfMenu(false);
  }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') tfMenu(false); });
  $('#selN').addEventListener('change', e => { state.n = +e.target.value; loadRanking(); });
  $('#selTo').addEventListener('change', e => { state.minTurnover = +e.target.value; loadRanking(); });
  $('#btnRefresh').addEventListener('click', () => { loadRanking(); refreshCharts(false); });

  renderLayerBar();
  $('#layerBar').addEventListener('click', e => {
    const chip = e.target.closest('.lchip');
    if (!chip) return;
    LAYERS[chip.dataset.layer] = !LAYERS[chip.dataset.layer];
    saveLayers();
    renderLayerBar();
    refreshCharts(false);
  });

  loadRanking();
  // страховка: вёрстка устоялась — проверяем масштаб графика и чиним, если залип
  setTimeout(() => refreshCharts(true), 900);
  setInterval(() => refreshCharts(false), 25000);
  setInterval(liveTick, 2000);
  setInterval(loadRanking, 90000);
});
