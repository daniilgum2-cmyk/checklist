    const num = v => typeof v === 'number' && isFinite(v);
    const pt = p => p && num(p.t) && num(p.price);
    const k = DRAW_KIND[i.type];
    if (i.type === 'text') return num(i.t) && num(i.price) && typeof i.txt === 'string' && i.txt !== '';
    if (k === 'one') return num(i.t) && num(i.price);
    if (k === 'time') return num(i.t);
    if (k === 'many') return Array.isArray(i.pts) && i.pts.length >= 2 && i.pts.every(pt);
    return pt(i.p1) && pt(i.p2);
  }

  // новый рисунок: геометрия + стиль (заводской или из настроек инструмента)
  _newItem(type, geom) { return Object.assign({ type }, geom, drawStyleFor(type)); }

  _save() {
    this._ctxClose();   // открытое меню рисунка после любой правки устарело
    if (!this.symbol) return;
    try {
      const all = JSON.parse(localStorage.getItem(DRAW_STORE) || '{}');
      if (this.items.length) all[this.symbol] = this.items;
      else delete all[this.symbol];
      localStorage.setItem(DRAW_STORE, JSON.stringify(all));
    } catch (e) {}
    this._sync();
  }

  // отдаём свежие рисунки графикам других таймфреймов по той же монете
  _sync() {
    for (const o of DRAW_BUS) {
      if (o === this || o.symbol !== this.symbol) continue;
      o.items = JSON.parse(JSON.stringify(this.items));  // копия: перетаскивание не должно менять чужой список
      o._history = this._history.slice();
      o.sel = [];
      o.draft = null;
      o.drag = null;
      o.cv.requestDraw();
    }
  }

  _deleteSelected() {
    if (!this.sel.length) return;
    this._pushHistory();
    // с конца, иначе индексы съедут при первом же splice
    for (const i of [...this.sel].sort((a, b) => b - a)) this.items.splice(i, 1);
    this.sel = [];
    this._save();
    this.cv.requestDraw();
  }

  /* ---------- координаты и магнит ---------- */
  _iv() {
    const cs = this.cv.candles;
    return cs && cs.length > 1 ? cs[1].t - cs[0].t : 60;
  }

  _t2l(t) { return (t - this.cv.candles[0].t) / this._iv(); }
  _l2t(l) { return this.cv.candles[0].t + l * this._iv(); }

  _xy(e) {
    const r = this.cv.el.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  // привязка к ближайшей свече: время → центр свечи, цена → ближайший из OHLC
  _snap(pt) {
    const cs = this.cv.candles;
    // Cmd, зажатый при перетаскивании точки, временно переключает магнит
    const on = this._cmd ? !this.magnet : this.magnet;
    if (!on || !cs || !cs.length) return pt;
    if (pt.t > cs[cs.length - 1].t) return pt;  // справа от последней свечи магнититься не к чему
    let idx = Math.round((pt.t - cs[0].t) / this._iv());
    idx = Math.max(0, Math.min(cs.length - 1, idx));
    const c = cs[idx];
    let best = c.o;
    for (const v of [c.o, c.h, c.l, c.c]) {
      if (Math.abs(v - pt.price) < Math.abs(best - pt.price)) best = v;
    }
    return { t: c.t, price: best };
  }

  _pt(x, y, snap = true) {
    const l = this.cv.chart.timeScale().coordinateToLogical(x);
    const price = this.cv.series.coordinateToPrice(y);
    if (l == null || price == null) return null;
    let pt = { t: this._l2t(l), price };
    if (snap) pt = this._snap(pt);
    return pt;
  }

  _inPane(x, y) {
    return x >= 0 && x <= this.cv._paneW() && y >= 0 && y <= this.cv._paneH();
  }

  // Shift — ровная линия: строго горизонталь, вертикаль или 45° (как в TradingView).
  // Направление берём по движению КУРСОРА от точки нажатия (sx, sy), а строим от
  // якоря from: иначе магнит уводит якорь и «горизонтальное» ведение уходит в 45°.
  // Магнит при выравнивании не применяем — привязка к OHLC ломала бы ровность.
  _constrain(from, x, y, sx, sy) {
    const m = this._screen();
    const x0 = m.X(from.t), y0 = m.yOf(from.price);
    if (y0 == null) return this._pt(x, y);
    const dx = (sx != null ? x - sx : x - x0);
    const dy = (sy != null ? y - sy : y - y0);
    const adx = Math.abs(dx), ady = Math.abs(dy);
    const K = 2.414;  // tan(67.5°) — сектор «почти горизонтально/вертикально»
    if (adx > ady * K) {
      const pt = this._pt(x, y, false);
      return pt ? { t: pt.t, price: from.price } : null;   // ровная горизонталь
    }
    if (ady > adx * K) {
      const pt = this._pt(x, y, false);
      return pt ? { t: from.t, price: pt.price } : null;   // ровная вертикаль
    }
    const len = (adx + ady) / 2;                            // ровные 45° от якоря
    return this._pt(x0 + Math.sign(dx) * len, y0 + Math.sign(dy) * len, false);
  }

  _fmt(v) { return v.toFixed(this.cv.precision || 2); }

  /* ---------- события ---------- */
  _down(e) {
    if (e.target.closest(DRAW_UI_SEL)) return;   // панель, шпаргалка, меню, плавающая панель рисунка
    if (!this.cv.candles) return;
    // Ctrl+клик на маке система превращает в правый клик: пусть отработает меню (contextmenu)
    if (IS_MAC && e.ctrlKey && e.button === 0) return;
    const { x, y } = this._xy(e);
    this._textClose(true);   // печатали текст и кликнули мимо - фиксируем
    this._formClose();
    // клик колесом мыши удаляет рисунок под курсором (как в TradingView)
    if (e.button === 1) {
      if (!this._inPane(x, y)) return;
      const hit = this._hitTest(x, y);
      if (hit) {
        e.preventDefault();
        e.stopPropagation();
        this._pushHistory();
        this.items.splice(hit.i, 1);
        this.sel = [];
        this._save();
        this.cv.requestDraw();
      }
      return;
    }
    if (e.button > 0) return;
    if (!this._inPane(x, y)) return;
    const pt = this._pt(x, y);
    if (!pt) return;

    // Shift+протянуть при курсоре — быстрая линейка (как в TradingView)
    if (this.tool === 'cursor' && e.shiftKey) {
      this.ruler = null;
      this.draft = { type: 'ruler', p1: pt, p2: pt, sx: x, sy: y, down: true, quick: true };
      e.preventDefault();
      e.stopPropagation();
      this.cv.requestDraw();
      return;
    }

    this.ruler = null;

    if (this.tool === 'cursor') {
      const hit = this._hitTest(x, y);
      const cmd = modKey(e);
      if (hit) {
        this._pushHistory();  // перемещение тоже отменяется по Cmd+Z
        // Cmd без движения = добавить в выделение, Cmd + тянуть = клонировать.
        // Что именно — решаем в _move/_up по первому движению.
        if (!cmd && !this._isSel(hit.i)) this.sel = [hit.i];
        this.drag = { i: hit.i, handle: hit.handle, x0: x, y0: y, cmd, moved: false, cloned: false,
                      orig: JSON.parse(JSON.stringify(this.items[hit.i])) };
        // тянем за тело при нескольких выделенных — двигаем всю группу
        if (hit.handle === 'body' && !cmd && this.sel.length > 1) {
          this.drag.origs = {};
          for (const i of this.sel) this.drag.origs[i] = JSON.parse(JSON.stringify(this.items[i]));
        }
        e.preventDefault();
        e.stopPropagation();
      } else if (this.sel.length) {
        this.sel = [];
      }
      this.cv.requestDraw();
      return;
    }

    e.preventDefault();
    e.stopPropagation();
    if (this.hidden) this.toggleHidden(false);   // рисуем поверх спрятанного - разметка возвращается (как в TradingView)

    const T = this.tool, d = this.draft;

    // «клик — клик»: первый клик поставил начало, этот - конец
    if (d && d.sticky && d.type === T) {
      d.p2 = this._endPoint(d, e, x, y, pt);
      this._commitDraft();
      return;
    }

    // Траектория: ставится точка за точкой. Последняя точка в draft.pts — «резинка»,
    // она едет за курсором. Клик по предыдущей точке (в т.ч. второй клик двойного)
    // заканчивает рисунок.
    if (T === 'path') {
      if (!d) {
        this.draft = { type: 'path', pts: [pt, { t: pt.t, price: pt.price }] };
      } else {
        const pts = d.pts;
        const prev = pts[pts.length - 2];
        if (prev && this._nearPoint(prev, x, y)) this._finishPath();
        else { pts[pts.length - 1] = pt; pts.push({ t: pt.t, price: pt.price }); }
      }
      this.cv.requestDraw();
      return;
    }

    if (T === 'hray' || T === 'vline' || T === 'cross') {
      this._pushHistory();
      this.items.push(this._newItem(T, T === 'vline' ? { t: pt.t } : { t: pt.t, price: pt.price }));
      this.sel = [this.items.length - 1];
      this._save();
      this.setTool('cursor');
    } else if (T === 'text') {
      this._textPending({ t: pt.t, price: pt.price });
    } else if (T === 'brush') {
      // кисть рисует по курсору как есть, без магнита
      this.draft = { type: 'brush', pts: [this._pt(x, y, false) || pt], lx: x, ly: y, down: true };
    } else {
      // sx/sy — экранная точка нажатия: по ней считаем направление при Shift
      this.draft = { type: T, p1: pt, p2: pt, sx: x, sy: y, down: true };
    }
    this.cv.requestDraw();
  }

  // конец рисунка под курсором; Shift: ровная линия (горизонт/вертикаль/45°) или квадрат/круг
  _endPoint(d, e, cx, cy, pt) {
    if (!e.shiftKey || d.type === 'ruler') return pt;
    if (d.type === 'rect' || d.type === 'ellipse') return this._square(d.p1, cx, cy) || pt;
    return this._constrain(d.p1, cx, cy, d.sx, d.sy) || pt;
  }

  // точка так, чтобы прямоугольник от from получился квадратом (по ЭКРАННЫМ пикселям)
  _square(from, x, y) {
    const m = this._screen();
    const x0 = m.X(from.t), y0 = m.yOf(from.price);
    if (y0 == null) return null;
    const dx = x - x0, dy = y - y0, s = Math.max(Math.abs(dx), Math.abs(dy));
    return this._pt(x0 + (dx < 0 ? -s : s), y0 + (dy < 0 ? -s : s), false);
  }

  _move(e) {
    if (!this.cv.candles) return;
    const { x, y } = this._xy(e);
    const cx = Math.min(Math.max(x, 0), this.cv._paneW());
    const cy = Math.min(Math.max(y, 0), this.cv._paneH());
    const pt = this._pt(cx, cy);
    if (!pt) return;

    this._lastPt = pt;              // куда вставлять по Cmd+V
    this._cmd = modKey(e);

    if (this.drag) {
      if (!this.drag.moved && Math.hypot(x - this.drag.x0, y - this.drag.y0) > 3) {
        this.drag.moved = true;
        // Cmd + тянуть за тело — работаем с копией, оригинал остаётся на месте
        if (this.drag.cmd && this.drag.handle === 'body' && !this.drag.cloned) {
          const copy = JSON.parse(JSON.stringify(this.items[this.drag.i]));
          this.items.push(copy);
          this.drag.i = this.items.length - 1;
          this.drag.orig = JSON.parse(JSON.stringify(copy));
          this.drag.cloned = true;
          this.sel = [this.drag.i];
          this._toast('Копия рисунка');
        }
      }
      const it = this.items[this.drag.i];
      const o = this.drag.orig;
      const h = this.drag.handle;
      const l0 = this.cv.chart.timeScale().coordinateToLogical(this.drag.x0);
      const l1 = this.cv.chart.timeScale().coordinateToLogical(x);
      let dt = (l0 != null && l1 != null) ? (l1 - l0) * this._iv() : 0;
      const p0 = this.cv.series.coordinateToPrice(this.drag.y0);
      let dp = p0 != null ? pt.price - p0 : 0;
      let dragPt = pt;
      if (e.shiftKey) {
        const hp = /^p(\d+)$/.exec(h || '');
        const two = DRAW_KIND[it.type] === 'two';
        if (it.type === 'path' && hp) {
          // точка траектории — выравниваем относительно соседнего колена
          const k = +hp[1], anchor = o.pts[k - 1] || o.pts[k + 1];
          if (anchor) dragPt = this._constrain(anchor, cx, cy, this.drag.x0, this.drag.y0) || pt;
        } else if (two && (h === 'p1' || h === 'p2')) {
          // тянем конец линии — выравниваем относительно противоположной точки; у рамок - квадрат
          const anchor = h === 'p1' ? o.p2 : o.p1;
          if (it.type === 'rect' || it.type === 'ellipse') dragPt = this._square(anchor, cx, cy) || pt;
          else dragPt = this._constrain(anchor, cx, cy, this.drag.x0, this.drag.y0) || pt;
        } else if (!(two && (h === 'p3' || h === 'p4'))) {
          // двигаем рисунок целиком — только по одной оси
          if (Math.abs(cx - this.drag.x0) >= Math.abs(cy - this.drag.y0)) dp = 0;
          else dt = 0;
        }
      }
      if (this.drag.origs) {
        for (const [i, oi] of Object.entries(this.drag.origs)) {
          if (this.items[i]) this._applyDrag(this.items[i], oi, 'body', dt, dp, dragPt);
        }
      } else {
        this._applyDrag(it, o, h, dt, dp, dragPt);
      }
      this.cv.requestDraw();
      return;
    }
    const d = this.draft;
    if (d) {
      if (d.type === 'path') {
        // тянем последнее колено от предыдущей точки; Shift — ровно
        const pts = d.pts, prev = pts[pts.length - 2];
        pts[pts.length - 1] = (e.shiftKey && prev) ? (this._constrain(prev, cx, cy) || pt) : pt;
      } else if (d.type === 'brush') {
        // точки чаще 2.5 пикселей не нужны: линия и так гладкая, а рисунок не раздувается
        if (Math.hypot(cx - d.lx, cy - d.ly) >= 2.5) {
          const p = this._pt(cx, cy, false);
          if (p) { d.pts.push(p); d.lx = cx; d.ly = cy; }
        }
      } else {
        d.p2 = this._endPoint(d, e, cx, cy, pt);
      }
      this.cv.requestDraw();
    }
  }

  // экранное расстояние до точки рисунка (для «клик по той же точке»)
  _nearPoint(p, x, y) {
    const m = this._screen();
    const px = m.X(p.t), py = m.yOf(p.price);
    return px != null && py != null && Math.hypot(x - px, y - py) < 9;
  }

  /* Закончить траекторию: последняя точка — «резинка» за курсором, её выбрасываем,
     подряд идущие дубли (второй клик двойного) схлопываем. */
  _finishPath() {
    const d = this.draft;
    if (!d || d.type !== 'path') return;
    this.draft = null;
    this._finishedAt = Date.now();   // чтобы двойной клик не сбросил вид графика
    const pts = [];
    for (const p of d.pts.slice(0, -1)) {
      const last = pts[pts.length - 1];
      if (last && last.t === p.t && last.price === p.price) continue;
      pts.push(p);
    }
    if (pts.length >= 2) {
      this._pushHistory();
      this.items.push(this._newItem('path', { pts }));
      this.sel = [this.items.length - 1];
      this._save();
    }
    this.setTool('cursor');
    this.cv.requestDraw();
  }

  // Рисунок из двух точек готов: кладём в список (линейка - отдельно, она не сохраняется)
  _commitDraft() {
    const d = this.draft;
    if (!d) return;
    this.draft = null;
    this._finishedAt = Date.now();
    const moved = d.p2.t !== d.p1.t || d.p2.price !== d.p1.price;
    if (d.type === 'ruler') {
      if (moved) this.ruler = { p1: d.p1, p2: d.p2 };
    } else if (moved) {
      this._pushHistory();
      this.items.push(this._newItem(d.type, { p1: d.p1, p2: d.p2 }));
      this.sel = [this.items.length - 1];
      this._save();
    } else {
      this.cv.requestDraw();
      return;
    }
    this.setTool('cursor');
  }

  // Кисть: отпустили - штрих готов. Одиночное касание без движения ничего не рисует.
  _finishBrush() {
    const d = this.draft;
    if (!d || d.type !== 'brush') return;
    this.draft = null;
    if (d.pts.length < 2) { this.cv.requestDraw(); return; }
    this._finishedAt = Date.now();
    this._pushHistory();
    this.items.push(this._newItem('brush', { pts: d.pts }));
    this.sel = [this.items.length - 1];
    this._save();
    this.setTool('cursor');
  }

  // двойной клик по графику возвращает вид к цене — пока рисуем, это мешает
  blocksDblClick() {
    return this.tool !== 'cursor' || !!this.draft || Date.now() - (this._finishedAt || 0) < 500;
  }

  _up(e) {
    if (this.drag) {
      const d = this.drag;
      this.drag = null;
      if (!d.moved) {
        this._history.pop();          // клик без перемещения историю не засоряет
        if (d.cmd) {                  // Cmd+клик — добавить/убрать из выделения
          const k = this.sel.indexOf(d.i);
          if (k >= 0) this.sel.splice(k, 1); else this.sel.push(d.i);
        } else {
          this.sel = [d.i];
        }
        this.cv.requestDraw();
        return;
      }
      this._save();
      this.cv.requestDraw();
      return;
    }
    const d = this.draft;
    if (!d) return;
    if (d.type === 'path') return;  // траектория живёт до двойного клика / Enter, а не до отпускания
    if (d.type === 'brush') { this._finishBrush(); return; }
    if (!d.down) return;            // «клик — клик»: начало уже стоит, ждём второго клика
    const p = e && e.clientX != null ? this._xy(e) : { x: d.sx, y: d.sy };
    if (Math.hypot(p.x - d.sx, p.y - d.sy) > 4) { this._commitDraft(); return; }   // протянули - готово
    if (d.quick) { this.draft = null; this.cv.requestDraw(); return; }             // быстрая линейка без протяжки - отмена
    // клик без протягивания: остаёмся «в рисунке», конец поставит следующий клик
    d.down = false;
    d.sticky = true;
    this.cv.requestDraw();
  }

  _applyDrag(it, o, handle, dt, dp, pt) {
    const k = DRAW_KIND[it.type];
    if (k === 'one') {
      if (handle === 'p1') { it.t = pt.t; it.price = pt.price; }
      else { it.t = o.t + dt; it.price = o.price + dp; }
      return;
    }
    if (k === 'time') { it.t = o.t + dt; return; }
    if (k === 'many') {
      const hp = it.type === 'path' && /^p(\d+)$/.exec(handle || '');
      if (hp) it.pts[+hp[1]] = { t: pt.t, price: pt.price };
      else it.pts = o.pts.map(p => ({ t: p.t + dt, price: p.price + dp }));
      return;
    }
    // две точки: линия, рамка, эллипс, фибо. p3/p4 - два других угла рамки
    if (handle === 'p1') { it.p1 = { t: pt.t, price: pt.price }; }
    else if (handle === 'p2') { it.p2 = { t: pt.t, price: pt.price }; }
    else if (handle === 'p3') {   // угол (p1.t, p2.price)
      it.p1 = { t: pt.t, price: o.p1.price };
      it.p2 = { t: o.p2.t, price: pt.price };
    } else if (handle === 'p4') { // угол (p2.t, p1.price)
      it.p2 = { t: pt.t, price: o.p2.price };
      it.p1 = { t: o.p1.t, price: pt.price };
    } else {
      it.p1 = { t: o.p1.t + dt, price: o.p1.price + dp };
      it.p2 = { t: o.p2.t + dt, price: o.p2.price + dp };
    }
  }

  /* ---------- поиск под курсором ---------- */
  _screen() {
    const xOf = this.cv._xMapper();
    const yOf = p => this.cv.series.priceToCoordinate(p);
    const X = t => (xOf ? xOf(this._t2l(t)) : 0);
    return { xOf, yOf, X };
  }

  _distSeg(x, y, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? ((x - x1) * dx + (y - y1) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(x - (x1 + t * dx), y - (y1 + t * dy));
  }

  _hitTest(x, y) {
    const m = this._screen();
    if (!m.xOf) return null;
    const paneW = this.cv._paneW();
    // ручки уже выделенного рисунка важнее тела других: иначе рамка поверх закрыла бы их
    for (const i of this.sel) {
      const it = this.items[i];
      const h = it && this._hitOne(it, i, x, y, m, paneW);
      if (h && h.handle !== 'body') return h;
    }
    for (let i = this.items.length - 1; i >= 0; i--) {
      const h = this._hitOne(this.items[i], i, x, y, m, paneW);
      if (h) return h;
    }
    return null;
  }

  // попадание курсора в один рисунок: { i, handle } (handle: p1, p2, p3, p4, pN, body) или null
  _hitOne(it, i, x, y, m, paneW) {
    const R = 7;
    const near = (px, py) => Math.hypot(x - px, y - py) < R;
    switch (it.type) {
      case 'hray': {
        const yy = m.yOf(it.price), x0 = m.X(it.t);
        if (yy == null) return null;
        if (near(x0, yy)) return { i, handle: 'p1' };
        return (Math.abs(y - yy) < R && x >= x0 - R) ? { i, handle: 'body' } : null;
      }
      case 'vline':
        return Math.abs(x - m.X(it.t)) < R ? { i, handle: 'body' } : null;
      case 'cross': {
        const x0 = m.X(it.t), yy = m.yOf(it.price);
        if (yy == null) return null;
        if (near(x0, yy)) return { i, handle: 'p1' };
        return (Math.abs(x - x0) < R || Math.abs(y - yy) < R) ? { i, handle: 'body' } : null;
      }
      case 'text': {
        const b = this._textBox(it, m);
        return b && x >= b.l - 4 && x <= b.r + 4 && y >= b.t - 4 && y <= b.b + 4 ? { i, handle: 'body' } : null;
      }
      case 'path': {
        const pts = it.pts.map(p => [m.X(p.t), m.yOf(p.price)]);
        if (pts.some(p => p[1] == null)) return null;
        for (let k = 0; k < pts.length; k++) if (near(pts[k][0], pts[k][1])) return { i, handle: 'p' + k };
        for (let k = 1; k < pts.length; k++) {
          if (this._distSeg(x, y, pts[k - 1][0], pts[k - 1][1], pts[k][0], pts[k][1]) < R) return { i, handle: 'body' };
        }
        return null;
      }
      case 'brush': {
        const pts = it.pts.map(p => [m.X(p.t), m.yOf(p.price)]);
        if (pts.some(p => p[1] == null)) return null;
        for (let k = 1; k < pts.length; k++) {
          if (this._distSeg(x, y, pts[k - 1][0], pts[k - 1][1], pts[k][0], pts[k][1]) < R - 1) return { i, handle: 'body' };
        }
        return null;
      }
      case 'rect':
      case 'ellipse': {
        const x1 = m.X(it.p1.t), y1 = m.yOf(it.p1.price), x2 = m.X(it.p2.t), y2 = m.yOf(it.p2.price);
        if (y1 == null || y2 == null) return null;
        const corners = { p1: [x1, y1], p2: [x2, y2], p3: [x1, y2], p4: [x2, y1] };
        for (const [h, [px, py]] of Object.entries(corners)) if (near(px, py)) return { i, handle: h };
        const l = Math.min(x1, x2), r = Math.max(x1, x2), t = Math.min(y1, y2), b = Math.max(y1, y2);
        // внутри пустой рамки график можно тянуть; внутри залитой или выделенной - берём рисунок
        const inside = this._isSel(i) || (it.fa || 0) > 0;
        if (it.type === 'rect') {
          if (x < l - R || x > r + R || y < t - R || y > b + R) return null;
          if (Math.abs(x - l) < R || Math.abs(x - r) < R || Math.abs(y - t) < R || Math.abs(y - b) < R) return { i, handle: 'body' };
          return inside && x > l && x < r && y > t && y < b ? { i, handle: 'body' } : null;
        }
        const rx = Math.max((r - l) / 2, 1), ry = Math.max((b - t) / 2, 1);
        const d = Math.hypot((x - (l + r) / 2) / rx, (y - (t + b) / 2) / ry);
        if (Math.abs(d - 1) * Math.min(rx, ry) < R) return { i, handle: 'body' };
        return inside && d < 1 ? { i, handle: 'body' } : null;
      }
      case 'fib': {
        const x1 = m.X(it.p1.t), y1 = m.yOf(it.p1.price), x2 = m.X(it.p2.t), y2 = m.yOf(it.p2.price);
        if (y1 == null || y2 == null) return null;
        if (near(x1, y1)) return { i, handle: 'p1' };
        if (near(x2, y2)) return { i, handle: 'p2' };
        if (this._distSeg(x, y, x1, y1, x2, y2) < R) return { i, handle: 'body' };
        const xl = Math.min(x1, x2) - R, xr = (it.ext ? paneW : Math.max(x1, x2)) + R;
        if (x >= xl && x <= xr) {
          for (const lv of this._fibLevels(it, m)) if (lv.y != null && Math.abs(y - lv.y) < R) return { i, handle: 'body' };
        }
        return null;
      }
      default: {  // trend
        const x1 = m.X(it.p1.t), y1 = m.yOf(it.p1.price);
        const x2 = m.X(it.p2.t), y2 = m.yOf(it.p2.price);
        if (y1 == null || y2 == null) return null;
        if (near(x1, y1)) return { i, handle: 'p1' };
        if (near(x2, y2)) return { i, handle: 'p2' };
        return this._distSeg(x, y, x1, y1, x2, y2) < R ? { i, handle: 'body' } : null;
      }
    }
  }

  // уровни фибо, по возрастанию: { lv, price, y }. 0 - конец рисунка (p2), 1 - начало (p1), как в TradingView
  _fibLevels(it, m) {
    const lv = (it.lv && it.lv.length ? it.lv : FIB_LEVELS0).slice().sort((a, b) => a - b);
    const a = it.p2.price, b = it.p1.price;
    return lv.map(l => { const price = a + (b - a) * l; return { lv: l, price, y: m ? m.yOf(price) : null }; });
  }

  // рамка текста на экране; якорь (t, price) - левый край и середина по высоте
  _textBox(it, m) {
    const x0 = m.X(it.t), yy = m.yOf(it.price);
    if (yy == null) return null;
    const sz = it.sz || TEXT_SIZES[1], cx = drawMeasure();
    cx.font = drawFont(sz);
    return { l: x0, r: x0 + cx.measureText(it.txt).width, t: yy - sz * 0.65, b: yy + sz * 0.65 };
  }

  /* ---------- отрисовка ---------- */
  render() {
    const cvs = this.canvas, dpr = window.devicePixelRatio || 1;
    const w = this.cv.el.clientWidth, h = this.cv.el.clientHeight;
    cvs.width = w * dpr; cvs.height = h * dpr;
    cvs.style.width = w + 'px'; cvs.style.height = h + 'px';
    const ctx = cvs.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    this._paint(ctx, false);
    this._panelUpdate();   // плавающая панель едет за рисунком при прокрутке и масштабе
  }

  /* Рисует рисунки пользователя в ctx (CSS-пиксели, transform выставляет вызывающий).
     clean = для снимка: без ручек выделения и без недорисованной фигуры. */
  _paint(ctx, clean) {
    if (!this.cv.candles || this.hidden) return;   // Cmd+Option+H — разметка спрятана
    const m = this._screen();
    if (!m.xOf) return;
    const paneW = this.cv._paneW(), paneH = this.cv._paneH();

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, paneW, paneH);
    ctx.clip();
    ctx.font = '11px -apple-system, sans-serif';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    this.items.forEach((it, i) => this._renderItem(ctx, m, it, !clean && this._isSel(i), paneW));
    const d = this.draft;
    if (d && !clean) {
      if (d.type === 'ruler') this._renderRuler(ctx, m, d);
      else this._renderItem(ctx, m, Object.assign(drawStyleFor(d.type), d), false, paneW, true);
    }
    if (this.ruler) this._renderRuler(ctx, m, this.ruler);
    ctx.restore();
  }

  _renderItem(ctx, m, it, selected, paneW, isDraft = false) {
    ctx.save();
    try {
      const col = dCol(it);
      ctx.strokeStyle = col;
      ctx.fillStyle = col;
      ctx.lineWidth = dWid(it) + (selected ? 0.8 : 0);
      ctx.setLineDash(isDraft ? [4, 3] : []);
      this._drawItem(ctx, m, it, selected, paneW, col);
    } finally {
      ctx.restore();
    }
  }

  // подпись с тёмным ободком: читается и на свечах, и на снимке
  _halo(ctx, text, x, y, col) {
    ctx.save();
    ctx.setLineDash([]);
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(13,17,23,0.85)';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = col;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  // пунктирная рамка вокруг выделенного рисунка без «ручек» по контуру (кисть, текст, эллипс)
  _selBox(ctx, l, t, r, b) {
    ctx.save();
    ctx.setLineDash([3, 3]);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(88,166,255,0.9)';
    ctx.strokeRect(l - 3, t - 3, r - l + 6, b - t + 6);
    ctx.restore();
  }

  _drawItem(ctx, m, it, selected, paneW, col) {
    const paneH = this.cv._paneH();
    const T = it.type;

    if (T === 'hray') {
      const y = m.yOf(it.price), x0 = m.X(it.t);
      if (y == null) return;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(paneW, y); ctx.stroke();
      const label = this._fmt(it.price);
      ctx.fillText(label, paneW - ctx.measureText(label).width - 4, y - 4);
      if (selected) this._handles(ctx, [[x0, y]], col);
      return;
    }

    if (T === 'vline') {
      const x0 = m.X(it.t);
      ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0, paneH); ctx.stroke();
      return;
    }

    if (T === 'cross') {
      const x0 = m.X(it.t), y = m.yOf(it.price);
      if (y == null) return;
      ctx.beginPath();
      ctx.moveTo(x0, 0); ctx.lineTo(x0, paneH);
      ctx.moveTo(0, y); ctx.lineTo(paneW, y);
      ctx.stroke();
      if (selected) this._handles(ctx, [[x0, y]], col);
      return;
    }

    if (T === 'text') {
      const b = this._textBox(it, m);
      if (!b) return;
      ctx.font = drawFont(it.sz || TEXT_SIZES[1]);
      ctx.textBaseline = 'middle';
      this._halo(ctx, it.txt, b.l, (b.t + b.b) / 2, col);
      if (selected) this._selBox(ctx, b.l, b.t, b.r, b.b);
      return;
    }

    if (T === 'path' || T === 'brush') {
      const pts = it.pts.map(p => [m.X(p.t), m.yOf(p.price)]);
      if (pts.some(p => p[1] == null)) return;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      if (T === 'brush' && pts.length > 2) {
        // сглаживаем: кривые через середины отрезков
        for (let k = 1; k < pts.length - 1; k++) {
          ctx.quadraticCurveTo(pts[k][0], pts[k][1], (pts[k][0] + pts[k + 1][0]) / 2, (pts[k][1] + pts[k + 1][1]) / 2);
        }
        ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
      } else {
        for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
      }
      ctx.stroke();
      if (T === 'path') {
        const n = pts.length;
        if (n >= 2) this._arrowHead(ctx, pts[n - 2], pts[n - 1], col);
        if (selected) this._handles(ctx, pts, col);
      } else if (selected) {
        const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
        this._selBox(ctx, Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys));
      }
      return;
    }

    const x1 = m.X(it.p1.t), y1 = m.yOf(it.p1.price);
    const x2 = m.X(it.p2.t), y2 = m.yOf(it.p2.price);
    if (y1 == null || y2 == null) return;
    const l = Math.min(x1, x2), r = Math.max(x1, x2), t = Math.min(y1, y2), b = Math.max(y1, y2);

    if (T === 'rect' || T === 'ellipse') {
      ctx.beginPath();
      if (T === 'rect') ctx.rect(l, t, r - l, b - t);
      else ctx.ellipse((l + r) / 2, (t + b) / 2, Math.max((r - l) / 2, 0.5), Math.max((b - t) / 2, 0.5), 0, 0, Math.PI * 2);
      if ((it.fa || 0) > 0) { ctx.fillStyle = drawRgba(col, it.fa); ctx.fill(); }
      ctx.stroke();
      if (selected) {
        if (T === 'ellipse') this._selBox(ctx, l, t, r, b);
        this._handles(ctx, [[x1, y1], [x2, y2], [x1, y2], [x2, y1]], col);
      }
      return;
    }

    if (T === 'fib') {
      const xr = it.ext ? paneW : r;
      const lv = this._fibLevels(it, m);
      // заливка полосами между соседними уровнями (через одну плотнее)
      for (let k = 1; k < lv.length; k++) {
        if (lv[k].y == null || lv[k - 1].y == null) continue;
        ctx.fillStyle = drawRgba(col, k % 2 ? 0.05 : 0.11);
        ctx.fillRect(l, Math.min(lv[k - 1].y, lv[k].y), xr - l, Math.abs(lv[k].y - lv[k - 1].y));
      }
      ctx.textBaseline = 'alphabetic';
      for (const p of lv) {
        if (p.y == null) continue;
        ctx.beginPath(); ctx.moveTo(l, p.y); ctx.lineTo(xr, p.y); ctx.stroke();
        if (it.lab) this._halo(ctx, `${p.lv} (${this._fmt(p.price)})`, Math.max(l, 0) + 4, p.y - 3, col);
      }
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.restore();
      if (selected) this._handles(ctx, [[x1, y1], [x2, y2]], col);
      return;
    }

    // trend
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    if (selected) this._handles(ctx, [[x1, y1], [x2, y2]], col);
  }

  // наконечник в конце последнего колена траектории
  _arrowHead(ctx, [x1, y1], [x2, y2], col) {
    if (Math.hypot(x2 - x1, y2 - y1) < 4) return;
    const a = Math.atan2(y2 - y1, x2 - x1), L = 11, w = 0.42;
    ctx.fillStyle = col || '#58a6ff';
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - L * Math.cos(a - w), y2 - L * Math.sin(a - w));
    ctx.lineTo(x2 - L * Math.cos(a + w), y2 - L * Math.sin(a + w));
    ctx.closePath();
    ctx.fill();
  }

  _renderRuler(ctx, m, r) {
    const x1 = m.X(r.p1.t), y1 = m.yOf(r.p1.price);
    const x2 = m.X(r.p2.t), y2 = m.yOf(r.p2.price);
    if (y1 == null || y2 == null) return;
    const up = r.p2.price >= r.p1.price;
    const col = up ? 'rgba(38,166,154' : 'rgba(239,83,80';
    ctx.fillStyle = col + ',0.12)';
    ctx.fillRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
    ctx.strokeStyle = col + ',0.9)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    // что показывать в подписи, выбирается долгим нажатием на значок линейки
    const o = Object.assign({ pct: true, px: true, bars: true, time: true }, DRAW_DEF.ruler || {});
    const dPct = (r.p2.price - r.p1.price) / r.p1.price * 100;
    const bars = Math.round(Math.abs(r.p2.t - r.p1.t) / this._iv());
    const mins = bars * this._iv() / 60;
    const tm = mins >= 60 ? (mins / 60).toFixed(1) + 'ч' : mins + 'м';
    const parts = [];
    if (o.pct) parts.push(`${dPct > 0 ? '+' : ''}${dPct.toFixed(2)}%`);
    if (o.px) parts.push(this._fmt(Math.abs(r.p2.price - r.p1.price)));
    if (o.bars && o.time) parts.push(`${bars} бар (${tm})`);
    else if (o.bars) parts.push(`${bars} бар`);
    else if (o.time) parts.push(tm);
    if (!parts.length) return;
    const label = parts.join(' · ');
    const tw = ctx.measureText(label).width;
    const bx = (x1 + x2) / 2 - tw / 2 - 5, by = Math.min(y1, y2) - 22;
    ctx.fillStyle = 'rgba(13,17,23,0.92)';
    ctx.fillRect(bx, by, tw + 10, 16);
    ctx.strokeStyle = col + ',0.9)';
    ctx.strokeRect(bx, by, tw + 10, 16);
    ctx.fillStyle = up ? '#26a69a' : '#ef5350';
    ctx.fillText(label, bx + 5, by + 11);
  }

  _handles(ctx, pts, col) {
    for (const [x, y] of pts) {
      ctx.fillStyle = '#0d1117';
      ctx.strokeStyle = col || '#58a6ff';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
  }
}

</script>
<script>
/* Надстройка над DrawTools (draw.js): всё, что делает рисование «кликабельным» без клавиш.
   - плавающая панель у выделенного рисунка: цвет, толщина, заливка, дубль, удаление, «⋮»
   - меню рисунка (правый клик или «⋮»): оповещение на уровне, дубль, порядок, удалить
   - настройки инструмента по долгому нажатию на значок (фибо, линейка, цвета по умолчанию)
   - ввод и правка текстовой метки
   Методы дописываются в прототип, поэтому файл грузится строго после draw.js. */
Object.assign(DrawTools.prototype, {

  /* ---------- долгое нажатие ---------- */
  // fn срабатывает через 450 мс удержания (тач, мышь) или по правому клику на значке
  _longPress(btn, fn) {
    let timer = null, sx = 0, sy = 0;
    const cancel = () => { clearTimeout(timer); timer = null; };
    btn.addEventListener('pointerdown', e => {
      if (e.button > 0) return;
      btn._lp = false;
      sx = e.clientX; sy = e.clientY;
      cancel();
      timer = setTimeout(() => { timer = null; btn._lp = true; fn(); }, 450);
    });
    btn.addEventListener('pointermove', e => {
      if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) cancel();
    });
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) btn.addEventListener(ev, cancel);
    // правый клик и системное меню долгого нажатия (Android) ведут туда же
    btn.addEventListener('contextmenu', e => { e.preventDefault(); cancel(); btn._lp = false; fn(); });
  },

  /* ---------- дублировать, порядок ---------- */
  duplicateSel() {
    if (!this.sel.length) return;
    this._pushHistory();
    const d = this._screenDelta(18, 18);   // копия чуть правее и ниже, чтобы было видно
    const ns = [];
    for (const i of [...this.sel].sort((a, b) => a - b)) {
      if (!this.items[i]) continue;
      const it = JSON.parse(JSON.stringify(this.items[i]));
      this._shift(it, d.dt, d.dp);
      this.items.push(it);
      ns.push(this.items.length - 1);
    }
    this.sel = ns;
    this._save();
    this.cv.requestDraw();
    this._toast('Копия создана');
  },

  // front = true: на передний план, false: на задний. Порядок в списке = порядок наложения
  zOrder(front) {
    if (!this.sel.length) return;
    this._pushHistory();
    const idx = [...this.sel].sort((a, b) => a - b);
    const chosen = idx.map(i => this.items[i]).filter(Boolean);
    const rest = this.items.filter((_, i) => !idx.includes(i));
    this.items = front ? rest.concat(chosen) : chosen.concat(rest);
    this.sel = chosen.map((_, k) => front ? rest.length + k : k);
    this._save();
    this.cv.requestDraw();
    this._toast(front ? 'На переднем плане' : 'На заднем плане');
  },

  // стиль у всех выделенных сразу
  _styleSel(patch) {
    if (!this.sel.length) return;
    this._pushHistory();
    for (const i of this.sel) if (this.items[i]) Object.assign(this.items[i], patch);
    this._save();
    this.cv.requestDraw();
  },

  /* ---------- плавающая панель у выделенного ---------- */
  _panelBuild() {
    const fp = document.createElement('div');
    fp.className = 'draw-fp';
    fp.hidden = true;
    const btn = (cls, icon, title) => `<button type="button" class="${cls}" title="${title}">${DRAW_ICONS[icon]}</button>`;
    fp.innerHTML =
      '<div class="fp-colors">' + DRAW_PALETTE.map(c =>
        `<button type="button" class="fp-c" data-c="${c}" style="--c:${c}" title="Цвет"></button>`).join('') + '</div>' +
      '<div class="fp-widths">' + DRAW_WIDTHS.map(w =>
        `<button type="button" class="fp-w" data-w="${w}" title="Толщина"><i style="height:${w}px"></i></button>`).join('') + '</div>' +
      btn('fp-fill', 'fill', 'Заливка: нет, лёгкая, плотная') +
      '<button type="button" class="fp-sz" title="Размер текста">A</button>' +
      btn('fp-edit', 'edit', 'Изменить текст') +
      btn('fp-gear', 'gear', 'Уровни и оформление') +
      '<span class="fp-sep"></span>' +
      btn('fp-dup', 'copy', 'Дублировать') +
      btn('fp-del', 'trash', `Удалить · Delete`) +
      btn('fp-more', 'dots', 'Меню рисунка (то же, что правый клик)');
    // клики внутри панели до графика не доходят: выделение не слетает
    fp.addEventListener('pointerdown', e => e.stopPropagation());
    fp.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (e.detail) b.blur();   // после клика мышью фокус со значка снимаем, чтобы Enter не нажал его снова
      const items = this.sel.map(i => this.items[i]).filter(Boolean);
      if (!items.length) return;
      const one = this.sel.length === 1 ? this.sel[0] : null;
      if (b.classList.contains('fp-c')) this._styleSel({ c: b.dataset.c });
      else if (b.classList.contains('fp-w')) this._styleSel({ w: +b.dataset.w });
      else if (b.classList.contains('fp-fill')) {
        const cur = DRAW_FILLS.indexOf(items[0].fa != null ? items[0].fa : DRAW_FILLS[1]);
        this._styleSel({ fa: DRAW_FILLS[(cur + 1) % DRAW_FILLS.length] });
      } else if (b.classList.contains('fp-sz')) {
        const cur = TEXT_SIZES.indexOf(items[0].sz || TEXT_SIZES[1]);
        this._styleSel({ sz: TEXT_SIZES[(cur + 1) % TEXT_SIZES.length] });
      } else if (b.classList.contains('fp-edit') && one != null) {
        const it = this.items[one];
        this._textOpen({ t: it.t, price: it.price }, one);
      } else if (b.classList.contains('fp-gear') && one != null) this._formOpen(this.items[one].type, one, b);
      else if (b.classList.contains('fp-dup')) this.duplicateSel();
      else if (b.classList.contains('fp-del')) this._deleteSelected();
      else if (b.classList.contains('fp-more') && one != null) {
        const r = b.getBoundingClientRect(), c = this.cv.el.getBoundingClientRect();
        this._itemMenu(one, r.left - c.left, r.bottom - c.top + 4);
      }
      this._fpSig = null;
      this._panelUpdate();
    });
    this.cv.el.appendChild(fp);
    this._fp = fp;
    return fp;
  },

  // экранная «точка привязки» рисунка для панели: { ax, top, bottom } или null, если он вне поля
  _itemAnchor(it, m, paneW, paneH) {
    const k = DRAW_KIND[it.type];
    let l, r, t, b, ax;
    if (it.type === 'hray') {
      const y = m.yOf(it.price); if (y == null) return null;
      const x0 = m.X(it.t);
      l = Math.max(x0, 0); r = paneW; t = b = y; ax = Math.min(l + 90, paneW - 90);
    } else if (it.type === 'vline') {
      const x0 = m.X(it.t);
      l = r = ax = x0; t = b = 44;
    } else if (it.type === 'cross') {
      const y = m.yOf(it.price); if (y == null) return null;
      l = r = ax = m.X(it.t); t = b = y;
    } else if (it.type === 'text') {
      const bx = this._textBox(it, m); if (!bx) return null;
      l = bx.l; r = bx.r; t = bx.t; b = bx.b; ax = (l + r) / 2;
    } else if (k === 'many') {
      const ys = it.pts.map(p => m.yOf(p.price));
      if (ys.some(v => v == null)) return null;
      const xs = it.pts.map(p => m.X(p.t));
      l = Math.min(...xs); r = Math.max(...xs); t = Math.min(...ys); b = Math.max(...ys); ax = (l + r) / 2;
    } else {
      const y1 = m.yOf(it.p1.price), y2 = m.yOf(it.p2.price);
      if (y1 == null || y2 == null) return null;
      const x1 = m.X(it.p1.t), x2 = m.X(it.p2.t);
      l = Math.min(x1, x2); r = Math.max(x1, x2); t = Math.min(y1, y2); b = Math.max(y1, y2);
      if (it.type === 'fib' && it.ext) r = paneW;
      ax = (Math.max(l, 0) + Math.min(r, paneW)) / 2;
    }
    if (r < 0 || l > paneW || b < 0 || t > paneH) return null;   // рисунок за краем экрана
    return { ax, top: t, bottom: b };
  },

  _panelUpdate() {
    const fp = this._fp;
    const items = this.sel.map(i => this.items[i]).filter(Boolean);
    const busy = this.drag && this.drag.moved;   // пока тянем - панель не мешает
    if (!items.length || this.tool !== 'cursor' || this.draft || this.hidden || busy || this._textEl || !this.cv.candles) {
      if (fp) fp.hidden = true;
      return;
    }
    const m = this._screen();
    if (!m.xOf) { if (fp) fp.hidden = true; return; }
    const paneW = this.cv._paneW(), paneH = this.cv._paneH();
    const anchors = items.map(it => this._itemAnchor(it, m, paneW, paneH)).filter(Boolean);
    if (!anchors.length) { if (fp) fp.hidden = true; return; }

    const box = fp || this._panelBuild();
    // состав кнопок и подсветка зависят от того, что выделено; пересчитываем, только если это поменялось
    const sig = JSON.stringify(items.map(i => [i.type, i.c, i.w, i.fa, i.sz]));
    if (sig !== this._fpSig) {
      this._fpSig = sig;
      const all = t => items.every(i => t.includes(i.type));
      const first = items[0], one = items.length === 1;
      const show = (sel, v) => { const el = box.querySelector(sel); if (el) el.hidden = !v; };
      show('.fp-widths', !all(['text']));
      show('.fp-fill', all(['rect', 'ellipse']));
      show('.fp-sz', all(['text']));
      show('.fp-edit', one && first.type === 'text');
      show('.fp-gear', one && first.type === 'fib');
      show('.fp-more', one);
      const c0 = dCol(first), sameC = items.every(i => dCol(i) === c0);
      box.querySelectorAll('.fp-c').forEach(b => b.classList.toggle('on', sameC && b.dataset.c.toLowerCase() === c0.toLowerCase()));
      const w0 = dWid(first);
      const near = DRAW_WIDTHS.reduce((a, b) => Math.abs(b - w0) < Math.abs(a - w0) ? b : a);
      box.querySelectorAll('.fp-w').forEach(b => b.classList.toggle('on', +b.dataset.w === near));
      const fa = first.fa != null ? first.fa : DRAW_FILLS[1];
      const fb = box.querySelector('.fp-fill');
      if (fb) fb.style.setProperty('--lvl', fa ? String(0.35 + fa * 2) : '0.25');
      const zb = box.querySelector('.fp-sz');
      if (zb) zb.textContent = first.sz || TEXT_SIZES[1];
    }

    box.hidden = false;
    const top = Math.min(...anchors.map(a => a.top)), bottom = Math.max(...anchors.map(a => a.bottom));
    const ax = anchors.reduce((s, a) => s + a.ax, 0) / anchors.length;
    const w = box.offsetWidth, h = box.offsetHeight;
    const W = this.cv.el.clientWidth, H = this.cv._paneH();
    let y = top - h - 12;
    if (y < 4) y = bottom + 12;                       // сверху нет места - под рисунком
    y = Math.max(4, Math.min(y, H - h - 4));
    let x = Math.max(4, Math.min(ax - w / 2, W - w - 4));
    // не налезаем на панель инструментов слева, если по высоте пересекаемся с ней
    const bar = this.bar;
    if (bar && y < bar.offsetTop + bar.offsetHeight && y + h > bar.offsetTop) {
      const minX = bar.offsetLeft + bar.offsetWidth + 6;
      if (minX + w + 4 <= W) x = Math.max(x, minX);
    }
    box.style.left = x + 'px';
    box.style.top = y + 'px';
  },

  /* ---------- меню рисунка ---------- */
  // цена, на которую ставим оповещение: у уровня - его цена, у фигуры - ближайшая к клику грань
  _itemLevel(it, yScr) {
    const ser = this.cv.series;
    const pick = arr => arr.reduce((a, b) =>
      Math.abs((ser.priceToCoordinate(b) ?? 1e9) - yScr) < Math.abs((ser.priceToCoordinate(a) ?? 1e9) - yScr) ? b : a);
    switch (it.type) {
      case 'hray': case 'cross': case 'text': return it.price;
      case 'trend': case 'rect': case 'ellipse': return pick([it.p1.price, it.p2.price]);
      case 'fib': return pick(this._fibLevels(it).map(l => l.price));
      default: return ser.coordinateToPrice(yScr);
    }
  },

  _itemMenu(i, x, y) {
    const it = this.items[i];
    if (!it) return;
    const lvl = this._itemLevel(it, y);
    const rows = [];
    if (lvl != null && lvl > 0) rows.push({ icon: 'bell', label: `Оповещение на ${this._fmt(lvl)}`, fn: () => this._sendAlert(lvl) });
    if (it.type === 'text') rows.push({ icon: 'edit', label: 'Изменить текст', fn: () => this._textOpen({ t: it.t, price: it.price }, this.items.indexOf(it)) });
    if (it.type === 'fib') rows.push({ icon: 'gear', label: 'Уровни и оформление', fn: () => this._formOpen('fib', this.items.indexOf(it), null) });
    rows.push({ icon: 'copy', label: 'Дублировать', fn: () => this.duplicateSel() });
    rows.push({ sep: true });
    rows.push({ icon: 'front', label: 'На передний план', fn: () => this.zOrder(true) });
    rows.push({ icon: 'back', label: 'На задний план', fn: () => this.zOrder(false) });
    rows.push({ sep: true });
    rows.push({ icon: 'trash', label: 'Удалить', danger: true, fn: () => this._deleteSelected() });
    this._ctxShow(x, y, DRAW_NAMES[it.type] || 'Рисунок', rows);
  },

  /* ---------- текстовая метка ---------- */
  // Нажатие поставило точку; поле ввода откроется по click (см. конструктор) или через 350 мс, если click не пришёл
  _textPending(pos) {
    const p = { pos };
    this._textPend = p;
    setTimeout(() => { if (this._textPend === p) this._textPendingFire(); }, 350);
  },

  _textPendingFire() {
    const p = this._textPend;
    if (!p) return;
    this._textPend = null;
    if (this.tool === 'text' && !this._textEl) this._textOpen(p.pos, null);
  },

  // pos - куда ставим; idx - индекс существующей метки, если правим её
  _textOpen(pos, idx) {
    this._textClose(true);
    this._ctxClose();
    const m = this._screen();
    const x = m.X(pos.t), y = m.yOf(pos.price);
    if (y == null) return;
    const it = idx != null ? this.items[idx] : null;
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'draw-textin';
    inp.maxLength = 80;
    inp.placeholder = 'Текст…';
    inp.enterKeyHint = 'done';
    inp.autocomplete = 'off';
    inp.spellcheck = false;
    inp.value = it ? it.txt : '';
    const W = this.cv.el.clientWidth;
    inp.style.left = Math.max(4, Math.min(x, W - 190)) + 'px';
    inp.style.top = Math.max(4, y - 17) + 'px';
    inp.addEventListener('keydown', ev => {
      ev.stopPropagation();   // буквы и Esc не должны включать инструменты
      if (ev.key === 'Enter') { ev.preventDefault(); this._textClose(true); }
      else if (ev.key === 'Escape') { ev.preventDefault(); this._textClose(false); }
    });
    inp.addEventListener('pointerdown', ev => ev.stopPropagation());
    inp.addEventListener('blur', () => { if (this._textEl === inp) this._textClose(true); });
    this._textEl = inp;
    this._textCtx = { pos, idx };
    this.cv.el.appendChild(inp);
    inp.focus();
    inp.select();
    this._panelUpdate();
  },

  _textClose(commit) {
    this._textPend = null;
    const inp = this._textEl;
    if (!inp) return;
    const c = this._textCtx;
    this._textEl = null;
    this._textCtx = null;
    const val = inp.value.trim();
    inp.remove();
    if (!commit || !val) { this.cv.requestDraw(); return; }
    if (c.idx != null) {
      const it = this.items[c.idx];
      if (it && it.txt !== val) { this._pushHistory(); it.txt = val; this._save(); }
    } else {
      this._pushHistory();
      this.items.push(this._newItem('text', { t: c.pos.t, price: c.pos.price, txt: val }));
      this.sel = [this.items.length - 1];
      this._save();
      this.setTool('cursor');
    }
    this.cv.requestDraw();
  },

  /* ---------- настройки инструмента ---------- */
  /* kind - тип рисунка или ruler. idx == null: настройки «по умолчанию» для новых рисунков
     (то, что открывается долгим нажатием на значок); иначе правим уже нарисованный рисунок.
     Изменения применяются сразу, кнопки «Готово» нет. */
  _formOpen(kind, idx, anchor) {
    this._formClose();
    this._textClose(true);
    this._ctxClose();
    const it = idx != null ? this.items[idx] : null;
    if (idx != null && !it) return;
    const box = document.createElement('div');
    box.className = 'draw-form';
    this.formEl = box;
    this._formKind = kind;
    this._formIdx = idx;
    this._formHist = false;

    const cur = () => it ? it : (kind === 'ruler' ? Object.assign({ pct: true, px: true, bars: true, time: true }, DRAW_DEF.ruler || {}) : drawStyleFor(kind));
    const set = patch => {
      if (it) {
        if (!this._formHist) { this._pushHistory(); this._formHist = true; }   // вся правка в форме - один шаг отмены
        Object.assign(it, patch);
        this._save();
      } else {
        DRAW_DEF[kind] = Object.assign(DRAW_DEF[kind] || {}, patch);
        drawDefSave();
      }
      this.cv.requestDraw();
      draw();
    };

    const draw = () => {
      const v = cur();
      const sw = DRAW_PALETTE.map(c =>
        `<button type="button" class="df-c${dCol(v.c ? v : { type: kind }).toLowerCase() === c ? ' on' : ''}" data-c="${c}" style="--c:${c}"></button>`).join('');
      const seg = (name, opts, val) => opts.map(([label, o]) =>
        `<button type="button" class="df-s${o === val ? ' on' : ''}" data-${name}="${o}">${label}</button>`).join('');
      const chk = (name, label, on) =>
        `<label class="df-k${on ? ' on' : ''}"><input type="checkbox" data-k="${name}"${on ? ' checked' : ''}><span>${label}</span></label>`;
      let h = `<div class="dh-head"><b>${DRAW_NAMES[kind]}: настройки</b><button type="button" class="dh-x" title="Закрыть · Esc">×</button></div>` +
              `<div class="df-note">${it ? 'Только для этого рисунка' : 'Для новых рисунков'}</div>`;
      if (kind === 'ruler') {
        h += '<div class="df-cap">Что показывать в подписи</div><div class="df-checks">' +
             chk('pct', 'Изменение, %', v.pct) + chk('px', 'Изменение цены', v.px) +
             chk('bars', 'Число баров', v.bars) + chk('time', 'Время', v.time) + '</div>';
      } else {
        h += `<div class="df-cap">Цвет</div><div class="df-row">${sw}</div>`;
        if (kind !== 'text') {
          const w0 = v.w || DRAW_WIDTH0[kind];
          const near = DRAW_WIDTHS.reduce((a, b) => Math.abs(b - w0) < Math.abs(a - w0) ? b : a);
          h += `<div class="df-cap">Толщина</div><div class="df-row">${seg('w', [['тонкая', 1], ['средняя', 2], ['толстая', 3.5]], near)}</div>`;
        }
        if (kind === 'rect' || kind === 'ellipse') {
          h += `<div class="df-cap">Заливка</div><div class="df-row">${seg('fa', [['нет', 0], ['лёгкая', 0.12], ['плотная', 0.28]], v.fa != null ? v.fa : 0.12)}</div>`;
        }
        if (kind === 'text') {
          h += `<div class="df-cap">Размер</div><div class="df-row">${seg('sz', TEXT_SIZES.map(s => [String(s), s]), v.sz || TEXT_SIZES[1])}</div>`;
        }
        if (kind === 'fib') {
          const lv = v.lv || FIB_LEVELS0;
          h += '<div class="df-cap">Уровни (0 - конец, 1 - начало рисунка)</div><div class="df-lv">' +
               FIB_LEVELS_ALL.map(l => `<button type="button" class="df-l${lv.includes(l) ? ' on' : ''}" data-l="${l}">${l}</button>`).join('') + '</div>' +
               '<div class="df-checks">' + chk('ext', 'Продлить линии вправо', v.ext) + chk('lab', 'Подписи: уровень и цена', v.lab) + '</div>';
        }
      }
      if (!it) h += '<button type="button" class="df-reset">Сбросить настройки инструмента</button>';
      box.innerHTML = h;
    };

    box.addEventListener('pointerdown', e => e.stopPropagation());
    box.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.classList.contains('dh-x')) this._formClose();
      else if (b.classList.contains('df-c')) set({ c: b.dataset.c });
      else if (b.dataset.w != null) set({ w: +b.dataset.w });
      else if (b.dataset.fa != null) set({ fa: +b.dataset.fa });
      else if (b.dataset.sz != null) set({ sz: +b.dataset.sz });
      else if (b.dataset.l != null) {
        const l = +b.dataset.l, lv = (cur().lv || FIB_LEVELS0).slice();
        const k = lv.indexOf(l);
        if (k >= 0) { if (lv.length > 1) lv.splice(k, 1); } else lv.push(l);   // хоть один уровень оставляем
        set({ lv: lv.sort((a, c) => a - c) });
      } else if (b.classList.contains('df-reset')) {
        delete DRAW_DEF[kind];
        drawDefSave();
        draw();
        this._toast('Настройки сброшены');
      }
    });
    box.addEventListener('change', e => {
      const k = e.target.dataset && e.target.dataset.k;
      if (k) set({ [k]: kind === 'fib' ? (e.target.checked ? 1 : 0) : e.target.checked });
    });
    draw();

    // на телефоне форма не влезает в график (он низкий и обрезает всё, что выходит за край):
    // показываем её листом снизу поверх страницы
    if (matchMedia('(pointer: coarse), (max-width: 760px)').matches) {
      box.classList.add('sheet');
      document.body.appendChild(box);
      this._bindFormOutside();
      return;
    }
    this.cv.el.appendChild(box);

    // рядом со значком (или с панелью у рисунка), но не за краем графика
    const cr = this.cv.el.getBoundingClientRect();
    const ar = (anchor || this.bar).getBoundingClientRect();
    const br = this.bar.getBoundingClientRect();
    const w = box.offsetWidth, h = box.offsetHeight;
    const fromPanel = anchor && anchor.closest('.draw-fp');
    // от значка инструмента: правее всей панели (она в две колонки), по высоте вровень со значком
    const left = fromPanel ? ar.left - cr.left : br.right - cr.left + 8;
    const top = fromPanel ? ar.bottom - cr.top + 6 : ar.top - cr.top;
    box.style.left = Math.max(4, Math.min(left, cr.width - w - 4)) + 'px';
    box.style.top = Math.max(4, Math.min(top, cr.height - h - 4)) + 'px';

    this._bindFormOutside();
  },

  // клик мимо закрывает форму (один слушатель на график)
  _bindFormOutside() {
    if (this._formOutside) return;
    this._formOutside = ev => {
      if (!this.formEl) return;
      const t = ev.target instanceof Element ? ev.target : null;
      if (t && (t.closest('.draw-form') || t.closest('.draw-toolbar button') || t.closest('.draw-fp'))) return;
      this._formClose();
    };
    window.addEventListener('pointerdown', this._formOutside, true);
  },

  _formClose() {
    if (this.formEl) { this.formEl.remove(); this.formEl = null; }
  },
});

</script>
<script>
/* Снимок графика: одна PNG-картинка из свечей, авторазметки SMC, рисунков пользователя
   и подписи канала. Кнопка-камера в шапке открывает меню «Скачать» / «Скопировать».

   Как собирается кадр (снизу вверх, ровно как на экране):
     1. фон #0d1117: у графика он прозрачный, а PNG с прозрачностью в чатах выглядит грязно
     2. chart.takeScreenshot(): свечи, сетка, шкалы, маркеры SFP и ножей. Холст в физических
        пикселях экрана, поэтому на retina снимок чёткий
     3. авторазметка SMC (ChartView._paint) и рисунки пользователя (DrawTools._paint)
        рисуются заново прямо на этот холст в физических пикселях, а не копируются готовыми
        канвасами с экрана: линии остаются чёткими, а ручки выделения в кадр не попадают
     4. название монеты и таймфрейм, подпись канала
   Шапка, список монет, панель инструментов и кнопки в кадр не попадают: они DOM, не холст.
   Снимок каждый раз собирается заново из текущего состояния, ничего не кэшируется. */
const Shot = (() => {
  const CHANNEL_TAG = '@gmvtrader';   // подпись на снимке: юзернейм Telegram-канала GMV TRADES
  const BG = '#0d1117';
  const q = s => document.querySelector(s);

  /* ---------- где мы запущены ---------- */

  // Telegram.WebApp есть и в обычном браузере (скрипт грузится всегда), но platform там 'unknown'
  const tgApp = () => {
    const t = window.Telegram && window.Telegram.WebApp;
    return t && t.platform && t.platform !== 'unknown' ? t : null;
  };
  // Мобильные и Apple-клиенты открывают Mini App в системном WebView. Клик по
  // <a download> с blob-ссылкой там не скачивает, а может УВЕСТИ WebView на картинку,
  // и Mini App придётся открывать заново. Поэтому внутри Telegram ссылки не кликаем.
  const clipboardOK = () => !!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem);

  /* ---------- активный график ---------- */

  function activeChart() {
    try {
      const slot = CHART_SLOTS[state.mode];
      return slot ? charts[slot[0]] : null;
    } catch (e) { return null; }
  }

  function isReady(cv) {
    return !!(cv && cv.candles && cv.candles.length && cv.el.clientWidth > 0 && cv.el.clientHeight > 0
      && typeof cv.chart.takeScreenshot === 'function');
  }

  /* ---------- сборка кадра ---------- */

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // «ENAUSDT · 15M» в левом верхнем углу, как легенда на экране (без OHLC под курсором)
  function drawTitle(ctx, cv) {
    const t = cv._title;
    if (!t) return;
    ctx.save();
    ctx.font = '11px ui-monospace, Menlo, monospace';
    const tw = ctx.measureText(t).width;
    ctx.fillStyle = 'rgba(13,17,23,0.65)';
    roundRect(ctx, 8, 6, tw + 14, 19, 4);
    ctx.fill();
    ctx.fillStyle = '#c9d1d9';
    ctx.textBaseline = 'middle';
    ctx.fillText(t, 15, 15.5);
    ctx.restore();
  }

  // Подпись в правом нижнем углу области свечей. Размер считаем от ширины картинки, а не
  // от CSS-пикселей: снимок чаще смотрят уменьшенным в чате, и подпись должна остаться читаемой.
  // Под текстом лёгкая тёмная плашка: внизу графика часто лежат подписи уровней ($$$ EQL),
  // и без плашки подпись сливалась бы с ними в кашу
  function drawWatermark(ctx, W, paneW, paneH) {
    const fs = Math.max(20, Math.round(W * 0.013));
    const padX = Math.round(fs * 0.55), padY = Math.round(fs * 0.3);
    const margin = Math.round(fs * 0.55);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.font = `600 ${fs}px -apple-system, "Helvetica Neue", Arial, sans-serif`;
    const tw = ctx.measureText(CHANNEL_TAG).width;
    const bw = tw + padX * 2, bh = fs + padY * 2;
    const bx = paneW - margin - bw, by = paneH - margin - bh;
    ctx.fillStyle = 'rgba(13,17,23,0.55)';
    roundRect(ctx, bx, by, bw, bh, Math.round(bh * 0.3));
    ctx.fill();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(230,237,243,0.72)';
    ctx.fillText(CHANNEL_TAG, bx + padX, by + bh / 2 + fs * 0.04);
    ctx.restore();
  }

  function build(cv) {
    // после касания на телефоне перекрестие остаётся на графике: в кадре оно не нужно
    try { cv.chart.clearCrosshairPosition(); } catch (e) {}

    // takeScreenshot сам дорисовывает отложенные изменения графика, поэтому разметку
    // считаем ПОСЛЕ него: координаты цена→пиксель уже актуальны
    const base = cv.chart.takeScreenshot();
    const W = base.width, H = base.height;
    const out = document.createElement('canvas');
    out.width = W; out.height = H;
    // alpha:false: фон всё равно сплошной, зато PNG получается заметно меньше и кодируется
    // быстрее. willReadFrequently: холст в памяти, без обратного чтения с видеокарты при toBlob
    const ctx = out.getContext('2d', { alpha: false, willReadFrequently: true });
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(base, 0, 0);

    // Физических пикселей на CSS-пиксель: разметка знает только CSS-координаты. Холст
    // библиотеки всегда равен CSS-размер графика × devicePixelRatio, поэтому берём именно
    // DPR, а не отношение к el.clientWidth/Height: у графика бывает на пиксель меньше
    // контейнера (дробная высота), и отношение давало бы ошибку масштаба до пикселя внизу
    const dpr = window.devicePixelRatio || 1;
    const k = Math.abs(W / cv.el.clientWidth - dpr) < 0.05 ? dpr : W / cv.el.clientWidth;
    ctx.save();
    ctx.setTransform(k, 0, 0, k, 0, 0);
    cv._paint(ctx);                                       // OB, FVG, ликвидность, BOS/ЧоЧ, полосы, стены
    if (cv.drawTools) cv.drawTools._paint(ctx, true);     // линии, лучи, траектории, линейка
    drawTitle(ctx, cv);
    ctx.restore();
    drawWatermark(ctx, W, cv._paneW() * k, cv._paneH() * k);
    return { canvas: out, w: W, h: H };
  }

  const toBlob = canvas => new Promise((res, rej) =>
    canvas.toBlob(b => (b ? res(b) : rej(new Error('toBlob вернул null'))), 'image/png'));

  function fileName() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const stamp = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
    let tf = '';
    try { tf = TF_CFG[state.mode].label; } catch (e) {}
    return `GMV_${state.symbol || 'chart'}_${tf}_${stamp}.png`;
  }

  /* ---------- подсказки на экране ---------- */

  const ICO_OK = '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 9.6 7.4 13.2 14.4 5.4"/></svg>';
  const ICO_WAIT = '<svg class="spin" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 2.5a6.5 6.5 0 1 0 6.5 6.5"/></svg>';
  const ICO_WARN = '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 4.4v5.6"/><circle cx="9" cy="13.2" r=".6" fill="currentColor"/></svg>';
  let toastEl = null, toastTimer = null;

  // Короткая подсказка внизу экрана. Успех держится 1,6 с, пояснения (откат на «Скачать»,
  // «график ещё загружается») дольше: их нужно успеть прочитать. Без модальных окон
  function toast(text, kind = 'ok') {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.id = 'toast';
      toastEl.setAttribute('role', 'status');
      toastEl.setAttribute('aria-live', 'polite');
      document.body.appendChild(toastEl);
    }
    toastEl.className = 'show ' + kind;
    toastEl.innerHTML = (kind === 'ok' ? ICO_OK : kind === 'wait' ? ICO_WAIT : ICO_WARN) + '<span></span>';
    toastEl.querySelector('span').textContent = text;
    clearTimeout(toastTimer);
    // «wait» снимается сам, когда действие закончилось; страховочный таймер на случай зависания
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), kind === 'ok' ? 1600 : kind === 'wait' ? 12000 : 3400);
  }

  // «Готовлю снимок…» убираем, как только снимок готов: дальше человек выбирает, куда его деть,
  // и подсказка не должна висеть над системным окном «Поделиться»
  function clearWait() {
    if (toastEl && toastEl.classList.contains('wait')) toastEl.classList.remove('show');
  }

  // На медленных телефонах кодирование PNG заметно: если снимок не готов за 0,45 с,
  // показываем «Готовлю снимок…», а по завершении убираем подсказку, если её никто не заменил
  async function withBusyHint(fn) {
    const t = setTimeout(() => toast('Готовлю снимок…', 'wait'), 450);
    try { return await fn(); }
    finally {
      clearTimeout(t);
      if (toastEl && toastEl.classList.contains('wait')) toastEl.classList.remove('show');
    }
  }

  /* ---------- доставка картинки ---------- */

  function anchorDownload(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);   // браузеру нужно время дочитать blob
  }

  const why = e => (e && e.name === 'NotAllowedError') ? 'нет разрешения на буфер обмена'
    : (e && e.name === 'SecurityError') ? 'запрещено настройками'
    : (e && e.name) || 'ошибка';

  // null при успехе, иначе объект ошибки. Promise внутри ClipboardItem нужен Safari и WebView
  // на его движке: они требуют начать запись в момент клика, до того как blob готов
  async function writeClipboard(blobP) {
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blobP })]);
      return null;
    } catch (e1) {
      if (e1 instanceof TypeError) {   // старые движки не принимают Promise, отдаём готовый blob
        try {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': await blobP })]);
          return null;
        } catch (e2) { return e2; }
      }
      return e1;
    }
  }

  /* Окно со снимком: последний рубеж внутри Telegram, где код не может ни скачать файл,
     ни открыть системное «Поделиться». Картинку сохраняют сами: долгое нажатие на телефоне
     или правый клик на компьютере. Это единственное место, где мы показываем окно. */
  let sheet = null, sheetUrl = null;

  function closeSheet() {
    if (sheet) { sheet.hidden = true; sheet.querySelector('img').removeAttribute('src'); }
    if (sheetUrl) { URL.revokeObjectURL(sheetUrl); sheetUrl = null; }
  }

  function openSheet(blob, name, tg) {
    if (!sheet) {
      sheet = document.createElement('div');
      sheet.id = 'shotSheet';
      sheet.hidden = true;
      sheet.setAttribute('role', 'dialog');
      sheet.setAttribute('aria-label', 'Снимок графика');
      sheet.innerHTML =
        '<div class="ss-card">' +
          '<div class="ss-head"><b>Снимок графика</b><button type="button" class="ss-x" aria-label="Закрыть">×</button></div>' +
          '<img alt="Снимок графика" draggable="false">' +
          '<p class="ss-hint"></p>' +
          '<div class="ss-btns"></div>' +
        '</div>';
      sheet.addEventListener('click', e => { if (e.target === sheet || e.target.closest('.ss-x')) closeSheet(); });
      document.body.appendChild(sheet);
    }
    closeSheet();
    sheetUrl = URL.createObjectURL(blob);
    sheet.querySelector('img').src = sheetUrl;

    const platform = tg ? tg.platform : '';
    const mobile = ['ios', 'android', 'android_x'].includes(platform);
    // Файл можно сохранить ссылкой-скачиванием только там, где это доказанно работает. Проверено на
    // Telegram Lite (Mac, платформа tdesktop): клик по <a download> и «Download Image» из меню картинки
    // молча ничего не сохраняют (WebView Telegram не обрабатывает загрузки), поэтому там кнопку не даём.
    const canDownload = ['weba', 'webk', 'unigram'].includes(platform);
    const file = new File([blob], name, { type: 'image/png' });
    let canShare = false;
    try { canShare = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) {}
    sheet.querySelector('.ss-hint').textContent = mobile
      ? 'Нажми на картинку и удерживай, затем выбери «Сохранить изображение» или «Поделиться».'
      : canDownload
        ? 'Скопируй снимок и вставь в чат, либо скачай файлом.'
        : 'Скопируй снимок и вставь в чат или пост. Telegram на компьютере не даёт мини-приложениям сохранять файлы.';

    const btns = sheet.querySelector('.ss-btns');
    btns.innerHTML = '';
    const add = (label, fn) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label;
      b.addEventListener('click', fn);
      btns.appendChild(b);
    };
    if (clipboardOK()) {
      add('Скопировать', async () => {
        const err = await writeClipboard(Promise.resolve(blob));
        if (err) toast(`Не удалось скопировать (${why(err)})`, 'warn'); else toast('Скопировано в буфер');
      });
    }
    // Системное «Поделиться» (на Mac: AirDrop, Почта, Сообщения, Заметки): из кнопки, то есть по свежему нажатию
    if (canShare) {
      add('Поделиться…', async () => {
        try { await navigator.share({ files: [file], title: 'GMV TRADES' }); }
        catch (e) { if (!e || e.name !== 'AbortError') toast('Не удалось открыть «Поделиться»', 'warn'); }
      });
    }
    if (canDownload) {
      add('Скачать файл', () => { anchorDownload(blob, name); toast('Снимок сохранён'); });
    }
    sheet.hidden = false;
  }

  /* Обычный браузер: скачиваем файлом. Внутри Telegram: системное «Поделиться» с файлом,
     где оно есть, иначе окно со снимком. Telegram.WebApp.downloadFile здесь не годится:
     он принимает только https-ссылку на файл в интернете, а наш снимок существует лишь
     в памяти страницы, сервера, куда его можно выложить, у скринера нет. */
  async function deliver(blob, name, reason) {
    // reason: почему пришлось откатиться на «Скачать» (копирование не вышло). Итог показываем
    // ОДНИМ сообщением: два тоста подряд, и причину человек бы не успел прочитать
    const say = (plain, withReason) => reason ? toast(`${reason}. ${withReason}`, 'warn') : toast(plain);
    const tg = tgApp();
    if (!tg) {
      anchorDownload(blob, name);
      say('Снимок сохранён', 'Снимок сохранён файлом');
      return 'download';
    }
    clearWait();
    const file = new File([blob], name, { type: 'image/png' });
    let canShare = false;
    // «Поделиться» только на телефоне. На компьютере (Telegram Lite на Mac проверен) системное окно
    // предлагает AirDrop, почту и контакты, но НЕ «сохранить в загрузки»: там нужно окно со снимком
    const mobile = ['ios', 'android', 'android_x'].includes(tg.platform);
    try { canShare = mobile && !!(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) {}
    if (canShare) {
      try {
        await navigator.share({ files: [file], title: 'GMV TRADES' });
        say('Готово', 'Открыл «Поделиться»');
        return 'share';
      } catch (e) {
        if (e && e.name === 'AbortError') return 'cancel';   // человек закрыл окно «Поделиться»
      }
    }
    openSheet(blob, name, tg);
    if (reason) toast(`${reason}. Снимок ниже, сохрани его отсюда`, 'warn');
    return 'sheet';
  }

  /* ---------- действия меню ---------- */

  function prepare() {
    const cv = activeChart();
    if (!isReady(cv)) { toast('График ещё загружается', 'warn'); return null; }
    let shot;
    try { shot = build(cv); } catch (e) {
      console.error(e);
      toast('Не удалось собрать снимок', 'warn');
      return null;
    }
    api.last = { sym: state.symbol, tf: (TF_CFG[state.mode] || {}).label, w: shot.w, h: shot.h, at: Date.now() };
    return { blobP: toBlob(shot.canvas), name: fileName() };
  }

  async function download() {
    const p = prepare();
    if (!p) return null;
    return withBusyHint(async () => {
      try { return await deliver(await p.blobP, p.name); }
      catch (e) { console.error(e); toast('Не удалось создать снимок', 'warn'); return null; }
    });
  }

  async function copy() {
    const p = prepare();
    if (!p) return null;
    return withBusyHint(async () => {
      try {
        let reason;
        if (!clipboardOK()) {
          reason = 'Буфер обмена здесь недоступен';
        } else {
          const err = await writeClipboard(p.blobP);
          if (!err) { toast('Скопировано в буфер'); return 'copied'; }
          reason = `Не удалось скопировать (${why(err)})`;
        }
        return await deliver(await p.blobP, p.name, reason);
      } catch (e) {
        console.error(e);
        toast('Не удалось создать снимок', 'warn');
        return null;
      }
    });
  }

  /* ---------- кнопка в шапке ---------- */

  function setMenu(open) {
    const menu = q('#shotMenu'), btn = q('#btnShot');
    if (!menu || !btn) return;
    menu.hidden = !open;
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function init() {
    const btn = q('#btnShot'), menu = q('#shotMenu');
    if (!btn || !menu) return;
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (menu.hidden && !isReady(activeChart())) { toast('График ещё загружается', 'warn'); return; }
      setMenu(menu.hidden);
    });
    menu.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      setMenu(false);
      if (b.dataset.act === 'download') download(); else copy();
    });
    // на фазе перехвата: инструменты рисования гасят всплытие, обычный click мог не дойти
    document.addEventListener('pointerdown', e => {
      if (!e.target.closest('.shotpick')) setMenu(false);
    }, true);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { setMenu(false); closeSheet(); }
    });
  }

  // смена таймфрейма или монеты: закрываем меню и окно, чтобы старый снимок не висел на экране
  function reset() { setMenu(false); closeSheet(); }

  document.addEventListener('DOMContentLoaded', init);
  const api = { build, download, copy, reset, last: null };
  return api;
})();

</script>
<script>
/* Вкладка «Горячие клавиши»: полная шпаргалка на отдельной странице (не окошко поверх графика).
   Список берётся из DRAW_HELP, переключатель Mac / Windows меняет подписи клавиш, есть поиск
   и проверка нажатий: то, что пришло на страницу, видно сразу; если ничего не появилось -
   сочетание перехватила система или браузер.
   Открыть: значок клавиатуры в шапке, «?» на графике -> «Открыть вкладкой», адрес с #keys
   (внутри Telegram адрес не трогаем: там в хэше лежат параметры запуска). */
const Keys = (() => {
  let root = null, opened = false, mac = IS_MAC, query = '';

  const tgApp = () => (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) ? window.Telegram.WebApp : null;

  const TAG = { tv: 'как в TradingView', own: 'своё', none: 'только мышью' };

  // человеческое имя основной клавиши по event.code
  function keyName(e) {
    const c = e.code || '';
    if (/^Key[A-Z]$/.test(c)) return c.slice(3);
    if (/^Digit\d$/.test(c)) return c.slice(5);
    const map = { ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', Escape: 'Esc', Backspace: 'Backspace',
                  Delete: 'Delete', Enter: 'Enter', Space: 'Space', Tab: 'Tab', Backquote: '`', Minus: '-', Equal: '=' };
    return map[c] || c || e.key;
  }

  // что это сочетание делает в скринере (то же, что разбирает DrawTools._hotkey)
  function describe(e) {
    const mod = e.metaKey || e.ctrlKey, c = e.code;
    if (mod && e.altKey && c === 'KeyH') return 'Спрятать / показать всю разметку';
    if (mod && !e.altKey) {
      if (c === 'KeyZ') return 'Отменить последнее действие';
      if (c === 'KeyC') return 'Копировать выделенный рисунок';
      if (c === 'KeyV') return 'Вставить рисунок под курсор';
    }
    if (e.altKey && !mod) {
      const hk = DRAW_HOTKEYS.find(h => h.code === c && !!h.shift === e.shiftKey);
      if (hk) return 'Включить инструмент: ' + (DRAW_NAMES[hk.tool] || hk.tool);
      if (c === 'KeyH' && e.shiftKey) return 'Спрятать / показать всю разметку (запасное сочетание)';
      if (c === 'KeyS' && !e.shiftKey) return 'Магнит вкл / выкл';
      if (c === 'Backspace' || c === 'Delete') return 'Стереть все рисунки на монете';
    }
    if (!mod && !e.altKey) {
      if (c === 'Escape') return 'Вернуться к курсору, закрыть окно, снять выделение';
      if (c === 'Delete' || c === 'Backspace') return 'Удалить выделенное';
      if (/^Arrow/.test(c)) return 'Двигать выделенное' + (e.shiftKey ? ' (крупный шаг)' : '');
      if (c === 'Enter') return 'Закончить траекторию';
    }
    return null;
  }

  function combo(e) {
    const parts = [];
    if (e.ctrlKey) parts.push('Ctrl');
    if (e.altKey) parts.push(mac ? 'Option' : 'Alt');
    if (e.shiftKey) parts.push('Shift');
    if (e.metaKey) parts.push(mac ? 'Cmd' : 'Win');
    if (!/^(Control|Alt|Shift|Meta)/.test(e.code || '')) parts.push(keyName(e));
    return parts;
  }

  function listHtml() {
    const q = query.trim().toLowerCase();
    let out = '';
    for (const [title, rows] of DRAW_HELP) {
      const list = rows.filter(([label, ks]) => !q || label.toLowerCase().includes(q) ||
        ks.some(k => drawKeyLabel(k, mac).toLowerCase().includes(q)));
      if (!list.length) continue;
      out += `<h3>${title}</h3><div class="kp-list">` + list.map(([label, ks, tag]) =>
        `<div class="kp-row"><span class="kp-l">${label}${tag && tag !== 'none' ? `<em class="kp-tag ${tag}">${TAG[tag]}</em>` : ''}</span>` +
        `<span class="dh-keys">${drawKeysHtml(ks, mac)}</span></div>`).join('') + '</div>';
    }
    return out || '<div class="kp-empty">Ничего не нашлось. Попробуй другое слово: фибо, круг, Option.</div>';
  }

  function build() {
    if (root) return;
    root = document.createElement('section');
    root.id = 'keysPage';
    root.hidden = true;
    root.innerHTML =
      '<div class="kp-wrap">' +
        '<div class="kp-top">' +
          '<button type="button" class="kp-back">← К графику</button>' +
          '<h2>Горячие клавиши</h2>' +
          '<div class="kp-os" role="group" aria-label="Система">' +
            '<button type="button" data-os="mac">Mac</button><button type="button" data-os="win">Windows</button></div>' +
        '</div>' +
        '<p class="kp-lead">Клавиши не обязательны: все инструменты есть значками слева на графике, кликни и рисуй. ' +
          'Сочетания те же, что в TradingView (плашка «как в TradingView»), кроме отмеченных «своё».</p>' +
        '<input class="kp-search" type="search" placeholder="Найти: фибо, круг, Option, удалить…" autocomplete="off" spellcheck="false">' +
        '<div class="kp-body"></div>' +
        '<h3>Проверка клавиш</h3>' +
        '<div class="kp-test" tabindex="0" role="textbox" aria-readonly="true">' +
          '<div class="kp-hint">Кликни сюда и нажми любое сочетание. Так видно, дошла ли клавиша до страницы.</div>' +
          '<div class="kp-combo"></div><div class="kp-info"></div><div class="kp-verdict"></div>' +
        '</div>' +
        '<h3>Если сочетание не срабатывает</h3>' +
        '<ul class="kp-notes">' +
          '<li>Option на Mac и есть Alt: везде, где написано Alt, жми Option. Буква, которую Option печатает, в скринере не появится.</li>' +
          '<li>Esc внутри Telegram на компьютере до скринера не доходит, его забирает сам Telegram. Вернуться к курсору можно значком курсора или повторным кликом по значку включённого инструмента, а недорисованное отменяет правый клик.</li>' +
          '<li>Нажал, а в проверке выше пусто: сочетание перехватила система или браузер. Тот же инструмент включается значком слева.</li>' +
          '<li>Cmd+Option+H в macOS ещё и «Скрыть остальные» окна. Если сработало оно, а разметка на месте, прячь её запасным Shift+Option+H или значком глаза на панели.</li>' +
          '<li>Правый клик на трекпаде: касание двумя пальцами (Системные настройки, Трекпад) или Ctrl+клик. Ещё меню рисунка открывает кнопка ⋮ на его панели.</li>' +
          '<li>Клавиши работают, пока фокус в окне с графиком: кликни по графику, если печатал в поиске монет.</li>' +
        '</ul>' +
      '</div>';
    document.body.appendChild(root);

    root.querySelector('.kp-back').addEventListener('click', () => show(false));
    root.querySelector('.kp-os').addEventListener('click', e => {
      const b = e.target.closest('[data-os]');
      if (!b) return;
      mac = b.dataset.os === 'mac';
      render();
    });
    root.querySelector('.kp-search').addEventListener('input', e => { query = e.target.value; render(); });

    const test = root.querySelector('.kp-test');
    test.addEventListener('keydown', e => {
      if (e.repeat) return;
      e.preventDefault();
      e.stopPropagation();
      const parts = combo(e);
      test.querySelector('.kp-hint').hidden = true;
      test.querySelector('.kp-combo').innerHTML = parts.map(k => `<kbd>${k}</kbd>`).join('<i>+</i>');
      const mods = [['ctrlKey', 'Ctrl'], ['altKey', 'Alt/Option'], ['shiftKey', 'Shift'], ['metaKey', 'Cmd/Win']]
        .filter(([k]) => e[k]).map(([, n]) => n).join(' + ') || 'нет';
